<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf0"><title>YOS 実機確認</title><style>:root{--cream:#fffaf0;--navy:#17243d;--gold:#e2aa35;--orange:#ef8c3a;--muted:#6d7480;--line:rgba(23,36,61,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,rgba(226,170,53,.2),transparent 30%),linear-gradient(180deg,#fff8e8,var(--cream));color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:680px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 40px)}.top{display:flex;gap:11px;align-items:center}.sun{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffd976,var(--gold));font-weight:1000;box-shadow:0 10px 28px #e2aa3540}h1{font-size:28px;margin:0}.sub{font-size:10px;color:var(--muted)}.hero,.card{background:#ffffffdf;border:1px solid var(--line);box-shadow:0 18px 50px #17243d10}.hero{margin-top:16px;padding:17px;border-radius:25px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:12px 8px;border-radius:16px;background:#fff8e8}.metric small{display:block;color:var(--muted);font-size:9px}.metric b{display:block;margin-top:4px;font-size:23px}.now{margin-top:12px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#fff0d2,#fff8ea)}.now small{color:var(--orange);font-weight:900}.now h2{font-size:18px;margin:5px 0}.now p,.meta{font-size:11px;line-height:1.5;color:var(--muted)}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.nav button{border:1px solid var(--line);border-radius:14px;background:#ffffffbf;padding:11px 4px;color:var(--navy);font-weight:800}section{margin-top:25px}.card{padding:15px;border-radius:19px;margin:9px 0}.head{display:flex;gap:7px;align-items:center}.head strong{flex:1}.p{font-size:9px;font-weight:900;background:#fff0cf;color:#8a5a00;border-radius:99px;padding:4px 7px}.progress{height:6px;border-radius:99px;background:#edf0f3;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--orange))}.route{display:none}.route.on{display:block}.back{border:0;background:none;padding:8px 0;color:var(--orange);font-weight:900}.mock{padding:18px;border-radius:22px;background:#fff;border:1px solid var(--line)}.mock textarea,.mock input{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;margin:7px 0;font-size:16px}.btn{width:100%;padding:13px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-weight:900}</style></head><body><main class="app"><div id="home"><header class="top"><div class="sun">Y</div><div><h1>YOS</h1><div class="sub">太陽・調和｜iPhone実機確認</div></div></header><div class="hero"><div class="metrics"><div class="metric"><small>アプリ開発</small><b>53%</b></div><div class="metric"><small>資産全体</small><b>53%</b></div><div class="metric"><small>本人待ち</small><b>0</b></div></div><div class="now"><small>今、俺がやる1件</small><h2>現在なし</h2><p>AI側の作業を先に進めます。</p></div><div class="nav"><button data-route="clarity">Clarity</button><button data-route="life">Life</button><button data-route="bravia">BRAVIA</button></div></div><section><h2>本人タスクQueue</h2><div class="card meta">現在、本人にしかできないChatGPT内操作はありません。</div></section><section><h2>資産進捗</h2><div id="assets"></div></section></div><div id="clarity" class="route"><button class="back">‹ YOSへ戻る</button><section class="mock"><small>YOS CAPTURE</small><h2>今のことを残す</h2><p class="meta">画面遷移確認用。実保存はネイティブ版で確認します。</p><textarea rows="5" placeholder="今、残しておきたいことは？"></textarea><button class="btn">残す</button></section></div><div id="life" class="route"><button class="back">‹ YOSへ戻る</button><section class="mock"><small>MY LIFE by YOS</small><h2>Life</h2><p class="meta">既存Life導線の表示確認用です。</p><button class="btn">今日を開く</button></section></div><div id="bravia" class="route"><button class="back">‹ YOSへ戻る</button><section class="mock"><small>YOS BRAVIA</small><h2>BRAVIA Remote</h2><p class="meta">テレビ接続自体はネイティブ実機確認まで未確認です。</p><input placeholder="ホスト名 / IP"><input type="password" placeholder="PSK"><button class="btn">接続</button></section></div></main><script>const A=[['YOS',1,65,'統合アプリ実機確認待ち'],['MY WAY',1,65,'30秒コックピット実装済み'],['Clarity',1,65,'Universal Gateway実装済み'],['Money',1,65,'Money導線実装済み'],['YOS Mission Control',1,65,'GitHub状態同期運用中'],['MY WAY Widget',1,65,'5 Widgets v1実装済み'],['Money Capture',1,65,'自然文parser実装済み'],['Life',2,65,'Life画面・Flow接続進行中'],['Hero’s Journey',2,20,'再設計予定'],['Idea',2,20,'正式データ契約確認待ち'],['Notifications',2,20,'通知条件確定・統合予定'],['Morning Flow',2,65,'Life接続進行中'],['Night Reset',2,65,'Life接続進行中'],['MY REMOTE',2,65,'v2実装済み'],['YOS Home Voice',2,65,'adapter実装済み'],['YOS Departure Guard',2,65,'v0.1実装済み'],['One Enter',2,65,'オーケストレーション実装済み'],['ProjectY HQ',2,50,'全体検証継続中'],['YOS Screenshot Router',3,65,'コード検証済み'],['Weekly Review',3,20,'live adapter未接続'],['Friction Discovery',3,20,'live adapter未接続'],['Shortcut Factory + STASH',3,50,'acceptance未完了']];assets.innerHTML=A.map(x=>`<article class="card"><div class="head"><span class="p">P${x[1]}</span><strong>${x[0]}</strong><b>${x[2]}%</b></div><div class="progress"><i style="width:${x[2]}%"></i></div><p class="meta">${x[3]}</p></article>`).join('');document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{home.style.display='none';document.getElementById(b.dataset.route).classList.add('on');scrollTo(0,0)});document.querySelectorAll('.back').forEach(b=>b.onclick=()=>{document.querySelectorAll('.route').forEach(x=>x.classList.remove('on'));home.style.display='block';scrollTo(0,0)});</script></body></html>
