name: Clarity V7 one-shot E2E

on:
  pull_request:
    paths:
      - 'tools/clarity-factory/clarity-one-shot-child-v7.cherri'
      - 'tools/clarity-factory/clarity-one-shot-test-v7.cherri'
      - '.github/workflows/clarity-v7-one-shot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sign-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri

      - name: Compile V7
        shell: bash
        run: |
          set -euo pipefail
          cd tools/clarity-factory
          cherri clarity-one-shot-child-v7.cherri --skip-sign --debug
          cherri clarity-one-shot-test-v7.cherri --skip-sign --debug
          child='./ClarityOneShotChildV7_unsigned.shortcut'
          test='./ClarityOneShotTestV7_unsigned.shortcut'
          test -f "$child"
          test -f "$test"
          grep -q 'ClarityOneShotChildV7' "$test"
          grep -q 'CLARITY_V7_LEDGER_PASS' "$child"
          grep -q 'Current Brightness' "$test"
          mkdir -p artifacts-v7
          cp "$child" artifacts-v7/ClarityOneShotChildV7.shortcut
          cp "$test" artifacts-v7/ClarityOneShotTestV7.shortcut

      - name: Sign V7
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input tools/clarity-factory/artifacts-v7/ClarityOneShotChildV7.shortcut \
            --output tools/clarity-factory/artifacts-v7/ClarityOneShotChildV7-signed.shortcut \
            --name 'ClarityOneShotChildV7' \
            --timeout 180
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input tools/clarity-factory/artifacts-v7/ClarityOneShotTestV7.shortcut \
            --output tools/clarity-factory/artifacts-v7/ClarityOneShotTestV7-signed.shortcut \
            --name 'ClarityOneShotTestV7' \
            --timeout 180

      - name: Verify AEA1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base=Path('tools/clarity-factory/artifacts-v7')
          for name in ('ClarityOneShotChildV7-signed.shortcut','ClarityOneShotTestV7-signed.shortcut'):
              data=(base/name).read_bytes()
              assert data.startswith(b'AEA1')
              assert len(data)>500
              print(name, len(data))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: clarity-v7-one-shot
          path: |
            tools/clarity-factory/artifacts-v7/ClarityOneShotChildV7-signed.shortcut
            tools/clarity-factory/artifacts-v7/ClarityOneShotTestV7-signed.shortcut
          if-no-files-found: error
