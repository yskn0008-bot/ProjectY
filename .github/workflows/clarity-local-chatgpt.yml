name: Clarity fixed-child local artifacts

on:
  pull_request:
    paths:
      - 'tools/clarity-factory/**'
      - 'server/yos-ai/clarity-model-contract.mjs'
      - 'server/yos-ai/tests/clarity-model-api.test.mjs'
      - '.github/workflows/clarity-local-chatgpt.yml'
  push:
    branches: [main]
    paths:
      - 'tools/clarity-factory/**'
      - 'server/yos-ai/clarity-model-contract.mjs'
      - 'server/yos-ai/tests/clarity-model-api.test.mjs'
      - '.github/workflows/clarity-local-chatgpt.yml'

permissions:
  contents: read

jobs:
  build-local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate normal Clarity model contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool tools/clarity-factory/clarity-spec.json >/dev/null
          python3 -m unittest discover -s tools/clarity-factory/tests -v
          cd server/yos-ai
          npm install --ignore-scripts
          npm run build
          node --test tests/clarity-model-api.test.mjs
          node --check clarity-model-contract.mjs

      - name: Install pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri
          cherri --version

      - name: Compile fixed YOS_OpenApp child
        shell: bash
        run: |
          set -euo pipefail
          cd tools/clarity-factory
          rm -f './YOS_OpenApp_unsigned.shortcut' './YOS_OpenApp.plist'
          cherri YOS_OpenApp.cherri --skip-sign --debug
          child='./YOS_OpenApp_unsigned.shortcut'
          test -f "$child"
          mkdir -p artifacts-fixed-child
          cp "$child" artifacts-fixed-child/YOS_OpenApp-unsigned.shortcut

      - name: Compile normal Clarity parent
        shell: bash
        run: |
          set -euo pipefail
          cd tools/clarity-factory
          rm -f './Clarity_unsigned.shortcut' './Clarity.plist'
          cherri clarity-v1.cherri --skip-sign --debug
          runtime='./Clarity_unsigned.shortcut'
          test -f "$runtime"
          BUILD_ID='${{ github.event.pull_request.head.sha || github.sha }}'
          python3 patch_build_identity.py "$runtime" "$BUILD_ID"
          python3 validate_clarity_runtime.py "$runtime"
          python3 patch_natural_language_policy.py "$runtime"
          python3 patch_raw_first_authority.py "$runtime"
          python3 patch_action_extraction_policy.py "$runtime"
          python3 patch_append_file_paths.py "$runtime"
          python3 patch_chatgpt_json_text.py "$runtime"
          python3 patch_reminder_wire_format.py "$runtime"
          python3 patch_destination_readback.py "$runtime"
          python3 patch_model_boolean_gates.py "$runtime"
          python3 validate_clarity_deep_audit.py "$runtime" "$BUILD_ID"
          python3 validate_fixed_child_architecture.py "$runtime" './YOS_OpenApp_unsigned.shortcut'
          mkdir -p artifacts-fixed-child
          printf '%s\n' "$BUILD_ID" > artifacts-fixed-child/BUILD_ID.txt
          cp "$runtime" artifacts-fixed-child/Clarity-unsigned.shortcut

      - name: Compile self-contained Clarity text variant
        shell: bash
        run: |
          set -euo pipefail
          cd tools/clarity-factory
          generated='./Clarity Text.generated.cherri'
          rm -f "$generated" './Clarity Text_unsigned.shortcut' './Clarity Text.plist'
          python3 build_text_variant.py clarity-v1.cherri "$generated"
          cherri "$generated" --skip-sign --debug
          entry='./Clarity Text_unsigned.shortcut'
          test -f "$entry"
          BUILD_ID='${{ github.event.pull_request.head.sha || github.sha }}'
          python3 patch_build_identity.py "$entry" "$BUILD_ID"
          python3 validate_clarity_runtime.py "$entry" --input-mode text
          python3 patch_natural_language_policy.py "$entry"
          python3 patch_raw_first_authority.py "$entry"
          python3 patch_action_extraction_policy.py "$entry"
          python3 patch_append_file_paths.py "$entry"
          python3 patch_chatgpt_json_text.py "$entry"
          python3 patch_reminder_wire_format.py "$entry"
          python3 patch_destination_readback.py "$entry"
          python3 patch_model_boolean_gates.py "$entry"
          python3 validate_clarity_deep_audit.py "$entry" "$BUILD_ID"
          python3 validate_fixed_child_architecture.py "$entry" './YOS_OpenApp_unsigned.shortcut'
          mkdir -p artifacts-fixed-child
          cp "$entry" artifacts-fixed-child/Clarity-Text-unsigned.shortcut
          rm -f "$generated"

      - name: Inspect parent/child isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          base=Path('tools/clarity-factory/artifacts-fixed-child')
          parent=plistlib.loads((base/'Clarity-unsigned.shortcut').read_bytes())
          text_parent=plistlib.loads((base/'Clarity-Text-unsigned.shortcut').read_bytes())
          child=plistlib.loads((base/'YOS_OpenApp-unsigned.shortcut').read_bytes())
          pa=parent['WFWorkflowActions']
          ta=text_parent['WFWorkflowActions']
          ca=child['WFWorkflowActions']
          pids=[a.get('WFWorkflowActionIdentifier','') for a in pa]
          tids=[a.get('WFWorkflowActionIdentifier','') for a in ta]
          cids=[a.get('WFWorkflowActionIdentifier','') for a in ca]
          runs=[a for a in pa if a.get('WFWorkflowActionIdentifier','').endswith('runworkflow')]
          text_runs=[a for a in ta if a.get('WFWorkflowActionIdentifier','').endswith('runworkflow')]
          assert len(runs)==2, len(runs)
          assert len(text_runs)==2, len(text_runs)
          assert all('YOS_OpenApp' in repr(r.get('WFWorkflowActionParameters',{})) for r in runs)
          assert all('YOS_OpenApp' in repr(r.get('WFWorkflowActionParameters',{})) for r in text_runs)
          assert not any(i.endswith('openapp') for i in pids)
          assert not any(i.endswith('openapp') for i in tids)
          assert not any(i.endswith('downloadurl') for i in pids)
          assert not any(i.endswith('downloadurl') for i in tids)
          assert sum(i.endswith('openapp') for i in cids) >= 20
          assert sum(i == 'is.workflow.actions.ask' for i in tids) == 1, tids
          assert not any(i == 'is.workflow.actions.dictatetext' for i in tids), tids
          parent_blob=repr(parent)
          text_blob=repr(text_parent)
          for forbidden in ('shortcutFactoryUnsignedXml','YOS Safari Auto.shortcut','hubsign.routinehub.services/sign'):
              assert forbidden not in parent_blob, forbidden
              assert forbidden not in text_blob, forbidden
          assert 'YOS_OPEN_APP_OK:safari' in repr(child)
          print('Clarity voice + self-contained text variant + fixed YOS_OpenApp isolation: PASS')
          PY

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE --exclude='*.shortcut' --exclude='*.plist' \
            '(gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|BEGIN [A-Z ]*PRIVATE KEY|192\.168\.[0-9]+\.[0-9]+)' \
            tools/clarity-factory server/yos-ai/clarity-model-contract.mjs; then
            echo 'Potential secret/private network value found.' >&2
            exit 1
          fi

      - name: Sign Clarity parent
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input tools/clarity-factory/artifacts-fixed-child/Clarity-unsigned.shortcut \
            --output tools/clarity-factory/artifacts-fixed-child/Clarity-signed.shortcut \
            --name 'Clarity' \
            2>&1 | tee tools/clarity-factory/artifacts-fixed-child/clarity-hubsign.log

      - name: Sign Clarity text entry
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input tools/clarity-factory/artifacts-fixed-child/Clarity-Text-unsigned.shortcut \
            --output tools/clarity-factory/artifacts-fixed-child/Clarity-Text-signed.shortcut \
            --name 'Clarity Text' \
            2>&1 | tee tools/clarity-factory/artifacts-fixed-child/clarity-text-hubsign.log

      - name: Sign YOS_OpenApp child
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input tools/clarity-factory/artifacts-fixed-child/YOS_OpenApp-unsigned.shortcut \
            --output tools/clarity-factory/artifacts-fixed-child/YOS_OpenApp-signed.shortcut \
            --name 'YOS_OpenApp' \
            2>&1 | tee tools/clarity-factory/artifacts-fixed-child/yos-openapp-hubsign.log

      - name: Verify signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base=Path('tools/clarity-factory/artifacts-fixed-child')
          for name in ('Clarity-signed.shortcut','Clarity-Text-signed.shortcut','YOS_OpenApp-signed.shortcut'):
              data=(base/name).read_bytes()
              assert data.startswith(b'AEA1'), (name,data[:8])
              assert len(data)>500, (name,len(data))
              print(f'{name}: signed AEA1 PASS ({len(data)} bytes)')
          PY

      - name: Upload fixed-child acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: clarity-fixed-child-openapp
          path: |
            tools/clarity-factory/artifacts-fixed-child/BUILD_ID.txt
            tools/clarity-factory/artifacts-fixed-child/Clarity-unsigned.shortcut
            tools/clarity-factory/artifacts-fixed-child/Clarity-signed.shortcut
            tools/clarity-factory/artifacts-fixed-child/Clarity-Text-unsigned.shortcut
            tools/clarity-factory/artifacts-fixed-child/Clarity-Text-signed.shortcut
            tools/clarity-factory/artifacts-fixed-child/YOS_OpenApp-unsigned.shortcut
            tools/clarity-factory/artifacts-fixed-child/YOS_OpenApp-signed.shortcut
            tools/clarity-factory/artifacts-fixed-child/clarity-hubsign.log
            tools/clarity-factory/artifacts-fixed-child/clarity-text-hubsign.log
            tools/clarity-factory/artifacts-fixed-child/yos-openapp-hubsign.log
          if-no-files-found: error
