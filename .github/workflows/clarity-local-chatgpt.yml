name: Clarity local ChatGPT artifact

on:
  pull_request:
    paths:
      - 'tools/clarity-factory/**'
      - '.github/workflows/clarity-local-chatgpt.yml'
  push:
    branches: [main]
    paths:
      - 'tools/clarity-factory/**'
      - '.github/workflows/clarity-local-chatgpt.yml'

permissions:
  contents: read

jobs:
  build-local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate model contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool tools/clarity-factory/clarity-spec.json >/dev/null
          python3 -m unittest discover -s tools/clarity-factory/tests -v

      - name: Install pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri
          cherri --version

      - name: Compile local ChatGPT Clarity
        shell: bash
        run: |
          set -euo pipefail
          cd tools/clarity-factory
          rm -f './Clarity_unsigned.shortcut' './Clarity.plist'
          cherri clarity-v1.cherri --skip-sign --debug
          runtime='./Clarity_unsigned.shortcut'
          test -f "$runtime"
          python3 validate_clarity_runtime.py "$runtime"
          python3 patch_natural_language_policy.py "$runtime"
          python3 patch_raw_first_authority.py "$runtime"
          python3 patch_action_extraction_policy.py "$runtime"
          python3 patch_append_file_paths.py "$runtime"
          python3 patch_chatgpt_json_text.py "$runtime"
          python3 patch_reminder_wire_format.py "$runtime"
          python3 patch_destination_readback.py "$runtime"
          python3 patch_local_shortcut_factory.py "$runtime"
          python3 validate_clarity_local_factory.py "$runtime"
          mkdir -p artifacts-local
          cp "$runtime" artifacts-local/Clarity-local-chatgpt-unsigned.shortcut

      - name: Inspect local artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p=Path('tools/clarity-factory/artifacts-local/Clarity-local-chatgpt-unsigned.shortcut')
          root=plistlib.loads(p.read_bytes())
          actions=root['WFWorkflowActions']
          ids=[a.get('WFWorkflowActionIdentifier','') for a in actions]
          llm=[a for a in actions if a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.askllm']
          assert len(llm)==1, len(llm)
          params=llm[0].get('WFWorkflowActionParameters',{})
          assert params.get('WFLLMModel')=='ChatGPT'
          assert params.get('WFGenerativeResultType')=='Text'
          assert 'is.workflow.actions.detect.dictionary' in ids
          assert any(i.endswith('openapp') for i in ids)
          for suffix in ('wifi.set','bluetooth.set','cellulardata.set','airplanemode.set','lowpowermode.set','brightness','volume','appearance','flashlight','dnd.set','openurl'):
              assert any(i.endswith(suffix) for i in ids), suffix
          blob=repr(root)
          assert 'valid JSON text with no markdown fence' in blob
          assert 'api.openai.com' not in blob
          assert 'project-y-yos-ai.vercel.app/api/yos/intake?mode=model' not in blob
          assert 'Clarity接続トークン' not in blob
          assert 'OpenAI APIキー' not in blob
          assert 'sk-' not in blob
          nets=[a for a in actions if a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.downloadurl']
          assert len(nets)==1, len(nets)
          assert nets[0].get('WFWorkflowActionParameters',{}).get('WFURL')=='https://hubsign.routinehub.services/sign'
          assert 'YOS Safari Auto.shortcut' in blob
          assert 'com.apple.shortcuts' in blob
          print('Clarity local ChatGPT + Shortcut Factory inspection: PASS')
          PY

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE --exclude='*.shortcut' --exclude='*.plist' \
            '(gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|BEGIN [A-Z ]*PRIVATE KEY|192\.168\.[0-9]+\.[0-9]+)' \
            tools/clarity-factory; then
            echo 'Potential secret/private network value found.' >&2
            exit 1
          fi

      - name: Sign local Clarity with HubSign
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input tools/clarity-factory/artifacts-local/Clarity-local-chatgpt-unsigned.shortcut \
            --output tools/clarity-factory/artifacts-local/Clarity-local-chatgpt-signed.shortcut \
            --name 'Clarity Local' \
            2>&1 | tee tools/clarity-factory/artifacts-local/hubsign.log
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/clarity-factory/artifacts-local/Clarity-local-chatgpt-signed.shortcut')
          data=p.read_bytes()
          assert data.startswith(b'AEA1'), data[:8]
          assert len(data)>500
          print(f'Signed local Clarity: PASS ({len(data)} bytes)')
          PY

      - name: Upload local Clarity
        uses: actions/upload-artifact@v4
        with:
          name: clarity-local-chatgpt
          path: |
            tools/clarity-factory/artifacts-local/Clarity-local-chatgpt-unsigned.shortcut
            tools/clarity-factory/artifacts-local/Clarity-local-chatgpt-signed.shortcut
            tools/clarity-factory/artifacts-local/hubsign.log
          if-no-files-found: error
