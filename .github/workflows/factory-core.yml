name: One Enter Factory Core

on:
  pull_request:
    paths:
      - "tools/factory-core/**"
      - "docs/YOS_LOOP_ENGINE_v1.md"
      - "AGENTS.md"
      - ".github/scripts/projecty-development-supervisor.cjs"
      - ".github/scripts/projecty-development-supervisor.test.cjs"
      - ".github/workflows/factory-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax
        run: python3 -m py_compile tools/factory-core/yos_loop_engine.py tools/factory-core/tests/test_yos_loop_engine.py

      - name: Loop Engine unit and A-F self-tests
        run: python3 -m unittest discover -s tools/factory-core/tests -v

      - name: Canonical Flow validation and artifact packaging
        run: python3 tools/factory-core/recover_flow_artifact.py --output-dir /tmp/canonical-flows

      - name: Independent Flow canonicalization audit
        run: python3 tools/factory-core/audit_flow_canonicalization.py

      - name: Upload canonical signed Flow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canonical-flow-shortcuts
          path: |
            /tmp/canonical-flows/*.shortcut
            /tmp/canonical-flows/manifest.json
          if-no-files-found: error

      - name: ProjectY development supervisor contract
        run: node --test .github/scripts/projecty-development-supervisor.test.cjs

      - name: Bounded recovery synthetic E2E
        shell: bash
        run: |
          set -euo pipefail
          repo="$(mktemp -d)"
          git -C "$repo" init
          git -C "$repo" config user.email "yos-loop@example.invalid"
          git -C "$repo" config user.name "YOS Loop CI"
          mkdir -p "$repo/allowed"
          printf 'start' > "$repo/allowed/state.txt"
          git -C "$repo" add .
          git -C "$repo" commit -m start

          cat > /tmp/yos-loop-impl.py <<'PY'
          from pathlib import Path
          Path("allowed/state.txt").write_text("bad", encoding="utf-8")
          PY

          cat > /tmp/yos-loop-check.py <<'PY'
          from pathlib import Path
          raise SystemExit(0 if Path("allowed/state.txt").read_text(encoding="utf-8") == "good" else 1)
          PY

          cat > /tmp/yos-loop-audit.py <<'PY'
          from pathlib import Path
          value = Path("allowed/state.txt").read_text(encoding="utf-8")
          raise SystemExit(0 if value == "good" and len(value) == 4 else 1)
          PY

          cat > /tmp/yos-loop-repair.py <<'PY'
          from pathlib import Path
          Path("allowed/state.txt").write_text("good", encoding="utf-8")
          PY

          cat > /tmp/yos-loop-job.json <<JSON
          {
            "job_id": "ci-bounded-recovery",
            "goal": "prove one failed verify is recovered without owner intervention and independently audited",
            "acceptance": [
              "verification passes after bounded recovery",
              "independent audit passes"
            ],
            "scope": ["allowed/**"],
            "forbidden_paths": ["forbidden/**"],
            "implementation_command": ["python3", "/tmp/yos-loop-impl.py"],
            "verification_commands": [["python3", "/tmp/yos-loop-check.py"]],
            "audit_commands": [["python3", "/tmp/yos-loop-audit.py"]],
            "recovery_strategies": [
              {
                "name": "repair",
                "kind": "fix",
                "command": ["python3", "/tmp/yos-loop-repair.py"],
                "failure_classes": ["verification_failed"],
                "max_attempts": 1
              }
            ],
            "max_total_recovery_attempts": 4,
            "max_same_failure": 2,
            "max_duration_seconds": 60,
            "max_changed_paths": 10,
            "requires_device_verification": false,
            "requires_production_verification": false,
            "rollback_on_failed_safe": true
          }
          JSON

          python3 tools/factory-core/yos_loop_engine.py \
            --job /tmp/yos-loop-job.json \
            --repo "$repo" \
            --result /tmp/yos-loop-result.json

          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/yos-loop-result.json", encoding="utf-8"))
          assert data["status"] == "COMPLETE", data
          assert data["code_verified"] is True, data
          assert data["audit_verified"] is True, data
          assert len(data["recovery_attempts"]) == 1, data
          assert len(data["verification_results"]) == 2, data
          assert data["terminal_state"] == "COMPLETE", data
          assert all(x["verified"] for x in data["done_conditions"]), data
          PY

      - name: Diff check
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^..HEAD
          fi
