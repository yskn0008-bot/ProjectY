name: Codex governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate-pr-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test governance validator
        run: node --test .github/scripts/validate-pr-evidence.test.cjs

      - name: Validate current PR evidence
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/validate-pr-evidence.cjs
