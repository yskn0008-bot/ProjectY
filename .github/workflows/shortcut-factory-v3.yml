name: Shortcut Factory v3

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/shortcut-factory/**'
      - 'tools/clarity-factory/sign_with_hubsign.py'
      - '.github/workflows/shortcut-factory-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-stash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Secret-free source guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/shortcut-factory/validate_secret_free.py             'tools/shortcut-factory/shortcuts/STASH.cherri'             'tools/shortcut-factory/shortcuts/STASH Add.cherri'

      - name: Validate source ownership boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          stash=Path('tools/shortcut-factory/shortcuts/STASH.cherri').read_text()
          add=Path('tools/shortcut-factory/shortcuts/STASH Add.cherri').read_text()
          assert 'POCKET.txt' in stash and '===YOS_NEXT===' in stash
          assert 'appendResolvedFile' in stash
          assert 'run("STASH", @stashItem)' not in add
          assert 'getClipboard()' in add
          assert 'appendResolvedFile' not in add
          assert 'appendToFile("POCKET.txt", expectedEntry)' in add
          assert 'saveFile("POCKET.txt", expectedEntry, true)' in add
          print('Shortcut Factory source boundary: PASS')
          PY

      - name: Install pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri
          cherri --version

      - name: Compile STASH and STASH Add
        shell: bash
        run: |
          set -euo pipefail
          cd tools/shortcut-factory/shortcuts
          rm -f             'STASH_unsigned.shortcut' 'STASH.plist'             'STASH Add_unsigned.shortcut' 'STASH Add.plist'
          cherri 'STASH.cherri' --skip-sign --debug
          cherri 'STASH Add.cherri' --skip-sign --debug
          test -f 'STASH_unsigned.shortcut'
          test -f 'STASH Add_unsigned.shortcut'
          mkdir -p ../artifacts
          cp 'STASH_unsigned.shortcut' '../artifacts/STASH-unsigned.shortcut'
          cp 'STASH Add_unsigned.shortcut' '../artifacts/STASH-Add-unsigned.shortcut'

      - name: Validate compiled structure
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/shortcut-factory/validate_stash_factory.py             'tools/shortcut-factory/artifacts/STASH-unsigned.shortcut'             'tools/shortcut-factory/artifacts/STASH-Add-unsigned.shortcut'

      - name: Sign with existing HubSign adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py             --input 'tools/shortcut-factory/artifacts/STASH-unsigned.shortcut'             --output 'tools/shortcut-factory/artifacts/STASH.shortcut'             --name 'STASH'             2>&1 | tee 'tools/shortcut-factory/artifacts/stash-hubsign.log'
          python3 tools/clarity-factory/sign_with_hubsign.py             --input 'tools/shortcut-factory/artifacts/STASH-Add-unsigned.shortcut'             --output 'tools/shortcut-factory/artifacts/STASH Add.shortcut'             --name 'STASH Add'             2>&1 | tee 'tools/shortcut-factory/artifacts/stash-add-hubsign.log'

      - name: Verify signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('STASH.shortcut','STASH Add.shortcut'):
              p=Path('tools/shortcut-factory/artifacts')/name
              data=p.read_bytes()
              assert data.startswith(b'AEA1'), (name,data[:8])
              assert len(data)>500, (name,len(data))
              print(f'{name}: signed AEA1 PASS ({len(data)} bytes)')
          PY

      - name: Verify signed shortcut semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet lzfse
          python3 - <<'PY'
          import plistlib
          import lzfse
          from pathlib import Path

          def decode_signed(path):
              data = Path(path).read_bytes()
              assert data.startswith(b'AEA1'), path
              cert_len = int.from_bytes(data[8:12], 'little')
              payload_start = 12 + cert_len
              magic = data.find(b'bvx', payload_start)
              assert magic >= 0, (path, 'LZFSE payload not found')
              raw = lzfse.decompress(data[magic:])
              idx = raw.find(b'bplist00')
              assert idx >= 0, (path, 'workflow bplist not found')
              return plistlib.loads(raw[idx:])

          def ids(workflow):
              return [a.get('WFWorkflowActionIdentifier','') for a in workflow.get('WFWorkflowActions',[])]

          add = decode_signed('tools/shortcut-factory/artifacts/STASH Add.shortcut')
          stash = decode_signed('tools/shortcut-factory/artifacts/STASH.shortcut')
          add_ids = ids(add)
          stash_ids = ids(stash)

          assert 'is.workflow.actions.runworkflow' not in add_ids, add_ids
          assert add_ids.count('is.workflow.actions.file.append') == 1, add_ids
          assert 'is.workflow.actions.getclipboard' in add_ids, add_ids
          appends=[a for a in add.get('WFWorkflowActions',[]) if a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.file.append']
          assert len(appends)==1
          ap=appends[0].get('WFWorkflowActionParameters',{})
          assert ap.get('WFFilePath') == 'POCKET.txt', ap
          assert 'expectedEntry' in repr(ap.get('WFInput')), ap
          assert 'is.workflow.actions.notification' not in add_ids, add_ids
          add_saves=[a for a in add.get('WFWorkflowActions',[]) if a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.documentpicker.save']
          assert len(add_saves)==1
          sp=add_saves[0].get('WFWorkflowActionParameters',{})
          assert sp.get('WFFileDestinationPath') == 'POCKET.txt', sp
          assert sp.get('WFAskWhereToSave') is False, sp
          assert sp.get('WFSaveFileOverwrite') is True, sp

          assert 'is.workflow.actions.setclipboard' in stash_ids, stash_ids
          assert 'is.workflow.actions.documentpicker.save' in stash_ids, stash_ids
          assert 'is.workflow.actions.notification' not in stash_ids, stash_ids

          saves=[a for a in stash.get('WFWorkflowActions',[]) if a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.documentpicker.save']
          assert len(saves)==1
          p=saves[0].get('WFWorkflowActionParameters',{})
          assert p.get('WFAskWhereToSave') is False, p
          assert p.get('WFSaveFileOverwrite') is True, p
          assert p.get('WFFileDestinationPath') == 'POCKET.txt', p

          print('SIGNED STASH Add semantics: PASS (no Run Shortcut action)')
          print('SIGNED STASH semantics: PASS (fixed POCKET rewrite, silent)')
          PY

      - name: Upload iPhone acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: stash-add-iphone
          path: |
            tools/shortcut-factory/artifacts/STASH Add.shortcut
            tools/shortcut-factory/artifacts/STASH-Add-unsigned.shortcut
            tools/shortcut-factory/artifacts/STASH.shortcut
            tools/shortcut-factory/artifacts/STASH-unsigned.shortcut
            tools/shortcut-factory/artifacts/stash-add-hubsign.log
            tools/shortcut-factory/artifacts/stash-hubsign.log
          if-no-files-found: error
          retention-days: 14

  # PR-only signed launcher; no automatic install or modification of Untitled Script 9.
  build-bravia-quick-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check isolated BRAVIA v6.6 script syntax and behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check 'ios-app/scriptable/remote-widgets/quick-media/YOS Remote Hub Quick TEST.js'
          node --test ios-app/tests/bravia-quick-media.test.mjs ios-app/tests/bravia-v67-controls.test.mjs ios-app/tests/remote-v66-picture.test.mjs
          python3 tools/shortcut-factory/validate_secret_free.py 'tools/shortcut-factory/shortcuts/YOS BRAVIA クイック TEST.cherri'

      - name: Install existing pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri
          cherri --version

      - name: Compile and embed the isolated quick control panel
        shell: bash
        run: |
          set -euo pipefail
          cd tools/shortcut-factory/shortcuts
          cherri 'YOS BRAVIA クイック TEST.cherri' --skip-sign --debug
          test -s 'YOS BRAVIA クイック TEST_unsigned.shortcut'
          cd ../../..
          python3 tools/shortcut-factory/patch_bravia_quick_inline.py \
            'tools/shortcut-factory/shortcuts/YOS BRAVIA クイック TEST_unsigned.shortcut' \
            --script 'ios-app/scriptable/remote-widgets/quick-media/YOS Remote Hub Quick TEST.js'
          mkdir -p tools/shortcut-factory/artifacts
          cp 'tools/shortcut-factory/shortcuts/YOS BRAVIA クイック TEST_unsigned.shortcut' \
            'tools/shortcut-factory/artifacts/YOS-BRAVIA-Quick-TEST-unsigned.shortcut'

      - name: Verify compiled action graph and existing-device protection
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/shortcut-factory/validate_bravia_quick_candidate.py \
            'tools/shortcut-factory/artifacts/YOS-BRAVIA-Quick-TEST-unsigned.shortcut'

      - name: Sign through existing HubSign adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input 'tools/shortcut-factory/artifacts/YOS-BRAVIA-Quick-TEST-unsigned.shortcut' \
            --output 'tools/shortcut-factory/artifacts/YOS-BRAVIA-Quick-TEST.shortcut' \
            --name 'YOS BRAVIA クイック TEST'

      - name: Verify signed AEA1 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/shortcut-factory/artifacts/YOS-BRAVIA-Quick-TEST.shortcut')
          b=p.read_bytes()
          assert b.startswith(b'AEA1') and len(b)>15000, 'signed 4-device launcher invalid'
          print('BRAVIA Quick signed AEA1 PASS',len(b),'bytes')
          PY

      - name: Upload test-only iPhone shortcut
        uses: actions/upload-artifact@v4
        with:
          name: yos-bravia-quick-test-iphone
          path: |
            tools/shortcut-factory/artifacts/YOS-BRAVIA-Quick-TEST.shortcut
            tools/shortcut-factory/artifacts/YOS-BRAVIA-Quick-TEST-unsigned.shortcut
          if-no-files-found: error
          retention-days: 14
  # Reuses the existing Factory, pinned compiler, secret scan and signing adapter.
  # This is a PR-only candidate: no main deployment, catalog change or iPhone install.
  build-journal-gpt-candidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify candidate is secret-free before external signing
        run: |
          python3 tools/shortcut-factory/validate_secret_free.py 'tools/shortcut-factory/shortcuts/YOS JOURNAL GPT制作.cherri'

      - name: Install existing pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri
          cherri --version

      - name: Compile GPT editorial candidate with no signing
        shell: bash
        run: |
          set -euo pipefail
          cd tools/shortcut-factory/shortcuts
          cherri 'YOS JOURNAL GPT制作.cherri' --skip-sign --debug
          test -s 'YOS JOURNAL 2段階編集 TEST_unsigned.shortcut'
          test -s 'YOS JOURNAL 2段階編集 TEST.plist'
          cd ../../..
          python3 tools/shortcut-factory/patch_journal_draft_inbox.py \
            'tools/shortcut-factory/shortcuts/YOS JOURNAL 2段階編集 TEST_unsigned.shortcut' \
            --script 'tools/shortcut-factory/journal_draft_inbox_inline.js'
          mkdir -p tools/shortcut-factory/artifacts
          cp 'tools/shortcut-factory/shortcuts/YOS JOURNAL 2段階編集 TEST_unsigned.shortcut' 'tools/shortcut-factory/artifacts/YOS-JOURNAL-GPT-unsigned.shortcut'

      - name: Validate private Notion writer and failure tests
        shell: bash
        run: |
          node --check tools/shortcut-factory/journal_draft_inbox_inline.js
          node --test tools/shortcut-factory/tests/journal-draft-inbox.test.mjs

      - name: Validate compiled model, local backup and private handoff
        run: |
          python3 tools/shortcut-factory/validate_journal_gpt_candidate.py 'tools/shortcut-factory/artifacts/YOS-JOURNAL-GPT-unsigned.shortcut'

      - name: Sign candidate through existing HubSign adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input 'tools/shortcut-factory/artifacts/YOS-JOURNAL-GPT-unsigned.shortcut' \
            --output 'tools/shortcut-factory/artifacts/YOS-JOURNAL-GPT-signed.shortcut' \
            --name 'YOS JOURNAL 2段階編集 TEST'

      - name: Check signed AEA1 artifact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/shortcut-factory/artifacts/YOS-JOURNAL-GPT-signed.shortcut')
          b = p.read_bytes()
          assert b.startswith(b'AEA1') and len(b) > 500, 'invalid signed Shortcut'
          print('YOS JOURNAL GPT AEA1 envelope PASS:',len(b),'bytes')
          PY

      - name: Upload PR-only iPhone acceptance candidate
        uses: actions/upload-artifact@v4
        with:
          name: yos-journal-gpt-shortcut-candidate
          path: |
            tools/shortcut-factory/artifacts/YOS-JOURNAL-GPT-signed.shortcut
            tools/shortcut-factory/artifacts/YOS-JOURNAL-GPT-unsigned.shortcut
          if-no-files-found: error
          retention-days: 14

  build-journal-research-candidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify research candidate is secret-free before external signing
        run: |
          python3 tools/shortcut-factory/validate_secret_free.py 'tools/shortcut-factory/shortcuts/YOS JOURNAL 調査編集 TEST.cherri'

      - name: Install existing pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri
          cherri --version

      - name: Compile GPT editorial candidate with no signing
        shell: bash
        run: |
          set -euo pipefail
          cd tools/shortcut-factory/shortcuts
          cherri 'YOS JOURNAL 調査編集 TEST.cherri' --skip-sign --debug
          test -s 'YOS JOURNAL 調査安定版 TEST_unsigned.shortcut'
          test -s 'YOS JOURNAL 調査安定版 TEST.plist'
          cd ../../..
          python3 tools/shortcut-factory/patch_journal_research_inline.py \
            'tools/shortcut-factory/shortcuts/YOS JOURNAL 調査安定版 TEST_unsigned.shortcut' \
            --script 'tools/shortcut-factory/journal_public_research_inline.js' \
            --selection 'tools/shortcut-factory/journal_review_selection_inline.js'
          python3 tools/shortcut-factory/patch_journal_draft_inbox.py \
            'tools/shortcut-factory/shortcuts/YOS JOURNAL 調査安定版 TEST_unsigned.shortcut' \
            --script 'tools/shortcut-factory/journal_draft_inbox_inline.js' \
            --diagnostic /tmp/YOS-JOURNAL-PARAMETER-unsigned.shortcut \
            --recovery /tmp/YOS-JOURNAL-RECOVERY-unsigned.shortcut
          mkdir -p tools/shortcut-factory/artifacts
          cp /tmp/YOS-JOURNAL-PARAMETER-unsigned.shortcut /tmp/YOS-JOURNAL-RECOVERY-unsigned.shortcut tools/shortcut-factory/artifacts/
          cp 'tools/shortcut-factory/shortcuts/YOS JOURNAL 調査安定版 TEST_unsigned.shortcut' 'tools/shortcut-factory/artifacts/YOS-JOURNAL-RESEARCH-unsigned.shortcut'

      - name: Validate private Notion writer and failure tests
        shell: bash
        run: |
          node --check tools/shortcut-factory/journal_public_research_inline.js
          node --check tools/shortcut-factory/journal_review_selection_inline.js
          node --test tools/shortcut-factory/tests/journal-review-selection.test.mjs
          node --test tools/shortcut-factory/tests/journal-private-reading.test.mjs
          node --test tools/shortcut-factory/tests/journal-public-research.test.mjs
          node --check tools/shortcut-factory/journal_draft_inbox_inline.js
          node --test tools/shortcut-factory/tests/journal-draft-inbox.test.mjs

      - name: Validate compiled model, local backup and private handoff
        run: |
          python3 tools/shortcut-factory/validate_journal_research_candidate.py 'tools/shortcut-factory/artifacts/YOS-JOURNAL-RESEARCH-unsigned.shortcut'
          python3 tools/shortcut-factory/patch_journal_draft_inbox.py 'tools/shortcut-factory/artifacts/YOS-JOURNAL-RESEARCH-unsigned.shortcut' --convert-to-clarity \
            --reflection-source tools/shortcut-factory/journal_private_reading_inline.js \
            --reader-source server/yos-ai/src/routes/journal-reader.mjs \
            --inbox-source journal/notion-private-draft-readback.mjs

      - name: Sign candidate through existing HubSign adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input 'tools/shortcut-factory/artifacts/YOS-JOURNAL-RESEARCH-unsigned.shortcut' \
            --output 'tools/shortcut-factory/artifacts/YOS-JOURNAL-RESEARCH-signed.shortcut' \
            --name 'YOS JOURNAL 調査安定版 TEST'

      - name: Sign isolated JOURNAL parameter diagnostic
        run: |
          python3 tools/clarity-factory/sign_with_hubsign.py --input tools/shortcut-factory/artifacts/YOS-JOURNAL-PARAMETER-unsigned.shortcut --output tools/shortcut-factory/artifacts/YOS-JOURNAL-PARAMETER-signed.shortcut --name 'YOS JOURNAL 受け渡し検証 TEST'
          python3 -c "from pathlib import Path; assert Path('tools/shortcut-factory/artifacts/YOS-JOURNAL-PARAMETER-signed.shortcut').read_bytes().startswith(b'AEA1')"

      - name: Sign recovery-only JOURNAL candidate
        run: |
          python3 tools/clarity-factory/sign_with_hubsign.py --input tools/shortcut-factory/artifacts/YOS-JOURNAL-RECOVERY-unsigned.shortcut --output tools/shortcut-factory/artifacts/YOS-JOURNAL-RECOVERY-signed.shortcut --name 'YOS JOURNAL 保存復旧 TEST'
          python3 -c "from pathlib import Path; assert Path('tools/shortcut-factory/artifacts/YOS-JOURNAL-RECOVERY-signed.shortcut').read_bytes().startswith(b'AEA1')"

      - name: Check signed AEA1 artifact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/shortcut-factory/artifacts/YOS-JOURNAL-RESEARCH-signed.shortcut')
          b = p.read_bytes()
          assert b.startswith(b'AEA1') and len(b) > 500, 'invalid signed Shortcut'
          print('YOS JOURNAL RESEARCH AEA1 envelope PASS:',len(b),'bytes')
          PY

      - name: Upload PR-only iPhone acceptance candidate
        uses: actions/upload-artifact@v4
        with:
          name: yos-journal-research-shortcut-candidate
          path: |
            tools/shortcut-factory/artifacts/YOS-JOURNAL-RESEARCH-signed.shortcut
            tools/shortcut-factory/artifacts/YOS-JOURNAL-RESEARCH-unsigned.shortcut
            tools/shortcut-factory/artifacts/YOS-JOURNAL-PARAMETER-signed.shortcut
            tools/shortcut-factory/artifacts/YOS-JOURNAL-PARAMETER-unsigned.shortcut
            tools/shortcut-factory/artifacts/YOS-JOURNAL-RECOVERY-signed.shortcut
            tools/shortcut-factory/artifacts/YOS-JOURNAL-RECOVERY-unsigned.shortcut
          if-no-files-found: error
          retention-days: 14

  build-journal-notify-candidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify notification Shortcut source is secret-free
        run: |
          python3 tools/shortcut-factory/validate_secret_free.py 'tools/shortcut-factory/shortcuts/YOS JOURNAL 配信確認 TEST.cherri'

      - name: Install existing pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri
          cherri --version

      - name: Compile, patch and validate publication-only notifier
        shell: bash
        run: |
          set -euo pipefail
          cd tools/shortcut-factory/shortcuts
          cherri 'YOS JOURNAL 配信確認 TEST.cherri' --skip-sign --debug
          test -s 'YOS JOURNAL 配信確認 TEST_unsigned.shortcut'
          cd ../../..
          python3 tools/shortcut-factory/patch_journal_publication_notify.py \
            'tools/shortcut-factory/shortcuts/YOS JOURNAL 配信確認 TEST_unsigned.shortcut' \
            --script 'tools/shortcut-factory/journal_publication_notify_inline.js'
          python3 tools/shortcut-factory/validate_journal_publication_notify.py \
            'tools/shortcut-factory/shortcuts/YOS JOURNAL 配信確認 TEST_unsigned.shortcut'
          mkdir -p tools/shortcut-factory/artifacts
          cp 'tools/shortcut-factory/shortcuts/YOS JOURNAL 配信確認 TEST_unsigned.shortcut' \
            tools/shortcut-factory/artifacts/YOS-JOURNAL-NOTIFY-unsigned.shortcut

      - name: Test publication notification and duplicate-suppression logic
        run: |
          node --check tools/shortcut-factory/journal_publication_notify_inline.js
          node --test tools/shortcut-factory/tests/journal-publication-notify.test.mjs

      - name: Sign isolated notification test with existing HubSign
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input 'tools/shortcut-factory/artifacts/YOS-JOURNAL-NOTIFY-unsigned.shortcut' \
            --output 'tools/shortcut-factory/artifacts/YOS-JOURNAL-NOTIFY-signed.shortcut' \
            --name 'YOS JOURNAL 配信確認 TEST'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/shortcut-factory/artifacts/YOS-JOURNAL-NOTIFY-signed.shortcut')
          b=p.read_bytes()
          assert b.startswith(b'AEA1') and len(b)>500
          print('YOS JOURNAL notification signed AEA1 PASS',len(b))
          PY

      - name: Upload PR-only notification test
        uses: actions/upload-artifact@v4
        with:
          name: yos-journal-publication-notification-candidate
          path: |
            tools/shortcut-factory/artifacts/YOS-JOURNAL-NOTIFY-signed.shortcut
            tools/shortcut-factory/artifacts/YOS-JOURNAL-NOTIFY-unsigned.shortcut
          if-no-files-found: error
          retention-days: 14

