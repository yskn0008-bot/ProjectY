name: Shortcut Factory v3

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/shortcut-factory/**'
      - 'tools/clarity-factory/sign_with_hubsign.py'
      - '.github/workflows/shortcut-factory-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-stash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Secret-free source guard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/shortcut-factory/validate_secret_free.py             'tools/shortcut-factory/shortcuts/STASH.cherri'             'tools/shortcut-factory/shortcuts/STASH Add.cherri'

      - name: Validate source ownership boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          stash=Path('tools/shortcut-factory/shortcuts/STASH.cherri').read_text()
          add=Path('tools/shortcut-factory/shortcuts/STASH Add.cherri').read_text()
          assert 'POCKET.txt' in stash and '===YOS_NEXT===' in stash
          assert 'appendResolvedFile' in stash
          assert 'run("STASH", @stashItem)' not in add
          assert 'getClipboard()' in add
          assert 'appendResolvedFile' not in add
          assert 'appendToFile("POCKET.txt", expectedEntry)' in add
          assert 'saveFile("POCKET.txt", expectedEntry, true)' in add
          print('Shortcut Factory source boundary: PASS')
          PY

      - name: Install pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri
          cherri --version

      - name: Compile STASH and STASH Add
        shell: bash
        run: |
          set -euo pipefail
          cd tools/shortcut-factory/shortcuts
          rm -f             'STASH_unsigned.shortcut' 'STASH.plist'             'STASH Add_unsigned.shortcut' 'STASH Add.plist'
          cherri 'STASH.cherri' --skip-sign --debug
          cherri 'STASH Add.cherri' --skip-sign --debug
          test -f 'STASH_unsigned.shortcut'
          test -f 'STASH Add_unsigned.shortcut'
          mkdir -p ../artifacts
          cp 'STASH_unsigned.shortcut' '../artifacts/STASH-unsigned.shortcut'
          cp 'STASH Add_unsigned.shortcut' '../artifacts/STASH-Add-unsigned.shortcut'

      - name: Validate compiled structure
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/shortcut-factory/validate_stash_factory.py             'tools/shortcut-factory/artifacts/STASH-unsigned.shortcut'             'tools/shortcut-factory/artifacts/STASH-Add-unsigned.shortcut'

      - name: Sign with existing HubSign adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py             --input 'tools/shortcut-factory/artifacts/STASH-unsigned.shortcut'             --output 'tools/shortcut-factory/artifacts/STASH.shortcut'             --name 'STASH'             2>&1 | tee 'tools/shortcut-factory/artifacts/stash-hubsign.log'
          python3 tools/clarity-factory/sign_with_hubsign.py             --input 'tools/shortcut-factory/artifacts/STASH-Add-unsigned.shortcut'             --output 'tools/shortcut-factory/artifacts/STASH Add.shortcut'             --name 'STASH Add'             2>&1 | tee 'tools/shortcut-factory/artifacts/stash-add-hubsign.log'

      - name: Verify signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('STASH.shortcut','STASH Add.shortcut'):
              p=Path('tools/shortcut-factory/artifacts')/name
              data=p.read_bytes()
              assert data.startswith(b'AEA1'), (name,data[:8])
              assert len(data)>500, (name,len(data))
              print(f'{name}: signed AEA1 PASS ({len(data)} bytes)')
          PY

      - name: Verify signed shortcut semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet lzfse
          python3 - <<'PY'
          import plistlib
          import lzfse
          from pathlib import Path

          def decode_signed(path):
              data = Path(path).read_bytes()
              assert data.startswith(b'AEA1'), path
              cert_len = int.from_bytes(data[8:12], 'little')
              payload_start = 12 + cert_len
              magic = data.find(b'bvx', payload_start)
              assert magic >= 0, (path, 'LZFSE payload not found')
              raw = lzfse.decompress(data[magic:])
              idx = raw.find(b'bplist00')
              assert idx >= 0, (path, 'workflow bplist not found')
              return plistlib.loads(raw[idx:])

          def ids(workflow):
              return [a.get('WFWorkflowActionIdentifier','') for a in workflow.get('WFWorkflowActions',[])]

          add = decode_signed('tools/shortcut-factory/artifacts/STASH Add.shortcut')
          stash = decode_signed('tools/shortcut-factory/artifacts/STASH.shortcut')
          add_ids = ids(add)
          stash_ids = ids(stash)

          assert 'is.workflow.actions.runworkflow' not in add_ids, add_ids
          assert add_ids.count('is.workflow.actions.file.append') == 1, add_ids
          assert 'is.workflow.actions.getclipboard' in add_ids, add_ids
          appends=[a for a in add.get('WFWorkflowActions',[]) if a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.file.append']
          assert len(appends)==1
          ap=appends[0].get('WFWorkflowActionParameters',{})
          assert ap.get('WFFilePath') == 'POCKET.txt', ap
          assert 'expectedEntry' in repr(ap.get('WFInput')), ap
          assert 'is.workflow.actions.notification' not in add_ids, add_ids
          add_saves=[a for a in add.get('WFWorkflowActions',[]) if a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.documentpicker.save']
          assert len(add_saves)==1
          sp=add_saves[0].get('WFWorkflowActionParameters',{})
          assert sp.get('WFFileDestinationPath') == 'POCKET.txt', sp
          assert sp.get('WFAskWhereToSave') is False, sp
          assert sp.get('WFSaveFileOverwrite') is True, sp

          assert 'is.workflow.actions.setclipboard' in stash_ids, stash_ids
          assert 'is.workflow.actions.documentpicker.save' in stash_ids, stash_ids
          assert 'is.workflow.actions.notification' not in stash_ids, stash_ids

          saves=[a for a in stash.get('WFWorkflowActions',[]) if a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.documentpicker.save']
          assert len(saves)==1
          p=saves[0].get('WFWorkflowActionParameters',{})
          assert p.get('WFAskWhereToSave') is False, p
          assert p.get('WFSaveFileOverwrite') is True, p
          assert p.get('WFFileDestinationPath') == 'POCKET.txt', p

          print('SIGNED STASH Add semantics: PASS (no Run Shortcut action)')
          print('SIGNED STASH semantics: PASS (fixed POCKET rewrite, silent)')
          PY

      - name: Upload iPhone acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: stash-add-iphone
          path: |
            tools/shortcut-factory/artifacts/STASH Add.shortcut
            tools/shortcut-factory/artifacts/STASH-Add-unsigned.shortcut
            tools/shortcut-factory/artifacts/STASH.shortcut
            tools/shortcut-factory/artifacts/STASH-unsigned.shortcut
            tools/shortcut-factory/artifacts/stash-add-hubsign.log
            tools/shortcut-factory/artifacts/stash-hubsign.log
          if-no-files-found: error
          retention-days: 14


  # Issue #900 one-time bridge. Does NOT replace or modify the existing STASH
  # job, existing Common Installer runtime, or any permanent Scriptable script.
  build-common-installer-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Test one-shot Scriptable backup and safe-stop behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/shortcut-factory/inline/common-installer-repair.js
          node --test tools/shortcut-factory/tests/common-installer-repair.test.mjs
          python3 tools/shortcut-factory/validate_secret_free.py \
            'tools/shortcut-factory/inline/common-installer-repair.js' \
            'tools/shortcut-factory/shortcuts/YOS Common Installer 修復.cherri'

      - name: Install existing pinned Cherri 2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri
          cherri --version

      - name: Compile exact one-action Shortcut and inject reviewed Scriptable source
        shell: bash
        run: |
          set -euo pipefail
          cd tools/shortcut-factory/shortcuts
          cherri 'YOS Common Installer 修復.cherri' --skip-sign --debug
          cd ../../..
          unsigned='tools/shortcut-factory/shortcuts/YOS Common Installer 修復_unsigned.shortcut'
          test -s "$unsigned"
          python3 tools/shortcut-factory/patch_common_installer_repair_inline.py "$unsigned"
          mkdir -p tools/shortcut-factory/artifacts
          cp "$unsigned" 'tools/shortcut-factory/artifacts/Common-Installer-Repair-unsigned.shortcut'

      - name: Sign with the existing Shortcut Factory HubSign adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input 'tools/shortcut-factory/artifacts/Common-Installer-Repair-unsigned.shortcut' \
            --output 'tools/shortcut-factory/artifacts/YOS Common Installer 修復.shortcut' \
            --name 'YOS Common Installer 修復'

      - name: Verify signed shortcut AEA1 and single inline Scriptable action
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet lzfse
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import lzfse
          unsigned=Path('tools/shortcut-factory/artifacts/Common-Installer-Repair-unsigned.shortcut')
          signed=Path('tools/shortcut-factory/artifacts/YOS Common Installer 修復.shortcut')
          assert signed.exists() and signed.stat().st_size>500
          data=signed.read_bytes()
          assert data.startswith(b'AEA1'), 'unsigned or invalid signature envelope'
          cert_len=int.from_bytes(data[8:12],'little')
          pos=data.find(b'bvx',12+cert_len)
          assert pos>=0, 'signed LZFSE payload not found'
          raw=lzfse.decompress(data[pos:])
          bplist=raw.find(b'bplist00')
          assert bplist>=0, 'signed binary plist not found'
          workflow=plistlib.loads(raw[bplist:])
          unsigned_actions=plistlib.loads(unsigned.read_bytes())['WFWorkflowActions']
          signed_actions=workflow['WFWorkflowActions']
          expected='dk.simonbs.Scriptable.RunScriptInlineIntent'
          assert len(unsigned_actions)==len(signed_actions)==1
          assert signed_actions[0]['WFWorkflowActionIdentifier']==expected
          params=signed_actions[0]['WFWorkflowActionParameters']
          assert params['runInApp'] is True
          inline=params['script']['Value']['string']
          assert len(inline)>8000
          assert '8bb289519b0f4f6c907b27f336a623bc5669e669' in inline
          assert 'bootstrap-backups' in inline
          assert 'Script.complete()' in inline
          assert '__YOS_COMMON_INSTALLER_REPAIR_INLINE__' not in inline
          assert all(a['WFWorkflowActionIdentifier']==expected for a in signed_actions)
          print('Common Installer signed inline Shortcut: AEA1 + one-action + pinned safety checks PASS')
          PY

      - name: Upload private iPhone test artifact without publishing a new installer
        uses: actions/upload-artifact@v4
        with:
          name: common-installer-repair-iphone-test
          path: |
            tools/shortcut-factory/artifacts/YOS Common Installer 修復.shortcut
            tools/shortcut-factory/artifacts/Common-Installer-Repair-unsigned.shortcut
          if-no-files-found: error
          retention-days: 14
