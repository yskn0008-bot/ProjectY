name: Issue 256 Patch Transport

on:
  push:
    branches:
      - codex/issue-256-slack-events-intake
    paths:
      - .github/workflows/issue-256-patch-transport.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover verified patch from Issue #256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          url = 'https://api.github.com/repos/yskn0008-bot/ProjectY/issues/comments/5635041039'
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              body = json.load(response)['body']

          match = re.search(
              r'### Complete binary-capable diff\s*```diff\n(.*?)\n```',
              body,
              re.DOTALL,
          )
          if not match:
              raise SystemExit('Issue #256 complete diff block was not found')

          patch = match.group(1) + '\n'
          digest = hashlib.sha256(patch.encode('utf-8')).hexdigest()
          expected = '3000008f57d6eca829f0c5fe50ae8373282673aae714227abb8e019f31de5900'
          if digest != expected:
              raise SystemExit(f'Patch SHA-256 mismatch: {digest}')

          Path('/tmp/issue-256-slack-events.diff').write_text(patch, encoding='utf-8')
          print(f'patch_sha256={digest}')
          print(f'patch_bytes={len(patch.encode("utf-8"))}')
          PY

      - name: Apply patch and enforce scope
        run: |
          git apply --check /tmp/issue-256-slack-events.diff
          git apply /tmp/issue-256-slack-events.diff
          outside="$(git diff --name-only | grep -v '^server/yos-ai/' || true)"
          if [ -n "$outside" ]; then
            echo "Out-of-scope patch paths:"
            echo "$outside"
            exit 1
          fi
          if git diff --name-only | grep -Fx 'server/yos-ai/src/point-event.ts'; then
            echo 'Forbidden PR #280 overlap detected'
            exit 1
          fi
          git diff --check

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependency without lockfile mutation
        working-directory: server/yos-ai
        run: npm install --no-package-lock --ignore-scripts

      - name: Run YOS AI tests
        working-directory: server/yos-ai
        run: npm test

      - name: Commit exact Issue #256 patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/yos-ai
          git diff --cached --check
          git commit -m 'feat(yos-ai): add Slack Events intake for Clarity'
          git push origin HEAD:codex/issue-256-slack-events-intake
