name: Fetch Shared Flows Temporary

on:
  push:
    branches:
      - flow-canonicalization-20261003
    paths:
      - ".github/workflows/fetch-shared-flows-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch iCloud Shortcut shares
        shell: python
        run: |
          import hashlib
          import json
          import plistlib
          import re
          import urllib.request
          from pathlib import Path

          ids = [
              "ba12343727064dde851140c6715b80db",
              "904f29b9bf5d475dbd32646e458d4249",
              "3b75f6e2f3d547ddbb48e366ede0f0b9",
              "38dcc0c037294f419d24d4bdac2567a8",
              "08b110bd699a4ee9ab7b1a1bd4bb67f3",
          ]

          out = Path("shared-flows")
          out.mkdir()
          summary = []

          def get(url: str) -> bytes:
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          def resolve_asset(value: dict, filename: str) -> str:
              url = value["downloadURL"]
              return url.replace("${f}", filename)

          for shortcut_id in ids:
              meta_url = f"https://www.icloud.com/shortcuts/api/records/{shortcut_id}"
              meta = json.loads(get(meta_url))
              if "records" in meta:
                  meta = meta["records"][0]
              fields = meta["fields"]
              name = fields["name"]["value"]
              safe = re.sub(r"[^0-9A-Za-z._ -]+", "_", name).strip() or shortcut_id

              unsigned_value = fields["shortcut"]["value"]
              unsigned_url = resolve_asset(unsigned_value, "shortcut.plist")
              unsigned = get(unsigned_url)
              plist_obj = plistlib.loads(unsigned)

              signed = b""
              signed_field = fields.get("signedShortcut")
              if signed_field and signed_field.get("value"):
                  signed_url = resolve_asset(signed_field["value"], "shortcut.shortcut")
                  signed = get(signed_url)

              (out / f"{shortcut_id}__{safe}.plist").write_bytes(unsigned)
              (out / f"{shortcut_id}__{safe}.xml").write_bytes(
                  plistlib.dumps(plist_obj, fmt=plistlib.FMT_XML, sort_keys=False)
              )
              if signed:
                  (out / f"{shortcut_id}__{safe}.shortcut").write_bytes(signed)

              actions = plist_obj.get("WFWorkflowActions", [])
              summary.append({
                  "id": shortcut_id,
                  "name": name,
                  "unsigned_sha256": hashlib.sha256(unsigned).hexdigest(),
                  "unsigned_size": len(unsigned),
                  "signed_sha256": hashlib.sha256(signed).hexdigest() if signed else None,
                  "signed_size": len(signed) if signed else None,
                  "action_count": len(actions),
                  "action_identifiers": [
                      a.get("WFWorkflowActionIdentifier") for a in actions
                  ],
              })

          (out / "summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

      - name: Upload recovered shared flows
        uses: actions/upload-artifact@v4
        with:
          name: shared-flows-recovered
          path: shared-flows/
          if-no-files-found: error
