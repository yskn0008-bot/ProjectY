name: Taxi PR244 Codex Patch Transport

on:
  push:
    branches:
      - codex/issue-238-shift-button-clip

permissions:
  contents: write

jobs:
  transport:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-238-shift-button-clip
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconstruct verified Codex patch
        shell: bash
        run: |
          cat > /tmp/pr244.patch <<'PATCH'
          diff --git a/taxi/demand-home-v144.css b/taxi/demand-home-v144.css
          index 6144c31..ffd83f0 100644
          --- a/taxi/demand-home-v144.css
          +++ b/taxi/demand-home-v144.css
          @@ -1,8 +1,8 @@
          -.yos131-drive:has(.demand-home){grid-template-rows:36px 145px 52px 80px 48px 52px}
          +.yos131-drive:has(.demand-home){grid-template-rows:36px 158px 52px 80px 48px 52px}
           .demand-home{min-width:0;padding:6px 7px;display:grid;grid-template-columns:minmax(0,1fr) 102px;gap:6px;align-items:stretch}
           .demand-home>div{min-width:0;display:grid;align-content:center;gap:2px}
           .demand-home span{color:var(--yos131-gold2);font-size:10px;font-weight:900}
           .demand-home strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.demand-home small{color:#c7c7ca;font-size:10px;white-space:normal;overflow:visible;text-overflow:clip}
           .demand-home>a{min-width:0;min-height:44px;border:1px solid var(--yos131-line);border-radius:8px;color:#fff;text-decoration:none;display:grid;place-items:center;text-align:center;font-size:11px;font-weight:900}
           .demand-home .demand-source{min-height:44px;color:#bfcfff;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center}
          -@media(max-height:520px){.yos131-drive:has(.demand-home){grid-template-rows:32px 130px 45px 68px 44px 46px}.demand-home{grid-template-columns:minmax(0,1fr) 92px}}
          +@media(max-height:520px){.yos131-drive:has(.demand-home){grid-template-rows:32px 143px 45px 68px 44px 46px}.demand-home{grid-template-columns:minmax(0,1fr) 92px}}
          diff --git a/taxi/index.html b/taxi/index.html
          index 4068b90..44f3dde 100644
          --- a/taxi/index.html
          +++ b/taxi/index.html
          @@ -8,6 +8,9 @@
           <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
           <meta name="apple-mobile-web-app-title" content="YOS Taxi">
           <link rel="manifest" href="./manifest.webmanifest">
          +<link rel="stylesheet" href="./final-app-v131.css">
          +<link rel="stylesheet" href="./final-fix-v133.css">
          +<script defer src="./final-app-v131.js"></script>
           <title>YOS Taxi Operations</title>
           <style>
           :root{color-scheme:dark;--bg:#09090b;--panel:#151517;--panel2:#1d1d21;--line:#2a2a30;--text:#fafafa;--muted:#aaaab4;--amber:#ffb323;--orange:#ff7a00;--green:#48d17d;--red:#ff5c67;--blue:#74a7ff}
          diff --git a/taxi/service-worker.js b/taxi/service-worker.js
          index 402b512..2a9752f 100644
          --- a/taxi/service-worker.js
          +++ b/taxi/service-worker.js
          @@ -1,7 +1,7 @@
           'use strict';
           const CACHE_PREFIX='yos-taxi-projecty-';
          -const CACHE='yos-taxi-projecty-v147-shift-start-gate';
          -const VERSION='147';
          +const CACHE='yos-taxi-projecty-v148-shift-start-gate';
          +const VERSION='148';
           const STATIC=[
             './','./index.html','./calendar.html','./settings.html','./manifest.webmanifest','./swipe-nav.js',
             './final-app-v131.css','./final-fix-v133.css','./final-app-v131.js',
          diff --git a/taxi/tests/shift-start-gate.test.mjs b/taxi/tests/shift-start-gate.test.mjs
          index e3e7d18..6c3f9a0 100644
          --- a/taxi/tests/shift-start-gate.test.mjs
          +++ b/taxi/tests/shift-start-gate.test.mjs
          @@ -56,6 +56,9 @@ test('元handlerは副作用より先にgateを確認', () => {
           });
           
           test('visible proxyは生成・同期され、disabled時に転送しない', () => {
          +  assert.match(html, /<link rel="stylesheet" href="\.\/final-app-v131\.css">/);
          +  assert.match(html, /<link rel="stylesheet" href="\.\/final-fix-v133\.css">/);
          +  assert.match(html, /<script defer src="\.\/final-app-v131\.js"><\/script>/);
             assert.match(finalApp, /if\(source&&!button&&pageType\(\)==='drive'\)/);
             assert.match(finalApp, /button\.disabled=source\.disabled/);
             assert.match(finalApp, /if\(!source\|\|source\.disabled\)return;source\.click\(\)/);
          @@ -71,5 +74,5 @@ test('保存キーとTaxi Service Worker境界を変更しない', () => {
             assert.doesNotMatch(html + finalApp, /migration|removeItem\(|localStorage\.clear\(/i);
             assert.match(sw, /const CACHE_PREFIX='yos-taxi-projecty-'/);
             assert.match(sw, /key\.startsWith\(CACHE_PREFIX\)&&key!==CACHE/);
          -  assert.match(sw, /const VERSION='147'/);
          +  assert.match(sw, /const VERSION='148'/);
           });
          PATCH
      - name: Validate and apply patch
        shell: bash
        run: |
          test "$(git diff --name-only | wc -l)" -eq 0
          git apply --check /tmp/pr244.patch
          git apply /tmp/pr244.patch
          CHANGED="$(git diff --name-only | sort)"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = $'taxi/demand-home-v144.css\ntaxi/index.html\ntaxi/service-worker.js\ntaxi/tests/shift-start-gate.test.mjs'
          git diff --check
          node --test taxi/tests/*.test.mjs
          node --test taxi/tests/demand-calendar.test.mjs
      - name: Remove transport workflow and push product commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/taxi-pr244-patch-transport.yml
          git add taxi/demand-home-v144.css taxi/index.html taxi/service-worker.js taxi/tests/shift-start-gate.test.mjs
          git diff --cached --check
          git commit -m "fix(taxi): load shift gate UI on first navigation"
          git push origin HEAD:codex/issue-238-shift-button-clip
