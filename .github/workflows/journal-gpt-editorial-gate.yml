name: YOS JOURNAL GPT editorial candidate safety

on:
  pull_request:
    paths:
      - 'journal/gpt-editorial-gate.mjs'
      - 'journal/tests/gpt-editorial-gate.test.mjs'
      - 'journal/GPT_EDITORIAL.md'
      - 'journal/source-evidence-audit.mjs'
      - 'journal/tests/source-evidence-audit.test.mjs'
      - 'journal/tests/fixtures/evidence-live-sample.public.json'
      - 'journal/SOURCE_EVIDENCE_AUDIT_PROTOTYPE.md'
      - 'journal/editorial-candidates/*.json'
      - '.github/workflows/journal-gpt-editorial-gate.yml'

permissions:
  contents: read

jobs:
  gpt-editorial-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check GPT candidate parser syntax
        run: node --check journal/gpt-editorial-gate.mjs
      - name: Check private research evidence module syntax
        run: node --check journal/source-evidence-audit.mjs
      - name: Test offline research retrieval, evidence matching and fail-closed safety
        run: node --test journal/tests/source-evidence-audit.test.mjs
      - name: Live research source smoke (non-blocking source availability, NO publication)
        shell: bash
        run: |
          set -euo pipefail
          node journal/source-evidence-audit.mjs --input journal/tests/fixtures/evidence-live-sample.public.json --output /tmp/yos-live-research-audit.json
          node -e "const a=require('/tmp/yos-live-research-audit.json');console.log(JSON.stringify({sources:a.sources.map(s=>({id:s.id,status:s.status,reason:s.reason||null})),claims:a.claims.map(c=>({id:c.id,status:c.status})),publicationAllowed:a.publicationAllowed,verifiedClaims:a.checks.verifiedClaims}))"
      - name: Test privacy, sources, dates, existing edition preservation
        run: node --test journal/tests/gpt-editorial-gate.test.mjs
      - name: Check added or modified GPT candidate JSON from this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD -- 'journal/editorial-candidates/*.json' | while IFS= read -r candidate; do
            test -f "$candidate" || continue
            node journal/gpt-editorial-gate.mjs --candidate "$candidate" --validate-only
          done
