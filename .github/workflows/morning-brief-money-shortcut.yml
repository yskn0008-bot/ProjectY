name: Morning Brief Money shortcut

on:
  pull_request:
    paths:
      - 'yos/morning-brief-bridge-v1.js'
      - 'yos/morning-brief-bridge.html'
      - 'yos/tests/morning-brief-bridge.test.mjs'
      - 'yos/money-master-v1.js'
      - 'tools/morning-brief/**'
      - 'tools/clarity-factory/sign_with_hubsign.py'
      - '.github/workflows/morning-brief-money-shortcut.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Test existing Morning Brief bridge
        shell: bash
        run: |
          set -euo pipefail
          node --check yos/morning-brief-bridge-v1.js
          node --test yos/tests/morning-brief-bridge.test.mjs

      - name: Build no-Safari Morning Brief plist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/morning-brief/artifacts
          python3 tools/morning-brief/patch_no_safari.py \
            'tools/morning-brief/Morning Brief Money Connected.plist' \
            'tools/morning-brief/artifacts/Morning Brief.plist'

      - name: Validate no-Safari Shortcut contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          path=Path('tools/morning-brief/artifacts/Morning Brief.plist')
          workflow=plistlib.loads(path.read_bytes())
          actions=workflow.get('WFWorkflowActions',[])
          ids=[a.get('WFWorkflowActionIdentifier','') for a in actions]
          blob=repr(workflow)

          assert len(actions)==11, len(actions)
          assert workflow.get('WFWorkflowHasShortcutInputVariables') is False
          assert ids.count('is.workflow.actions.weather.currentconditions')==1
          assert ids.count('is.workflow.actions.weather.forecast')==1
          assert ids.count('is.workflow.actions.filter.calendarevents')==1
          assert ids.count('is.workflow.actions.filter.reminders')==1
          assert ids.count('is.workflow.actions.downloadurl')==1
          assert ids.count('is.workflow.actions.askllm')==1
          assert ids.count('is.workflow.actions.notification')==1
          assert ids.count('is.workflow.actions.alert')==1
          assert ids.count('is.workflow.actions.openurl')==0
          assert ids.count('is.workflow.actions.exit')==0
          assert 'raw.githubusercontent.com/yskn0008-bot/ProjectY/main/yos/money-master-v1.js' in blob
          assert 'morning-brief-bridge.html?return=shortcut' not in blob
          assert 'shortcuts://run-shortcut' not in blob
          assert '【お金】' in blob
          assert 'base.masterFacts' in blob
          assert '表示は次の7行以内' in blob
          assert 'iPhoneの1画面で最後まで読める短さ' in blob
          print(f'Morning Brief no-Safari contract: PASS ({len(actions)} actions)')
          PY

      - name: Sign Morning Brief
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input 'tools/morning-brief/artifacts/Morning Brief.plist' \
            --output 'tools/morning-brief/artifacts/Morning Brief.shortcut' \
            --name 'Morning Brief' \
            2>&1 | tee tools/morning-brief/artifacts/morning-brief-hubsign.log

      - name: Verify signed artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/morning-brief/artifacts/Morning Brief.shortcut')
          data=p.read_bytes()
          assert data.startswith(b'AEA1'), data[:8]
          assert len(data)>500, len(data)
          print(f'Morning Brief signed AEA1: PASS ({len(data)} bytes)')
          PY

      - name: Publish iPhone acceptance artifact to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p tools/morning-brief/acceptance
          cp 'tools/morning-brief/artifacts/Morning Brief.shortcut' 'tools/morning-brief/acceptance/Morning Brief.shortcut'
          git config user.name 'ProjectY OEL'
          git config user.email 'actions@users.noreply.github.com'
          git add 'tools/morning-brief/acceptance/Morning Brief.shortcut'
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish Morning Brief no-Safari acceptance artifact [skip ci]'
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Upload iPhone acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: morning-brief-final
          path: |
            tools/morning-brief/artifacts/Morning Brief.shortcut
            tools/morning-brief/artifacts/morning-brief-hubsign.log
          if-no-files-found: error
