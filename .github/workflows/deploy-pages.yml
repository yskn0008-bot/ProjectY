name: Sync and deploy YOS Mission Control

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/mission-control.json'
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Synchronize GitHub state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_mission_control.py

      - name: Save synchronized state
        run: |
          if git diff --quiet -- data/mission-control.json; then
            echo "Mission Control data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mission-control.json
          git commit -m "data: sync GitHub state"
          if ! git push origin HEAD:main; then
            echo "::warning::main advanced during Mission Control sync; continuing Pages deploy with this synchronized snapshot."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build JOURNAL archive index
        run: |
          python - <<'PYTHON'
          import json
          import re
          from pathlib import Path

          fields = ("category", "title", "image", "imageCaption", "imageKind",
                    "imageCredit", "imageSourceUrl", "imageLicenseUrl")
          editions = []
          for path in sorted(Path("journal/editions").glob("????-??-??.json"), reverse=True):
              try:
                  issue = json.loads(path.read_text(encoding="utf-8"))
                  if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", path.stem) or issue["issuedOn"] != path.stem:
                      raise ValueError("edition date does not match its filename")
                  if not isinstance(issue["articles"], list) or not issue["articles"]:
                      raise ValueError("issue has no articles")
                  cards = []
                  for article in issue["articles"]:
                      card = {key: article[key] for key in fields if key in article}
                      card["summary"] = article.get("summary", "")[:65]
                      cards.append(card)
                  editions.append({"issuedOn": path.stem, "articles": cards})
              except (OSError, ValueError, KeyError, TypeError) as error:
                  print(f"::warning::Skipping invalid JOURNAL edition {path.name}: {error}")

          Path("journal-v2/archive-index.json").write_text(
              json.dumps({"editions": editions}, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PYTHON

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
