name: PR244 Codex smoke recovery

on:
  push:
    branches:
      - codex/issue-238-shift-button-clip
    paths:
      - .github/workflows/pr244-codex-smoke-recovery.yml

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-238-shift-button-clip
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact Codex selector recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = [Path('taxi/tests/iphone17.spec.mjs'), Path('taxi/tests/iphone-se3.spec.mjs')]
          old = "{ name: 'drive', path: './index.html', ready: '#shiftButton' },"
          new = "{ name: 'drive', path: './index.html', ready: '.yos131-primary[data-proxy=\"shiftButton\"]' },"
          for p in files:
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{p}: expected old selector exactly once, got {text.count(old)}')
              if new in text:
                  raise SystemExit(f'{p}: new selector already present unexpectedly')
              p.write_text(text.replace(old, new, 1))
          PY
          changed="$(git diff --name-only)"
          expected=$'taxi/tests/iphone-se3.spec.mjs\ntaxi/tests/iphone17.spec.mjs'
          if [ "$(printf '%s\n' "$changed" | sort)" != "$(printf '%s\n' "$expected" | sort)" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --check
          node --test taxi/tests/*.test.mjs
      - name: Commit recovered Codex patch and self-delete transport
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr244-codex-smoke-recovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taxi/tests/iphone17.spec.mjs taxi/tests/iphone-se3.spec.mjs .github/workflows/pr244-codex-smoke-recovery.yml
          staged="$(git diff --cached --name-only)"
          allowed_re='^(taxi/tests/iphone17\.spec\.mjs|taxi/tests/iphone-se3\.spec\.mjs|\.github/workflows/pr244-codex-smoke-recovery\.yml)$'
          bad="$(printf '%s\n' "$staged" | grep -Ev "$allowed_re" || true)"
          test -z "$bad" || { echo "Unexpected staged files: $bad"; exit 1; }
          git diff --cached --check
          git commit -m 'test(taxi): wait for visible shift control'
          git push origin HEAD:codex/issue-238-shift-button-clip
