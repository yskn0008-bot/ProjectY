name: YOS AI Cloud Run

on:
  workflow_dispatch:
    inputs:
      action:
        description: "check or deploy"
        required: true
        default: "check"
        type: choice
        options:
          - check
          - deploy

permissions:
  contents: read
  id-token: write

concurrency:
  group: yos-ai-cloud-run-production
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/yos-ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test

  readiness:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_CLOUD_RUN_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_CLOUD_RUN_REGION }}
      GCP_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_GITHUB_WIF_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_GITHUB_DEPLOY_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_ALLOWED_SUBJECT_HASH: ${{ secrets.GOOGLE_ALLOWED_SUBJECT_HASH }}
      YOS_ALLOWED_ORIGINS: ${{ secrets.YOS_ALLOWED_ORIGINS }}
      YOS_LAW_DOCUMENT_ID: ${{ secrets.YOS_LAW_DOCUMENT_ID }}
      YOS_MASTER_DOCUMENT_ID: ${{ secrets.YOS_MASTER_DOCUMENT_ID }}
      YOS_CHANGE_LOG_DOCUMENT_ID: ${{ secrets.YOS_CHANGE_LOG_DOCUMENT_ID }}
      YOS_SYSTEM_MASTER_DOCUMENT_ID: ${{ secrets.YOS_SYSTEM_MASTER_DOCUMENT_ID }}
      YOS_TAXI_MASTER_DOCUMENT_ID: ${{ secrets.YOS_TAXI_MASTER_DOCUMENT_ID }}
      PROJECT75_SPREADSHEET_ID: ${{ secrets.PROJECT75_SPREADSHEET_ID }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      YOS_TAXI_SYNC_TOKEN_SHA256: ${{ secrets.YOS_TAXI_SYNC_TOKEN_SHA256 }}
      YOS_CLARITY_INTAKE_TOKEN_SHA256: ${{ secrets.YOS_CLARITY_INTAKE_TOKEN_SHA256 }}
      YOS_NOTION_API_TOKEN: ${{ secrets.YOS_NOTION_API_TOKEN }}
      YOS_NOTION_TASKS_DATA_SOURCE_ID: ${{ secrets.YOS_NOTION_TASKS_DATA_SOURCE_ID }}
      YOS_NOTION_INBOX_PAGE_ID: ${{ secrets.YOS_NOTION_INBOX_PAGE_ID }}
    steps:
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          required=(
            GCP_PROJECT_ID
            GCP_REGION
            GCP_SERVICE
            GCP_WIF_PROVIDER
            GCP_DEPLOY_SERVICE_ACCOUNT
            GCP_RUNTIME_SERVICE_ACCOUNT
            OPENAI_MODEL
            OPENAI_API_KEY
            GOOGLE_CLIENT_ID
            GOOGLE_ALLOWED_SUBJECT_HASH
            YOS_ALLOWED_ORIGINS
            YOS_LAW_DOCUMENT_ID
            YOS_MASTER_DOCUMENT_ID
            YOS_CHANGE_LOG_DOCUMENT_ID
            YOS_SYSTEM_MASTER_DOCUMENT_ID
            YOS_TAXI_MASTER_DOCUMENT_ID
            PROJECT75_SPREADSHEET_ID
            UPSTASH_REDIS_REST_URL
            UPSTASH_REDIS_REST_TOKEN
          )
          missing=()
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Cloud Run activation values: %s\n' "${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ inputs.action }}" == "deploy" ]]; then exit 2; fi
          else
            echo "Cloud Run deployment configuration is complete."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    if: inputs.action == 'deploy' && needs.readiness.outputs.ready == 'true'
    needs: readiness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_CLOUD_RUN_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_GITHUB_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_DEPLOY_SERVICE_ACCOUNT }}

      - name: Stage existing Cloud Run Dockerfile
        run: cp server/yos-ai/cloud-run/Dockerfile server/yos-ai/Dockerfile

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_CLOUD_RUN_PROJECT_ID }}
          region: ${{ vars.GCP_CLOUD_RUN_REGION }}
          service: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          source: server/yos-ai
          flags: >-
            --service-account=${{ vars.GCP_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
            --allow-unauthenticated
            --min=0
            --max=3
            --memory=512Mi
            --cpu=1
            --concurrency=40
          env_vars_update_strategy: overwrite
          env_vars: |-
            NODE_ENV=production
            YOS_RUNTIME_PROVIDER=google_cloud_run
            GOOGLE_AUTH_MODE=application_default
            OPENAI_MODEL=${{ vars.OPENAI_MODEL }}
            YOS_NAV_MODEL_CACHE_SECONDS=900
            YOS_AUDIT_RETENTION_DAYS=30
            YOS_REQUESTS_PER_HOUR=30
            YOS_MAX_OUTPUT_TOKENS=5000
            YOS_LIVE_MAX_OUTPUT_TOKENS=1500
            YOS_MAX_CONTEXT_CHARACTERS=100000
            YOS_MAX_DOCUMENT_CHARACTERS=30000
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_ALLOWED_SUBJECT_HASH=${{ secrets.GOOGLE_ALLOWED_SUBJECT_HASH }}
            YOS_ALLOWED_ORIGINS=${{ secrets.YOS_ALLOWED_ORIGINS }}
            YOS_LAW_DOCUMENT_ID=${{ secrets.YOS_LAW_DOCUMENT_ID }}
            YOS_MASTER_DOCUMENT_ID=${{ secrets.YOS_MASTER_DOCUMENT_ID }}
            YOS_CHANGE_LOG_DOCUMENT_ID=${{ secrets.YOS_CHANGE_LOG_DOCUMENT_ID }}
            YOS_SYSTEM_MASTER_DOCUMENT_ID=${{ secrets.YOS_SYSTEM_MASTER_DOCUMENT_ID }}
            YOS_TAXI_MASTER_DOCUMENT_ID=${{ secrets.YOS_TAXI_MASTER_DOCUMENT_ID }}
            PROJECT75_SPREADSHEET_ID=${{ secrets.PROJECT75_SPREADSHEET_ID }}
            UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
            UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
            YOS_TAXI_SYNC_TOKEN_SHA256=${{ secrets.YOS_TAXI_SYNC_TOKEN_SHA256 }}
            YOS_CLARITY_INTAKE_TOKEN_SHA256=${{ secrets.YOS_CLARITY_INTAKE_TOKEN_SHA256 }}
            YOS_NOTION_API_TOKEN=${{ secrets.YOS_NOTION_API_TOKEN }}
            YOS_NOTION_TASKS_DATA_SOURCE_ID=${{ secrets.YOS_NOTION_TASKS_DATA_SOURCE_ID }}
            YOS_NOTION_INBOX_PAGE_ID=${{ secrets.YOS_NOTION_INBOX_PAGE_ID }}

      - name: Smoke health
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/yos-health.json -w '%{http_code}' "$BASE_URL/api/yos/health")"
          test "$status" = "200"
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/yos-health.json','utf8')); if(x.status!=='ok'&&x.status!=='ready') process.exit(1)"

      - name: Record candidate URL
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Cloud Run candidate deployed and health-smoked."
          echo "URL is intentionally not auto-enabled in data/yos-runtime-providers.json."
          echo "Run live parity before enabling failover."
