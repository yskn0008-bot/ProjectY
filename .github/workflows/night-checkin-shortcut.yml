name: Night Check-in MY LIFE artifact

on:
  pull_request:
    paths:
      - 'life/night-checkin-life-bridge-v1.js'
      - 'life/tests/night-checkin-life-bridge.test.mjs'
      - 'life/yos-suite-v3.js'
      - 'tools/night-checkin/**'
      - '.github/workflows/night-checkin-shortcut.yml'
  push:
    branches: [main]
    paths:
      - 'life/night-checkin-life-bridge-v1.js'
      - 'life/tests/night-checkin-life-bridge.test.mjs'
      - 'life/yos-suite-v3.js'
      - 'tools/night-checkin/**'
      - '.github/workflows/night-checkin-shortcut.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Test MY LIFE Night bridge
        shell: bash
        run: |
          set -euo pipefail
          node --check life/night-checkin-life-bridge-v1.js
          node --check life/yos-suite-v3.js
          node --test life/tests/night-checkin-life-bridge.test.mjs

      - name: Install pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri
          cherri --version

      - name: Compile Night Check-in
        shell: bash
        run: |
          set -euo pipefail
          cd tools/night-checkin
          rm -f './Night Check in_unsigned.shortcut' './Night Check in.plist'
          cherri 'Night Check in.cherri' --skip-sign --debug
          test -f './Night Check in_unsigned.shortcut'
          mkdir -p artifacts
          cp './Night Check in_unsigned.shortcut' artifacts/Night-Check-in-unsigned.shortcut

      - name: Validate compiled Shortcut contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          path=Path('tools/night-checkin/artifacts/Night-Check-in-unsigned.shortcut')
          workflow=plistlib.loads(path.read_bytes())
          actions=workflow.get('WFWorkflowActions',[])
          ids=[a.get('WFWorkflowActionIdentifier','') for a in actions]
          blob=repr(workflow)

          assert ids.count('is.workflow.actions.ask') == 1, ids.count('is.workflow.actions.ask')
          assert ids.count('is.workflow.actions.askllm') == 1, ids.count('is.workflow.actions.askllm')
          assert sum(i.endswith('openurl') for i in ids) == 1, ids
          assert ids.count('is.workflow.actions.documentpicker.open') >= 1, ids
          assert ids.count('is.workflow.actions.documentpicker.save') >= 1, ids
          assert ids.count('is.workflow.actions.detect.text') >= 1, ids
          assert ids.count('is.workflow.actions.base64encode') >= 8, ids.count('is.workflow.actions.base64encode')
          assert ids.count('is.workflow.actions.urlencode') >= 8, ids.count('is.workflow.actions.urlencode')
          assert 'YOS Night History.json' in blob
          assert 'yos-night-save-ok-v1' in blob
          assert 'night_history=1' not in blob
          assert 'night_save=1' in blob
          assert 'https://yskn0008-bot.github.io/ProjectY/life/' in blob
          assert 'Night%20Check%20in' in blob
          assert 'Money' not in blob
          print(f'Night Check-in compiled contract: PASS ({len(actions)} actions)')
          PY

      - name: Sign Night Check-in
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py             --input tools/night-checkin/artifacts/Night-Check-in-unsigned.shortcut             --output tools/night-checkin/artifacts/Night-Check-in-signed.shortcut             --name 'Night Check in'             2>&1 | tee tools/night-checkin/artifacts/night-checkin-hubsign.log
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tools/night-checkin/artifacts/Night-Check-in-signed.shortcut')
          data=path.read_bytes()
          assert data.startswith(b'AEA1'), data[:8]
          assert len(data)>500, len(data)
          print(f'Night Check-in signed AEA1: PASS ({len(data)} bytes)')
          PY

      - name: Upload iPhone acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: night-check-in-my-life
          path: |
            tools/night-checkin/artifacts/Night-Check-in-unsigned.shortcut
            tools/night-checkin/artifacts/Night-Check-in-signed.shortcut
            tools/night-checkin/artifacts/night-checkin-hubsign.log
          if-no-files-found: error
