name: One-shot Money shadow Vercel retry

on:
  schedule:
    - cron: '0 16 24 9 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: money-shadow-vercel-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Check retry window
        id: guard
        run: |
          if [ "$(date -u +%Y-%m-%d)" = "2026-09-24" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout main
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Trigger one production redeploy and remove this retry
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "ProjectY OEL"
          git config user.email "actions@users.noreply.github.com"
          printf 'money-shadow-redeploy %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > server/yos-ai/.money-shadow-redeploy
          rm .github/workflows/money-shadow-vercel-retry.yml
          git add -A
          git commit -m "chore: retry Money shadow Vercel deployment"
          git push origin HEAD:main
