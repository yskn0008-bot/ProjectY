name: YOS JOURNAL editorial candidate

on:
  schedule:
    - cron: '17 22 * * *' # 07:17 JST, only after workflow is in main
  workflow_dispatch:
    inputs:
      publish:
        description: 'Confirm source, copyright and privacy review before publishing'
        type: boolean
        default: false

permissions:
  contents: read
  models: read

concurrency:
  group: yos-journal-editorial
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test editorial safety
        run: node --test ios-app/tests/journal-daily-editor.test.mjs ios-app/tests/journal-editorial-viewer.test.mjs ios-app/tests/journal-isolated-installer.test.mjs
      - name: Prepare public-source draft
        run: node ios-app/scriptable/journal/daily-editor.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YOS_JOURNAL_CANDIDATE: ${{ runner.temp }}/yos-journal-candidate.json
      - name: Keep review candidate (not published)
        uses: actions/upload-artifact@v4
        with:
          name: yos-journal-editorial-candidate
          path: ${{ runner.temp }}/yos-journal-candidate.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: candidate
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yos-journal-editorial-candidate
          path: ${{ runner.temp }}/journal-review
      - name: Validate current date and public-only publication
        shell: bash
        run: |
          set -euo pipefail
          node ios-app/scriptable/journal/validate-publish.mjs "$RUNNER_TEMP/journal-review/yos-journal-candidate.json"
          cp "$RUNNER_TEMP/journal-review/yos-journal-candidate.json" ios-app/scriptable/journal/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios-app/scriptable/journal/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "journal: publish source-reviewed issue"
          git push
