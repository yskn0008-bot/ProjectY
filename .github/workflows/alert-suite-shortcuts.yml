name: YOS Alert suite shortcuts

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/alerts/**'
      - 'yos/alerts/**'
      - 'yos/money-alert-bridge*'
      - 'yos/shared-state-v1.js'
      - '.github/workflows/alert-suite-shortcuts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Test shared alert engine
        shell: bash
        run: |
          set -euo pipefail
          node --test yos/alerts/alert-engine.test.mjs
          node --check yos/money-alert-bridge-v1.js

      - name: Install pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri
          cherri --version

      - name: Compile alert shortcuts
        shell: bash
        run: |
          set -euo pipefail
          cd tools/alerts
          mkdir -p artifacts
          for name in 'Money Alert' 'Task Alert' 'Routine Alert' 'Emergency Alert' 'Important Mail'; do
            rm -f "./${name}_unsigned.shortcut"
            cherri "${name}.cherri" --skip-sign --debug
            test -f "./${name}_unsigned.shortcut"
            cp "./${name}_unsigned.shortcut" "artifacts/${name}.plist"
          done
          python3 patch_reminder_alert.py 'artifacts/Task Alert.plist' TASK
          python3 patch_reminder_alert.py 'artifacts/Routine Alert.plist' ROUTINE

      - name: Validate alert safety contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          root=Path('tools/alerts/artifacts')
          def read(name):
              p=root/f'{name}.plist'
              w=plistlib.loads(p.read_bytes())
              a=w.get('WFWorkflowActions',[])
              return w,a,[x.get('WFWorkflowActionIdentifier','') for x in a],repr(w)

          dangerous={
            'is.workflow.actions.sendemail',
            'is.workflow.actions.sendmessage',
            'is.workflow.actions.deleteemail',
            'is.workflow.actions.file.delete'
          }

          w,a,ids,blob=read('Money Alert')
          assert w.get('WFWorkflowHasShortcutInputVariables') is True
          assert ids.count('is.workflow.actions.openurl') == 1
          assert 'money-alert-bridge.html?return=shortcut' in blob
          assert 'dedupe=1' in blob
          assert 'YOS_MONEY_ALERT_V1' in blob
          assert '緊急Money Alertなし' in blob
          assert 'YOS Display History' in blob

          for name,marker,none_token in (
              ('Task Alert','YOS_TASK_','TASK_ALERT_NONE'),
              ('Routine Alert','YOS_ROUTINE_','ROUTINE_ALERT_NONE'),
          ):
              w,a,ids,blob=read(name)
              assert ids.count('is.workflow.actions.filter.reminders') == 1
              assert ids.count('is.workflow.actions.properties.reminders') == 3
              assert "'Property': 'Has Alarms'" in blob
              assert "'Bool': False" in blob
              assert marker+'REMINDERS_PLACEHOLDER' not in blob
              assert none_token in blob
              assert 'YOS Display History' in blob

          w,a,ids,blob=read('Emergency Alert')
          assert w.get('WFWorkflowHasShortcutInputVariables') is True
          for gate in ('AWARE=1','ACTION=1','HARM=1'):
              assert gate in blob
          assert ids.count('is.workflow.actions.askllm') == 0
          assert 'YOS_EMERGENCY_V1' in blob
          assert 'YOS Display History' in blob

          w,a,ids,blob=read('Important Mail')
          assert w.get('WFWorkflowHasShortcutInputVariables') is True
          assert ids.count('is.workflow.actions.askllm') == 1
          assert 'IMPORTANT_MAIL_NONE' in blob
          assert 'YOS Display History' in blob
          assert '広告、キャンペーン、セール' in blob

          for name in ('Money Alert','Task Alert','Routine Alert','Emergency Alert','Important Mail'):
              _,a,ids,blob=read(name)
              assert not (dangerous & set(ids)), (name,dangerous & set(ids))
              assert ids.count('is.workflow.actions.documentpicker.save') <= 1
          print('YOS Alert suite safety contract: PASS')
          PY

      - name: Sign alert shortcuts
        shell: bash
        run: |
          set -euo pipefail
          for name in 'Money Alert' 'Task Alert' 'Routine Alert' 'Emergency Alert' 'Important Mail'; do
            python3 tools/clarity-factory/sign_with_hubsign.py \
              --input "tools/alerts/artifacts/${name}.plist" \
              --output "tools/alerts/artifacts/${name}.shortcut" \
              --name "${name}" \
              2>&1 | tee "tools/alerts/artifacts/${name// /-}-hubsign.log"
          done

      - name: Verify signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('Money Alert','Task Alert','Routine Alert','Emergency Alert','Important Mail'):
              p=Path('tools/alerts/artifacts')/f'{name}.shortcut'
              data=p.read_bytes()
              assert data.startswith(b'AEA1'), (name,data[:8])
              assert len(data)>500, (name,len(data))
              print(name,'AEA1 PASS',len(data))
          PY

      - name: Upload iPhone acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: yos-alert-suite
          path: |
            tools/alerts/artifacts/*.shortcut
            tools/alerts/artifacts/*.plist
            tools/alerts/artifacts/*-hubsign.log
          if-no-files-found: error
