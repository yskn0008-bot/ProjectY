name: Clarity V2Y brightness readback

on:
  pull_request:
    paths:
      - 'tools/clarity-factory/clarity-probe-v2y.cherri'
      - '.github/workflows/clarity-v2y-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sign-v2y:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri

      - name: Compile V2Y
        shell: bash
        run: |
          set -euo pipefail
          cd tools/clarity-factory
          cherri clarity-probe-v2y.cherri --skip-sign --debug
          probe='./ClarityProbeV2Y_unsigned.shortcut'
          test -f "$probe"
          grep -q 'ClarityActionsV2X' "$probe"
          grep -q 'Current Brightness' "$probe"
          mkdir -p artifacts-v2y
          cp "$probe" artifacts-v2y/ClarityProbeV2Y.shortcut

      - name: Sign V2Y
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input tools/clarity-factory/artifacts-v2y/ClarityProbeV2Y.shortcut \
            --output tools/clarity-factory/artifacts-v2y/ClarityProbeV2Y-signed.shortcut \
            --name 'ClarityProbeV2Y'

      - name: Verify AEA1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/clarity-factory/artifacts-v2y/ClarityProbeV2Y-signed.shortcut')
          data=p.read_bytes()
          assert data.startswith(b'AEA1')
          assert len(data)>500
          print(len(data))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: clarity-v2y
          path: tools/clarity-factory/artifacts-v2y/ClarityProbeV2Y-signed.shortcut
          if-no-files-found: error
