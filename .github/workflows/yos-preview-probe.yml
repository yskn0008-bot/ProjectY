name: YOS Preview Probe

on:
  push:
    branches:
      - one-enter/yos-chat-immediate-preview-fallback

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe READY preview without bypass token
        shell: bash
        run: |
          set -euo pipefail
          base='https://project-y-yos-2np2x4mis-project-y1.vercel.app'
          origin='https://yskn0008-bot.github.io'
          code="$(curl -sS -o /tmp/public-config.json -w '%{http_code}' -H "Origin: $origin" "$base/api/yos/public-config" || true)"
          echo "public-config status=$code"
          if [[ "$code" != "200" ]]; then
            exit 2
          fi
          health="$(curl -sS -o /tmp/health.json -w '%{http_code}' -H "Origin: $origin" "$base/api/yos/health" || true)"
          echo "health status=$health"
          [[ "$health" == "200" ]]
