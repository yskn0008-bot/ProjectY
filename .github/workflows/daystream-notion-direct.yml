name: DAYSTREAM Notion Direct
on:
  pull_request:
    paths:
      - 'ios-app/scriptable/YOS DAYSTREAM Notion.js'
      - 'ios-app/tests/daystream-notion*'
      - '.github/workflows/daystream-notion-direct.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test ios-app/tests/daystream-notion-scriptable.test.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node ios-app/tests/daystream-notion.browser.mjs
        env:
          LIFE_BROWSER: ${{ matrix.browser }}
