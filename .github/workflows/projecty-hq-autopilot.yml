name: '[YOS HQ] ProjectY自動司令部 v1｜毎時監視・安全な自動継続'

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [Codex governance, Taxi iPhone17 Smoke, Taxi Demand Calendar, YOS AI Core, YOSナビ Safety, YOS Service Worker]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Do not write comments, rerun QA, approve QA, or update a branch
        required: false
        type: boolean
        default: true
      event_json:
        description: Optional pull_request_target, issue_comment, or workflow_run payload for dry-run validation
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: projecty-hq-issue-232
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name != 'issue_comment' || github.actor == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Continue the next bounded safe GitHub action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          DISPATCH_EVENT_JSON: ${{ inputs.event_json }}
        run: node .github/scripts/projecty-hq-autopilot.cjs
