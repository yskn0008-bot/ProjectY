name: '[YOS HQ] ProjectY自動司令部 v1｜毎時監視・安全な自動継続'

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [Codex governance, Taxi iPhone17 Smoke, Taxi Demand Calendar, YOS AI Core, YOSナビ Safety, YOS Service Worker]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Do not write comments, rerun QA, approve QA, update a branch, or request YOS decisions
        required: false
        type: boolean
        default: true
      event_json:
        description: Optional pull_request_target, issue_comment, or workflow_run payload for dry-run validation
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: projecty-hq-issue-232
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name != 'issue_comment' || github.actor == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Continue the next bounded safe GitHub action
        id: continue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          DISPATCH_EVENT_JSON: ${{ inputs.event_json }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(node .github/scripts/projecty-hq-autopilot.cjs)"
          printf '%s\n' "$result"
          node - "$result" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(process.argv[2]);
          const recovery = result?.recovery || null;
          fs.appendFileSync(process.argv[3], `needs_yos=${recovery?.action === 'NEEDS_YOS' ? 'true' : 'false'}\n`);
          fs.appendFileSync(process.argv[3], `target=${recovery?.target || ''}\n`);
          NODE

      - name: Ask YOS and continue the same PR safely
        if: steps.continue.outputs.needs_yos == 'true' && inputs.dry_run != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ steps.continue.outputs.target }}
        run: node .github/scripts/projecty-hq-yos-decision.cjs

      - name: Replay one persisted NEEDS_YOS target safely
        if: steps.continue.outputs.needs_yos != 'true' && inputs.dry_run != true && (github.event_name == 'schedule' || github.event_name == 'workflow_run')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/projecty-hq-yos-replay.cjs
