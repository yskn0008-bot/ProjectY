name: Taxi iPhone SE3 Smoke

on:
  pull_request:
    paths:
      - 'taxi/**'
      - '.github/workflows/taxi-se3.yml'
  workflow_dispatch:

concurrency:
  group: taxi-se3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: taxi/tests/package.json

      - name: Install test dependencies
        working-directory: taxi/tests
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        working-directory: taxi/tests
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Taxi SE3 smoke test
        working-directory: taxi/tests
        run: npx playwright test --project=${{ matrix.browser }}-se3

      - name: Upload Taxi SE3 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxi-se3-${{ matrix.browser }}
          path: |
            taxi/test-results/artifacts/
            taxi/test-results/report/
            taxi/test-results/raw/
          if-no-files-found: warn
          retention-days: 14
