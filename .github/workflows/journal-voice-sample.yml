name: JOURNAL free voice sample (VOICEVOX Nemo)
on:
  pull_request:
    paths:
      - 'scripts/journal_voicevox_demo.py'
      - '.github/workflows/journal-voice-sample.yml'
      - 'journal-v2/index.html'
  push:
    branches: [main]
    paths:
      - 'scripts/journal_voicevox_demo.py'
      - '.github/workflows/journal-voice-sample.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal-free-voice-sample
  cancel-in-progress: false

jobs:
  free-voice-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Launch free offline VOICEVOX Nemo engine
        run: |
          docker run -d --rm --name yos-voicevox-nemo -p 127.0.0.1:50121:50121 voicevox/voicevox_nemo_engine:cpu-0.26.0
      - name: Install audio encoder and generate article 0 sample
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 scripts/journal_voicevox_demo.py
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 journal/audio/2026-11-12/article-0.mp3
      - name: Diagnose free Nemo engine on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs --tail 120 yos-voicevox-nemo || true
          curl -sv --max-time 4 http://127.0.0.1:50121/speakers || true
      - name: Upload listening preview
        uses: actions/upload-artifact@v4
        with:
          name: yos-journal-voicevox-nemo-sample
          path: journal/audio/2026-11-12/article-0.mp3
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified MP3 into this review branch (same-repo PR only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          test -s journal/audio/2026-11-12/article-0.mp3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The PR checkout may contain synthetic merge commits from GitHub.
          # Start at the latest actual branch and bring only the new MP3 across.
          git fetch origin "$PR_BRANCH"
          git switch --detach "origin/$PR_BRANCH"
          git add journal/audio/2026-11-12/article-0.mp3
          if git diff --cached --quiet; then
            echo "Audio already in review branch"
            exit 0
          fi
          git commit -m 'journal: include verified free Nemo audio preview'
          git push origin "HEAD:refs/heads/$PR_BRANCH"
      - name: Publish verified preview MP3 to existing Pages (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add journal/audio/2026-11-12/article-0.mp3
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'journal: publish free Nemo narration sample'
          git push origin HEAD:main
