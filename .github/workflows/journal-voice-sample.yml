name: JOURNAL free voice sample (VOICEVOX Nemo)
on:
  pull_request:
    paths:
      - 'scripts/journal_voicevox_demo.py'
      - '.github/workflows/journal-voice-sample.yml'
      - 'journal-v2/index.html'
  push:
    branches: [main]
    paths:
      - 'scripts/journal_voicevox_demo.py'
      - '.github/workflows/journal-voice-sample.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal-free-voice-sample
  cancel-in-progress: false

jobs:
  free-voice-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Launch free offline VOICEVOX Nemo engine
        run: |
          docker run -d --rm --name yos-voicevox-nemo -p 127.0.0.1:50121:50021 voicevox/voicevox_nemo_engine:cpu-0.26.0
      - name: Install audio encoder and generate article 0 sample
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 scripts/journal_voicevox_demo.py
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 journal/audio/2026-11-12/article-0.mp3
      - name: Upload listening preview
        uses: actions/upload-artifact@v4
        with:
          name: yos-journal-voicevox-nemo-sample
          path: journal/audio/2026-11-12/article-0.mp3
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified preview MP3 to existing Pages (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add journal/audio/2026-11-12/article-0.mp3
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'journal: publish free Nemo narration sample'
          git push origin HEAD:main
