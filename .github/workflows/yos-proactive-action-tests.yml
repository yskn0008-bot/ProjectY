name: YOS proactive action tests

on:
  pull_request:
    paths:
      - 'yos/alerts/proactive-*'
      - '.github/workflows/yos-proactive-action-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test proactive action and widget preview
        run: node --test yos/alerts/proactive-*.test.mjs
