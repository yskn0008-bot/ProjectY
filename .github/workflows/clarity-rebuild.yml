name: Clarity Rebuild

on:
  pull_request:
    paths:
      - 'tools/clarity-rebuild/**'
      - '.github/workflows/clarity-rebuild.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri
          cherri --version

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          cd tools/clarity-rebuild
          rm -f './Clarity Rebuild_unsigned.shortcut' './Clarity Rebuild.plist'
          cherri './Clarity Rebuild.cherri' --skip-sign --debug
          test -f './Clarity Rebuild_unsigned.shortcut'
          python3 patch_notion_intake.py './Clarity Rebuild_unsigned.shortcut'
          mkdir -p artifacts
          cp './Clarity Rebuild_unsigned.shortcut' artifacts/Clarity-Rebuild-unsigned.shortcut

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p=Path('tools/clarity-rebuild/artifacts/Clarity-Rebuild-unsigned.shortcut')
          root=plistlib.loads(p.read_bytes())
          actions=root.get('WFWorkflowActions',[])
          ids=[a.get('WFWorkflowActionIdentifier','') for a in actions]
          blob=repr(root)
          assert sum(i=='is.workflow.actions.askllm' for i in ids)==1
          assert any(i.endswith('runworkflow') for i in ids)
          assert 'YOS_OpenApp' in blob
          assert 'NEXT_MONEY' not in blob
          assert 'money-capture.html' not in blob
          assert 'scriptable:///run?scriptName=%E7%85%A7%E6%98%8E' in blob
          assert 'scriptable:///run?scriptName=%E3%82%A8%E3%82%A2%E3%82%B3%E3%83%B3' in blob
          assert 'scriptable:///run?scriptName=%E3%83%86%E3%83%AC%E3%83%93' in blob
          assert 'https://project-y-yos-ai.vercel.app/api/yos/intake' in blob
          assert 'Clarity接続トークン' in blob
          assert 'notionCaptureResponse' in blob
          assert any(i.endswith('setbrightness') for i in ids)
          assert any(i.endswith('setvolume') for i in ids)
          assert root.get('WFWorkflowHasShortcutInputVariables') is True
          print('Clarity Rebuild structure: PASS')
          PY

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE --exclude='*.shortcut' '(gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|BEGIN [A-Z ]*PRIVATE KEY|192\.168\.[0-9]+\.[0-9]+)' tools/clarity-rebuild; then
            echo 'Potential secret/private network value found.' >&2
            exit 1
          fi

      - name: Sign
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py             --input tools/clarity-rebuild/artifacts/Clarity-Rebuild-unsigned.shortcut             --output tools/clarity-rebuild/artifacts/Clarity-Rebuild-signed.shortcut             --name 'Clarity Rebuild'             2>&1 | tee tools/clarity-rebuild/artifacts/hubsign.log

      - name: Verify signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/clarity-rebuild/artifacts/Clarity-Rebuild-signed.shortcut')
          data=p.read_bytes()
          assert data.startswith(b'AEA1'), data[:8]
          assert len(data)>500, len(data)
          print(f'Clarity Rebuild signed: AEA1 PASS ({len(data)} bytes)')
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: clarity-rebuild
          path: |
            tools/clarity-rebuild/artifacts/Clarity-Rebuild-unsigned.shortcut
            tools/clarity-rebuild/artifacts/Clarity-Rebuild-signed.shortcut
            tools/clarity-rebuild/artifacts/hubsign.log
