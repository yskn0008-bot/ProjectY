name: Issue 245 patch transport

on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  contents: write
  issues: read

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'codex/issue-245-taxi-calendar-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/issue-245-taxi-calendar-ui
          fetch-depth: 0
      - name: Recover and verify exact Codex patch from Issue 245
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/issues/comments/5232851877 --jq .body > /tmp/comment.md
          python - <<'PY'
          import re, pathlib
          body=pathlib.Path('/tmp/comment.md').read_text()
          chunks=re.findall(r'#### CHUNK \d+/\d+\s*\n\n```text\n([A-Za-z0-9+/=\n]+)\n```',body)
          if len(chunks)!=3:
              raise SystemExit(f'expected 3 chunks, got {len(chunks)}')
          pathlib.Path('/tmp/patch.b64').write_text(''.join(''.join(c.split()) for c in chunks))
          PY
          base64 -d /tmp/patch.b64 | gzip -d > /tmp/issue-245.patch
          test "$(wc -c < /tmp/issue-245.patch | tr -d ' ')" = "10838"
          test "$(sha256sum /tmp/issue-245.patch | awk '{print $1}')" = "5f45c049fc9cc5c57c775e474cc22ffae44bd22ea15fcdfa0046087862a76e06"
          git apply --check /tmp/issue-245.patch
          test "$(grep '^diff --git ' /tmp/issue-245.patch | sed -E 's#diff --git a/([^ ]+) b/.*#\1#' | sort | paste -sd ',' -)" = "taxi/final-app-v131.css,taxi/final-app-v131.js"
          git apply /tmp/issue-245.patch
          node --check taxi/final-app-v131.js
          git diff --check
          rm -f .github/workflows/issue-245-patch-transport.yml
          git add taxi/final-app-v131.css taxi/final-app-v131.js .github/workflows/issue-245-patch-transport.yml
          test "$(git diff --cached --name-only | sort | paste -sd ',' -)" = ".github/workflows/issue-245-patch-transport.yml,taxi/final-app-v131.css,taxi/final-app-v131.js"
      - name: Commit exact Level 1 patch to existing branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Taxi｜カレンダーUIをLevel 1差分で圧縮"
          git push origin HEAD:codex/issue-245-taxi-calendar-ui
