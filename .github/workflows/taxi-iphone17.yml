name: Taxi iPhone17 Smoke

on:
  pull_request:
    paths:
      - 'taxi/**'
      - '.github/workflows/taxi-iphone17.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transport-codex-p0:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'codex/issue-238-shift-button-clip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-238-shift-button-clip
          fetch-depth: 0
      - name: Apply exact Codex final patch
        shell: bash
        run: |
          set -euo pipefail
          expected_files="$(printf '%s\n' taxi/final-app-v131.css taxi/final-app-v131.js taxi/index.html taxi/service-worker.js taxi/tests/iphone17.spec.mjs taxi/tests/shift-start-gate.test.mjs)"
          git fetch origin main
          git checkout origin/main -- taxi/final-app-v131.css taxi/final-app-v131.js taxi/index.html taxi/service-worker.js taxi/tests/iphone17.spec.mjs
          rm -f taxi/tests/shift-start-gate.test.mjs
          cat > /tmp/p.b64 <<'PATCH_B64'
          
          PATCH_B64
          sed -i 's/^          //' /tmp/p.b64
          base64 -d /tmp/p.b64 | gzip -d > /tmp/p.patch
          echo 'd7bd807f858533d8f58bc5c6af1672048604373232e705d4ac1c849c6502094e  /tmp/p.patch' | sha256sum -c -
          test "$(wc -c < /tmp/p.patch)" -eq 29625
          test "$(git apply --numstat /tmp/p.patch | awk '{print $3}')" = "$expected_files"
          git apply --check /tmp/p.patch
          git apply /tmp/p.patch
          node --test taxi/tests/*.test.mjs
          git diff --check
          git checkout origin/main -- .github/workflows/taxi-iphone17.yml
          rm -f .github/workflows/taxi-p0-fix-transport.yml
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only origin/main)" = "$expected_files"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(taxi): contain and initialize shift proxy'
          git push origin HEAD:codex/issue-238-shift-button-clip
