name: Clarity Next v0

on:
  pull_request:
    paths:
      - 'tools/clarity-next/**'
      - '.github/workflows/clarity-next.yml'
  push:
    branches: [main]
    paths:
      - 'tools/clarity-next/**'
      - '.github/workflows/clarity-next.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/clarity-next/tests -v

      - name: Install pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri
          cherri --version

      - name: Compile Clarity Next
        shell: bash
        run: |
          set -euo pipefail
          cd tools/clarity-next
          rm -f './Clarity Next_unsigned.shortcut' './Clarity Next.plist'
          rm -f './Clarity Text_unsigned.shortcut' './Clarity Text.plist'
          rm -f './Clarity Share v4_unsigned.shortcut' './Clarity Share v4.plist'
          cherri './Clarity Next.cherri' --skip-sign --debug
          cherri './Clarity Text.cherri' --skip-sign --debug
          cherri './Clarity Share.cherri' --skip-sign --debug
          test -f './Clarity Next_unsigned.shortcut'
          test -f './Clarity Text_unsigned.shortcut'
          test -f './Clarity Share v4_unsigned.shortcut'
          python3 patch_voice_entry_fallback.py './Clarity Next_unsigned.shortcut'
          python3 patch_calendar_reminder_wire_format.py './Clarity Next_unsigned.shortcut'
          mkdir -p artifacts
          cp './Clarity Next_unsigned.shortcut' artifacts/Clarity-Next-unsigned.shortcut
          cp './Clarity Text_unsigned.shortcut' artifacts/Clarity-Text-unsigned.shortcut
          cp './Clarity Share v4_unsigned.shortcut' artifacts/Clarity-Share-v4-unsigned.shortcut

      - name: Compile existing fixed YOS_Home child
        shell: bash
        run: |
          set -euo pipefail
          cd tools/clarity-next
          rm -f './YOS_Home_unsigned.shortcut'
          cherri './YOS_Home.cherri' --skip-sign --debug
          test -f './YOS_Home_unsigned.shortcut'
          python3 patch_home_inline.py './YOS_Home_unsigned.shortcut' './YOS Home Bridge.js'
          cp './YOS_Home_unsigned.shortcut' artifacts/YOS_Home-unsigned.shortcut

      - name: Inspect runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p=Path('tools/clarity-next/artifacts/Clarity-Next-unsigned.shortcut')
          root=plistlib.loads(p.read_bytes())
          actions=root['WFWorkflowActions']
          ids=[a.get('WFWorkflowActionIdentifier','') for a in actions]
          blob=repr(root)
          assert sum(i=='is.workflow.actions.dictatetext' for i in ids)==1, ids
          assert sum(i=='is.workflow.actions.askllm' for i in ids)==1, ids
          ask=next(a for a in actions if a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.askllm')
          assert ask.get('WFWorkflowActionParameters',{}).get('FollowUp') is True, ask
          assert root.get('WFWorkflowHasShortcutInputVariables') is True
          direct_shortcut_input_conditions=[]
          for a in actions:
              if a.get('WFWorkflowActionIdentifier')!='is.workflow.actions.conditional':
                  continue
              p=a.get('WFWorkflowActionParameters',{})
              if p.get('WFControlFlowMode')!=0:
                  continue
              inp=repr(p.get('WFInput'))
              if 'ExtensionInput' in inp and 'ShortcutInput' in inp:
                  direct_shortcut_input_conditions.append(p.get('WFCondition'))
          assert 100 in direct_shortcut_input_conditions, direct_shortcut_input_conditions
          assert 101 in direct_shortcut_input_conditions, direct_shortcut_input_conditions
          core_inputs=set(root.get('WFWorkflowInputContentItemClasses') or [])
          assert 'WFStringContentItem' in core_inputs, core_inputs
          assert len(core_inputs) >= 20, core_inputs
          assert '__YOS_CLARITY_TEXT_V1__' in blob
          assert '__YOS_CLARITY_SHARE_TEXT_V1__' in blob
          assert 'input_mode=share' in blob
          assert any(i.endswith('runworkflow') for i in ids), ids
          assert 'YOS_OpenApp' in blob
          assert 'NEXT_DEVICE' in blob
          assert 'NEXT_TIMER' in blob
          assert 'NEXT_CALENDAR' in blob
          assert 'NEXT_REMINDER' in blob
          assert 'NEXT_NOTION' in blob
          assert 'NEXT_MYWAY' in blob
          assert 'NEXT_IDEA' in blob
          assert 'NEXT_MEMO' in blob
          assert 'NEXT_TASK' in blob
          assert 'NEXT_SHOPPING' in blob
          for marker in (
              'NEXT_ALARM','NEXT_COMMUNICATION','NEXT_MEDIA','NEXT_CLIPBOARD',
              'NEXT_SHARE','NEXT_CAMERA','NEXT_WEBSEARCH','NEXT_YOS_VIEW','NEXT_REMOTE',
              'YOS_SHORTCUT','YOS_SCRIPTABLE'
          ):
              assert marker in blob, marker
          assert ids.count('com.apple.mobiletimer-framework.MobileTimerIntents.MTCreateAlarmIntent') == 1, ids
          assert ids.count('com.apple.mobilephone.call') == 1, ids
          assert ids.count('is.workflow.actions.sendmessage') == 1, ids
          assert ids.count('is.workflow.actions.sendemail') == 1, ids
          assert ids.count('is.workflow.actions.setclipboard') == 1, ids
          assert ids.count('is.workflow.actions.getclipboard') == 1, ids
          assert ids.count('is.workflow.actions.share') == 1, ids
          assert ids.count('is.workflow.actions.takephoto') == 1, ids
          assert ids.count('is.workflow.actions.takescreenshot') == 1, ids
          assert ids.count('is.workflow.actions.searchweb') == 1, ids
          assert ids.count('is.workflow.actions.pausemusic') == 3, ids
          assert ids.count('is.workflow.actions.skipforward') == 1, ids
          assert ids.count('is.workflow.actions.skipback') == 1, ids
          assert ids.count('is.workflow.actions.runworkflow') == 3, ids
          message=next(a for a in actions if a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.sendmessage')
          assert message.get('WFWorkflowActionParameters',{}).get('ShowWhenRun') is False, message
          email=next(a for a in actions if a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.sendemail')
          assert email.get('WFWorkflowActionParameters',{}).get('WFSendEmailActionShowComposeSheet') is False, email
          assert 'scriptable:///run?scriptName=YOS%20BRAVIA%20Widget&action=' in blob
          assert 'scriptable:///run?scriptName=YOS%20Light%20Widget&action=' in blob
          assert 'scriptable:///run?scriptName=YOS%20AC%20Widget&action=' in blob
          assert 'Morning Flow' in blob
          assert 'STASH Add' in blob
          assert 'YOS_Home' in blob
          assert 'YOS Remote Hub' in blob
          assert 'YOS Departure Guard2' in blob
          assert 'YOS_Money_Local' in blob
          for url in (
              'https://yskn0008-bot.github.io/ProjectY/life/',
              'https://yskn0008-bot.github.io/ProjectY/yos/hj/',
              'https://yskn0008-bot.github.io/ProjectY/yos/desk/',
              'https://yskn0008-bot.github.io/ProjectY/system/',
          ):
              assert url in blob, url
          assert 'scriptable:///run?scriptName=YOS%20Dashboard%20v2&action=baseHome' in blob
          assert 'この操作はClarity Next v0では未対応です' in blob
          # Normal voice/text/share requests must not touch the old debug Ledger.
          # File access remains only for explicit capture destinations such as Idea/Memo.
          assert 'Clarity Next Ledger.txt' not in blob
          assert any(i.endswith('file.append') for i in ids), ids
          assert 'Idea in Box.txt' in blob
          assert 'Clarity Inbox.txt' in blob
          assert any(i.endswith('setbrightness') for i in ids), ids
          assert any(i.endswith('setvolume') for i in ids), ids
          assert any(i.endswith('timer.start') for i in ids), ids
          assert any(i.endswith('addnewevent') for i in ids), ids
          assert any(i.endswith('addnewreminder') for i in ids), ids
          calendars=[
              a.get('WFWorkflowActionParameters',{})
              for a in actions
              if a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.addnewevent'
          ]
          assert len(calendars)==1, calendars
          assert calendars[0].get('WFCalendarItemDates') is True
          assert calendars[0].get('WFCalendarItemStartDate',{}).get('WFSerializationType')=='WFTextTokenString'
          assert calendars[0].get('WFCalendarItemEndDate',{}).get('WFSerializationType')=='WFTextTokenString'
          reminders=[
              a.get('WFWorkflowActionParameters',{})
              for a in actions
              if a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.addnewreminder'
              and 'WFAlertCustomTime' in a.get('WFWorkflowActionParameters',{})
          ]
          assert len(reminders)==1, reminders
          assert reminders[0].get('WFAlertEnabled')=='Alert'
          assert reminders[0].get('WFAlertCustomTime',{}).get('WFSerializationType')=='WFTextTokenString'
          child=plistlib.loads(Path('tools/clarity-next/artifacts/YOS_Home-unsigned.shortcut').read_bytes())
          inline=[a for a in child.get('WFWorkflowActions',[]) if a.get('WFWorkflowActionIdentifier')=='dk.simonbs.Scriptable.RunScriptInlineIntent']
          assert len(inline)==1, inline
          params=inline[0].get('WFWorkflowActionParameters',{})
          assert params.get('runInApp') is False, params
          script=params.get('script',{})
          assert script.get('WFSerializationType')=='WFTextTokenString', script
          bridge=script.get('Value',{}).get('string','')
          assert 'parseHomeCommand' in bridge and 'YOS Home Bridge' in bridge
          assert '__YOS_HOME_INLINE__' not in bridge
          print('YOS_Home child runtime contract: PASS')
          print('Clarity Next runtime contract: PASS')
          PY

      - name: Inspect thin entry wrappers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          base=Path('tools/clarity-next/artifacts')
          text_root=plistlib.loads((base/'Clarity-Text-unsigned.shortcut').read_bytes())
          share_root=plistlib.loads((base/'Clarity-Share-v4-unsigned.shortcut').read_bytes())
          for root in (text_root, share_root):
              ids=[a.get('WFWorkflowActionIdentifier','') for a in root.get('WFWorkflowActions',[])]
              blob=repr(root)
              assert not any(i=='is.workflow.actions.askllm' for i in ids), ids
              assert 'Clarity Next' in blob
              assert any(i.endswith('runworkflow') for i in ids), ids
          share_ids=[a.get('WFWorkflowActionIdentifier','') for a in share_root.get('WFWorkflowActions',[])]
          share_blob=repr(share_root)
          assert 'ActionExtension' in set(share_root.get('WFWorkflowTypes') or [])
          assert share_root.get('WFWorkflowHasShortcutInputVariables') is True
          share_inputs=set(share_root.get('WFWorkflowInputContentItemClasses') or [])
          required_share_inputs={
              'WFStringContentItem',
              'WFRichTextContentItem',
              'WFSafariWebPageContentItem',
              'WFURLContentItem',
              'WFImageContentItem',
              'WFPDFContentItem',
              'WFGenericFileContentItem',
          }
          assert required_share_inputs.issubset(share_inputs), share_inputs
          assert len(share_inputs) >= 20, share_inputs
          assert any('extracttextfromimage' in i for i in share_ids), share_ids
          assert '__YOS_CLARITY_SHARE_TEXT_V1__' in share_blob
          assert '__YOS_CLARITY_SHARE_IMAGE_V1__' in share_blob
          assert '__YOS_CLARITY_SHARE_PDF_V1__' in share_blob
          print('Clarity thin entry wrappers: PASS')
          PY

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE --exclude='*.shortcut' '(gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|BEGIN [A-Z ]*PRIVATE KEY|192\.168\.[0-9]+\.[0-9]+)' tools/clarity-next; then
            echo 'Potential secret/private network value found.' >&2
            exit 1
          fi

      - name: Sign
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input tools/clarity-next/artifacts/Clarity-Next-unsigned.shortcut \
            --output tools/clarity-next/artifacts/Clarity-Next-signed.shortcut \
            --name 'Clarity Next' \
            2>&1 | tee tools/clarity-next/artifacts/hubsign.log
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input tools/clarity-next/artifacts/Clarity-Text-unsigned.shortcut \
            --output tools/clarity-next/artifacts/Clarity-Text-signed.shortcut \
            --name 'Clarity Text' \
            2>&1 | tee tools/clarity-next/artifacts/clarity-text-hubsign.log
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input tools/clarity-next/artifacts/Clarity-Share-v4-unsigned.shortcut \
            --output tools/clarity-next/artifacts/Clarity-Share-v4-signed.shortcut \
            --name 'Clarity Share v4' \
            2>&1 | tee tools/clarity-next/artifacts/clarity-share-hubsign.log

          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input tools/clarity-next/artifacts/YOS_Home-unsigned.shortcut \
            --output tools/clarity-next/artifacts/YOS_Home-signed.shortcut \
            --name 'YOS_Home' \
            2>&1 | tee tools/clarity-next/artifacts/yos-home-hubsign.log

      - name: Verify signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('Clarity-Next-signed.shortcut','Clarity-Text-signed.shortcut','Clarity-Share-v4-signed.shortcut','YOS_Home-signed.shortcut'):
              p=Path('tools/clarity-next/artifacts')/name
              data=p.read_bytes()
              assert data.startswith(b'AEA1'), (name,data[:8])
              assert len(data)>500, (name,len(data))
              print(f'{name}: AEA1 PASS ({len(data)} bytes)')
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: clarity-next-v0
          path: |
            tools/clarity-next/artifacts/YOS_Home-unsigned.shortcut
            tools/clarity-next/artifacts/YOS_Home-signed.shortcut
            tools/clarity-next/artifacts/yos-home-hubsign.log
            tools/clarity-next/artifacts/Clarity-Next-unsigned.shortcut
            tools/clarity-next/artifacts/Clarity-Next-signed.shortcut
            tools/clarity-next/artifacts/Clarity-Text-unsigned.shortcut
            tools/clarity-next/artifacts/Clarity-Text-signed.shortcut
            tools/clarity-next/artifacts/Clarity-Share-v4-unsigned.shortcut
            tools/clarity-next/artifacts/Clarity-Share-v4-signed.shortcut
            tools/clarity-next/artifacts/hubsign.log
            tools/clarity-next/artifacts/clarity-text-hubsign.log
            tools/clarity-next/artifacts/clarity-share-hubsign.log
          if-no-files-found: error
