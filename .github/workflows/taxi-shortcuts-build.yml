name: Taxi native Shortcuts build

on:
  pull_request:
    paths:
      - 'taxi/ui-v2.html'
      - 'taxi/tests/iphone17.spec.mjs'
      - 'tools/taxi-shortcuts/**'
      - '.github/workflows/taxi-shortcuts-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-shortcuts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check fixed URLs, no duplicate ledger and native source code
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/taxi-shortcuts/test_source.py
          if grep -REi '(gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|BEGIN [A-Z ]*PRIVATE KEY)' tools/taxi-shortcuts; then
            echo 'Found possible secret in Shortcut source' >&2; exit 1
          fi
      - name: Install pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          test -n "$binary"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri
          cherri --version
      - name: Compile native Shortcuts
        shell: bash
        run: |
          set -euo pipefail
          cd tools/taxi-shortcuts
          cherri 'YOS TAXI 運行.cherri' --skip-sign --debug
          cherri 'YOS TAXI 降車.cherri' --skip-sign --debug
          # Reuse the existing iPhone-proven Clarity persistence patch; no Mac-only Get Parent action.
          python3 ../clarity-factory/patch_append_file_paths.py 'YOS TAXI 降車_unsigned.shortcut'
          test -f 'YOS TAXI 運行_unsigned.shortcut'
          test -f 'YOS TAXI 降車_unsigned.shortcut'
          python3 validate_compiled.py 'YOS TAXI 運行_unsigned.shortcut' 'YOS TAXI 降車_unsigned.shortcut'
      - name: Sign credential-free Shortcuts via existing HubSign procedure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/taxi-shortcuts/artifacts
          python3 tools/clarity-factory/sign_with_hubsign.py --input 'tools/taxi-shortcuts/YOS TAXI 運行_unsigned.shortcut' --output 'tools/taxi-shortcuts/artifacts/YOS TAXI 運行.shortcut' --name 'YOS TAXI 運行'
          python3 tools/clarity-factory/sign_with_hubsign.py --input 'tools/taxi-shortcuts/YOS TAXI 降車_unsigned.shortcut' --output 'tools/taxi-shortcuts/artifacts/YOS TAXI 降車.shortcut' --name 'YOS TAXI 降車'
          python3 - <<'PY'
          from pathlib import Path
          for name in ('YOS TAXI 運行.shortcut','YOS TAXI 降車.shortcut'):
              data = (Path('tools/taxi-shortcuts/artifacts')/name).read_bytes()
              assert data.startswith(b'AEA1') and len(data)>500, f'not a valid signed file: {name}'
              print(name, 'signed AEA1',len(data))
          PY
      - name: Upload iPhone installable pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YOS-TAXI-Shift-Shortcuts
          path: |
            tools/taxi-shortcuts/artifacts/*.shortcut
            tools/taxi-shortcuts/*_unsigned.shortcut
            tools/taxi-shortcuts/README.md
          if-no-files-found: warn
