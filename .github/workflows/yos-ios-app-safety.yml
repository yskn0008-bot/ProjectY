name: YOS iOS App Safety

on:
  push:
    branches: [main]
    paths:
      - 'ios-app/**'
      - 'yos/**'
      - 'life/**'
      - 'data/yos-assets.json'
      - 'data/yos-user-tasks.json'
      - '.github/workflows/yos-ios-app-safety.yml'
  pull_request:
    paths:
      - 'ios-app/**'
      - 'yos/**'
      - 'life/**'
      - 'data/yos-assets.json'
      - 'data/yos-user-tasks.json'
      - '.github/workflows/yos-ios-app-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yos-ios-app-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: App contract and bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run app contracts
        run: npm test
      - name: Prepare bundled web assets
        run: npm run prepare:web
      - name: Verify offline app bundle
        run: |
          test -f www/index.html
          test -f www/system.html
          test -f www/yos/index.html
          test -f www/yos/app.js
          test -f www/life/index.html
          test -f www/capture.html
          test -f www/bravia.html
          grep -q "MY WAY" www/yos/index.html
          grep -q "native-yos-boot" www/index.html

  native-simulator:
    name: Native iOS simulator build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Capacitor iOS project
        run: npm run native:init
      - name: Build without signing
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify packaged native app opens MY WAY
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/public/index.html"
          test -f "$APP_PATH/public/yos/index.html"
          test -f "$APP_PATH/public/life/index.html"
          test -f "$APP_PATH/public/system.html"
          grep -q "native-yos-boot" "$APP_PATH/public/index.html"
          grep -q "location.replace('./yos/')" "$APP_PATH/public/index.html"
          grep -q 'id="brandTitle">MY WAY' "$APP_PATH/public/yos/index.html"
          grep -q 'data-native-only hidden href="../system.html"' "$APP_PATH/public/yos/index.html"
          mkdir -p build/evidence
          printf 'bundle_id=jp.yos.onlysystem\nentry=MY WAY\npackaged_app=%s\n' "$APP_PATH" > build/evidence/native-package-check.txt
      - name: Upload native package evidence
        uses: actions/upload-artifact@v4
        with:
          name: yos-ios-native-package
          path: ios-app/build/evidence/
          if-no-files-found: error