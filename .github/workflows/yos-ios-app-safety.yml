name: YOS iOS App Safety

on:
  push:
    branches: [main]
    paths:
      - 'ios-app/**'
      - 'yos/**'
      - 'life/**'
      - 'data/yos-assets.json'
      - 'data/yos-user-tasks.json'
      - '.github/workflows/yos-ios-app-safety.yml'
  pull_request:
    paths:
      - 'ios-app/**'
      - 'yos/**'
      - 'life/**'
      - 'data/yos-assets.json'
      - 'data/yos-user-tasks.json'
      - '.github/workflows/yos-ios-app-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yos-ios-app-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: App contract and bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run app contracts
        run: npm test
      - name: Prepare bundled web assets
        run: npm run prepare:web
      - name: Verify offline app bundle
        run: |
          test -f www/index.html
          test -f www/system.html
          test -f www/yos/index.html
          test -f www/yos/app.js
          test -f www/life/index.html
          test -f www/capture.html
          test -f www/bravia.html
          grep -q "MY WAY" www/yos/index.html
          grep -q "native-yos-boot" www/index.html

  native-simulator:
    name: Native iOS simulator build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Capacitor iOS project
        run: npm run native:init
      - name: Build without signing
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Launch YOS in iPhone simulator
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          UDID="$(python3 - <<'PY'
          import json, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))
          for runtime, devices in data.get('devices',{}).items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable', True) and device.get('name','').startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone simulator')
          PY
          )"
          APP_PATH="$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          STATE=""
          for _ in $(seq 1 45); do
            STATE="$(UDID="$UDID" python3 - <<'PY'
          import json, os, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','--json']))
          udid=os.environ['UDID']
          for devices in data.get('devices',{}).values():
              for device in devices:
                  if device.get('udid') == udid:
                      print(device.get('state',''))
                      raise SystemExit(0)
          PY
          )"
            [ "$STATE" = "Booted" ] && break
            sleep 2
          done
          test "$STATE" = "Booted"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" jp.yos.onlysystem
          sleep 6
          mkdir -p build/evidence
          xcrun simctl io "$UDID" screenshot build/evidence/yos-my-way.png
          echo "$UDID" > build/evidence/simulator-udid.txt
      - name: Verify MY WAY is the native launch screen
        run: |
          cat > /tmp/verify-yos-screen.swift <<'SWIFT'
          import AppKit
          import Foundation
          import Vision

          let path = CommandLine.arguments[1]
          guard let image = NSImage(contentsOfFile: path),
                let cgImage = image.cgImage(forProposedRect: nil, context: nil, hints: nil) else {
            fputs("Could not load simulator screenshot\n", stderr)
            exit(2)
          }

          var recognized = [String]()
          let request = VNRecognizeTextRequest { request, error in
            if let error {
              fputs("Vision OCR failed: \(error)\n", stderr)
              return
            }
            for observation in request.results as? [VNRecognizedTextObservation] ?? [] {
              if let candidate = observation.topCandidates(1).first {
                recognized.append(candidate.string)
              }
            }
          }
          request.recognitionLevel = .accurate
          request.recognitionLanguages = ["en-US", "ja-JP"]
          try VNImageRequestHandler(cgImage: cgImage, options: [:]).perform([request])
          let text = recognized.joined(separator: "\n")
          print(text)
          guard text.contains("MY WAY") else {
            fputs("Native YOS did not open on MY WAY\n", stderr)
            exit(3)
          }
          SWIFT
          swift /tmp/verify-yos-screen.swift build/evidence/yos-my-way.png
      - name: Upload native launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yos-ios-native-launch
          path: ios-app/build/evidence/
          if-no-files-found: warn
