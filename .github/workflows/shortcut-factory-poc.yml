name: Shortcut Factory PoC

on:
  push:
    branches:
      - poc/shortcut-factory-signing
    paths:
      - 'tools/shortcut-factory-poc/**'
      - '.github/workflows/shortcut-factory-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-sign:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate unsigned Safari shortcut
        run: |
          mkdir -p build
          python3 tools/shortcut-factory-poc/generate_safari_shortcut.py \
            --output build/YOS-PoC-Safari.shortcut \
            --name 'YOS PoC - Safari'

      - name: Validate plist structure
        run: |
          python3 tools/shortcut-factory-poc/generate_safari_shortcut.py \
            --output build/YOS-PoC-Safari.shortcut \
            --validate-only
          plutil -lint build/YOS-PoC-Safari.shortcut
          file build/YOS-PoC-Safari.shortcut
          xxd -l 8 build/YOS-PoC-Safari.shortcut

      - name: Confirm Apple Shortcuts CLI
        run: |
          which shortcuts
          shortcuts sign --help

      - name: Sign with Apple shortcuts CLI
        shell: bash
        run: |
          set +e
          set -o pipefail
          shortcuts sign \
            --mode anyone \
            --input build/YOS-PoC-Safari.shortcut \
            --output build/YOS-PoC-Safari-signed.shortcut \
            2>&1 | tee build/sign.log
          status=${PIPESTATUS[0]}
          echo "shortcuts sign exit code: ${status}" | tee -a build/sign.log
          if [[ -f build/YOS-PoC-Safari-signed.shortcut ]]; then
            echo "Signed output created:" | tee -a build/sign.log
            ls -lh build/YOS-PoC-Safari-signed.shortcut | tee -a build/sign.log
            xxd -l 16 build/YOS-PoC-Safari-signed.shortcut | tee -a build/sign.log
          fi
          exit "${status}"

      - name: Upload PoC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yos-shortcut-factory-poc
          path: |
            build/*.shortcut
            build/sign.log
          if-no-files-found: error
          retention-days: 7
