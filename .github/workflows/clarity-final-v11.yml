name: Clarity Final V11 deterministic DeviceSetting

on:
  pull_request:
    paths:
      - 'tools/clarity-factory/clarity-final-v11.cherri'
      - 'tools/clarity-factory/clarity-actions-v11a.cherri'
      - 'tools/clarity-factory/patch_append_file_paths.py'
      - '.github/workflows/clarity-final-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sign-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri

      - name: Compile and inspect V11
        shell: bash
        run: |
          set -euo pipefail
          cd tools/clarity-factory
          cherri clarity-final-v11.cherri --skip-sign --debug
          cherri clarity-actions-v11a.cherri --skip-sign --debug
          parent='./ClarityFinalV11_unsigned.shortcut'
          child='./ClarityActionsV11A_unsigned.shortcut'
          test -f "$parent"
          test -f "$child"

          python3 patch_append_file_paths.py "$parent"
          python3 patch_append_file_paths.py "$child"
          python3 patch_reminder_wire_format.py "$child"
          python3 patch_execute_actions_readback.py "$child"
          python3 validate_clarity_execute_actions.py "$child"

          python3 - "$parent" "$child" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as fh:
              parent=plistlib.load(fh)
          with open(sys.argv[2], 'rb') as fh:
              child=plistlib.load(fh)
          actions=parent.get('WFWorkflowActions',[])
          pblob=repr(parent)
          cblob=repr(child)
          llm=[a for a in actions if a.get('WFWorkflowActionIdentifier')=='is.workflow.actions.askllm']
          assert len(llm)==1
          p=llm[0].get('WFWorkflowActionParameters',{})
          assert p.get('WFLLMModel')=='ChatGPT'
          assert p.get('WFGenerativeResultType')=='Text'
          assert 'ClarityActionsV11A' in pblob
          assert 'ClarityFinalV11' in pblob
          assert 'routerLowRisk' in pblob
          assert 'DeviceSetting' in pblob and 'OpenApp' in pblob and 'MyWay' in pblob
          assert 'needsReview' in cblob
          assert 'UNSUPPORTED_DEVICE_SETTING' in cblob
          assert 'UNSUPPORTED_APP' in cblob
          assert 'UNSUPPORTED_MYWAY_TARGET' in cblob
          print('Clarity Final V11 deterministic router/executor contract: PASS')
          PY
          mkdir -p artifacts-v11
          cp "$parent" artifacts-v11/ClarityFinalV11.shortcut
          cp "$child" artifacts-v11/ClarityActionsV11A.shortcut

      - name: Sign V11
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input tools/clarity-factory/artifacts-v11/ClarityActionsV11A.shortcut \
            --output tools/clarity-factory/artifacts-v11/ClarityActionsV11A-signed.shortcut \
            --name 'ClarityActionsV11A' \
            --timeout 180
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input tools/clarity-factory/artifacts-v11/ClarityFinalV11.shortcut \
            --output tools/clarity-factory/artifacts-v11/ClarityFinalV11-signed.shortcut \
            --name 'ClarityFinalV11' \
            --timeout 180

      - name: Verify AEA1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base=Path('tools/clarity-factory/artifacts-v11')
          for name in ('ClarityActionsV11A-signed.shortcut','ClarityFinalV11-signed.shortcut'):
              p=base/name
              data=p.read_bytes()
              assert data.startswith(b'AEA1')
              assert len(data)>500
              print(p.name, len(data))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: clarity-final-v11
          path: |
            tools/clarity-factory/artifacts-v11/ClarityActionsV11A-signed.shortcut
            tools/clarity-factory/artifacts-v11/ClarityFinalV11-signed.shortcut
          if-no-files-found: error
