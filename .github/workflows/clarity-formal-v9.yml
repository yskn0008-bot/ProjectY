name: Clarity Formal V9 iOS27 JSON-text

on:
  pull_request:
    paths:
      - 'tools/clarity-factory/clarity-formal-v9.cherri'
      - 'tools/clarity-factory/patch_append_file_paths.py'
      - '.github/workflows/clarity-formal-v9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sign-v9:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Cherri v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip'
          expected='7ab2c384b7b26e7c72a30a8dfa56f89dae12c4068b7951bc1e3193f3698edbe9'
          curl -fsSL "$url" -o /tmp/cherri.zip
          printf '%s  %s\n' "$expected" /tmp/cherri.zip | sha256sum -c -
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          binary="$(find /tmp/cherri -type f -name cherri -print -quit)"
          sudo install -m 0755 "$binary" /usr/local/bin/cherri

      - name: Compile and patch Formal V9
        shell: bash
        run: |
          set -euo pipefail
          cd tools/clarity-factory
          cherri clarity-formal-v9.cherri --skip-sign --debug
          parent='./ClarityFormalV9_unsigned.shortcut'
          test -f "$parent"

          python3 patch_append_file_paths.py "$parent"

          python3 - "$parent" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as fh:
              root = plistlib.load(fh)
          actions = root.get('WFWorkflowActions', [])
          llm = [a for a in actions if a.get('WFWorkflowActionIdentifier') == 'is.workflow.actions.askllm']
          assert len(llm) == 1, len(llm)
          params = llm[0].get('WFWorkflowActionParameters', {})
          assert params.get('WFLLMModel') == 'ChatGPT', params
          assert params.get('WFGenerativeResultType') == 'Text', params
          blob = repr(root)
          assert 'valid JSON text with no markdown fence' in blob
          assert 'ClarityActionsV8A' in blob
          assert 'ClarityFormalV9' in blob
          assert 'E2E PASS' in blob
          assert 'is.workflow.actions.detect.dictionary' in [a.get('WFWorkflowActionIdentifier','') for a in actions]
          resolver = [
              a.get('WFWorkflowActionParameters', {})
              for a in actions
              if a.get('WFWorkflowActionIdentifier') == 'is.workflow.actions.documentpicker.open'
              and a.get('WFWorkflowActionParameters', {}).get('CustomOutputName') == 'inboxFile'
          ]
          assert resolver
          assert resolver[0].get('WFFileErrorIfNotFound') is False, resolver[0]
          print('Formal V9 iOS27 JSON-text contract: PASS')
          PY

          mkdir -p artifacts-v9
          cp "$parent" artifacts-v9/ClarityFormalV9.shortcut

      - name: Sign Formal V9
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clarity-factory/sign_with_hubsign.py \
            --input tools/clarity-factory/artifacts-v9/ClarityFormalV9.shortcut \
            --output tools/clarity-factory/artifacts-v9/ClarityFormalV9-signed.shortcut \
            --name 'ClarityFormalV9' \
            --timeout 180

      - name: Verify AEA1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/clarity-factory/artifacts-v9/ClarityFormalV9-signed.shortcut')
          data=p.read_bytes()
          assert data.startswith(b'AEA1')
          assert len(data)>500
          print(p.name, len(data))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: clarity-formal-v9
          path: tools/clarity-factory/artifacts-v9/ClarityFormalV9-signed.shortcut
          if-no-files-found: error
