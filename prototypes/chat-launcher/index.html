<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f5f7">
<title>MY CHAT by YOS</title>
<style>
:root{color-scheme:light;--bg:#f5f5f7;--ink:#17181a;--muted:#8a8f98;--line:#e8e8ec;--red:#ff453a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}button,input{font:inherit}.app{width:min(100%,520px);margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 82px)}.top{position:sticky;top:0;z-index:20;padding:10px 16px 12px;background:rgba(245,245,247,.92);backdrop-filter:blur(18px)}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:29px;font-weight:850;letter-spacing:-.04em}.iconbtn{width:42px;height:42px;border:0;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.07);font-size:20px}.search{margin-top:10px;display:flex;align-items:center;gap:8px;background:#e9eaee;border-radius:13px;padding:9px 12px}.search input{min-width:0;width:100%;border:0;outline:0;background:transparent;font-size:15px}.filters{display:flex;gap:8px;overflow:auto;padding:10px 16px 6px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:0;border-radius:999px;padding:8px 12px;background:#fff;color:#656b74;font-size:12px;font-weight:760}.chip.active{background:#1c1c1e;color:#fff}.section{padding:10px 0}.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 17px 7px;color:#777d86;font-size:11px;font-weight:800;letter-spacing:.06em}.rows{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.row{display:grid;grid-template-columns:50px 1fr auto;gap:11px;align-items:center;min-height:76px;padding:9px 15px;border-bottom:1px solid var(--line);background:#fff}.row:last-child{border-bottom:0}.avatar{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;background:linear-gradient(145deg,#3d8bfd,#7aa8ff)}.avatar.clarity{background:linear-gradient(145deg,#7b61ff,#b185ff)}.avatar.myway{background:linear-gradient(145deg,#2bbb83,#73d9ae)}.avatar.proto{background:linear-gradient(145deg,#ff8e36,#ffc266)}.avatar.life{background:linear-gradient(145deg,#ff6675,#ff9b8f)}.main{min-width:0}.name-line{display:flex;align-items:center;gap:6px}.name{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pin{font-size:11px;color:#a1a6ae}.preview{margin-top:4px;color:#777d86;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{text-align:right;align-self:start;padding-top:3px}.time{font-size:10px;color:#aaaeb5}.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-top:7px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;font-weight:850}.state{display:inline-block;margin-top:7px;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:850}.now{color:#1d7c3e;background:#def7e7}.wait{color:#a46300;background:#fff0ce}.done{color:#70757d;background:#eef0f2}.empty{padding:30px 18px;text-align:center;color:#92969d;font-size:13px}.bottom{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);height:calc(68px + env(safe-area-inset-bottom));padding:8px 20px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.95);border-top:1px solid var(--line);backdrop-filter:blur(20px)}.tab{border:0;background:transparent;color:#91969e;font-size:10px;font-weight:750}.tab span{display:block;font-size:22px;line-height:29px}.tab.active{color:#1c1c1e}.sheet{position:fixed;z-index:50;inset:0;display:none;align-items:flex-end;background:rgba(0,0,0,.28)}.sheet.open{display:flex}.panel{width:min(100%,520px);margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 70px rgba(0,0,0,.18)}.handle{width:40px;height:5px;border-radius:9px;background:#d7d8dc;margin:0 auto 16px}.panel h2{margin:0 0 4px;font-size:20px}.panel p{margin:0 0 14px;color:#858a92;font-size:12px;line-height:1.5}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:11px;color:#777d86;font-weight:750}.field input{width:100%;min-height:44px;border:1px solid #dedfe4;border-radius:12px;padding:0 11px;outline:none}.actions{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;margin-top:14px}.actions button{min-height:46px;border:0;border-radius:13px;font-weight:850}.cancel{background:#eef0f2;color:#60656e}.save{background:#1c1c1e;color:#fff}.hint{margin:10px 16px 0;padding:11px 12px;border-radius:14px;background:#fff;color:#777d86;font-size:11px;line-height:1.55}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="topline"><div class="title">MY CHAT</div><button id="add" class="iconbtn" aria-label="追加">＋</button></div><label class="search">⌕<input id="q" placeholder="チャットを検索" autocomplete="off"></label></header><div id="filters" class="filters"></div><div id="content"></div><div class="hint">ChatGPT公式アプリは変更しません。URL設定済みのチャットは1タップで開きます。</div></div>
<nav class="bottom"><button class="tab active" data-view="all"><span>💬</span>チャット</button><button class="tab" data-view="now"><span>▶︎</span>今やる</button><button class="tab" data-view="wait"><span>◷</span>待ち</button><button class="tab" data-view="done"><span>✓</span>完了</button></nav>
<div id="sheet" class="sheet"><div class="panel"><div class="handle"></div><h2 id="sheetTitle">リンク設定</h2><p>ChatGPTの対象チャットURLを貼ると、次から1タップで開きます。</p><div class="field"><label>名前</label><input id="editName"></div><div class="field"><label>URL</label><input id="editUrl" inputmode="url" placeholder="https://chatgpt.com/c/..."></div><div class="actions"><button id="cancel" class="cancel">閉じる</button><button id="save" class="save">保存</button></div></div></div>
<script>
'use strict';
const STORAGE='yos-chat-launcher-v1';
const seed=[
{id:'yos',name:'YOS',group:'YOS',state:'now',badge:1,pin:true,icon:'Y',tone:'',preview:'人生全体の窓口・続きから相談',url:''},
{id:'clarity',name:'Clarity',group:'ProjectY',state:'now',badge:1,pin:true,icon:'C',tone:'clarity',preview:'P0・入力→実行→成功確認',url:''},
{id:'myway',name:'MY WAY',group:'ProjectY',state:'wait',badge:0,pin:true,icon:'M',tone:'myway',preview:'Home / Life / Money / Journey / Idea',url:''},
{id:'proto',name:'プロト君',group:'プロト君',state:'now',badge:0,pin:false,icon:'プ',tone:'proto',preview:'小さく作って試す',url:''},
{id:'income',name:'収入獲得',group:'収入',state:'now',badge:1,pin:false,icon:'¥',tone:'life',preview:'在宅・iPhone・着金優先',url:''},
{id:'archive',name:'Archive',group:'ARCHIVE',state:'done',badge:0,pin:false,icon:'保',tone:'',preview:'完了・古いチャット',url:''}
];
const $=id=>document.getElementById(id),clean=v=>typeof v==='string'?v.trim():'';
function load(){try{const v=JSON.parse(localStorage.getItem(STORAGE)||'null');if(Array.isArray(v)&&v.length)return v}catch{}return JSON.parse(JSON.stringify(seed))}
let chats=load(),view='all',filter='すべて',editing=null;
function saveAll(){localStorage.setItem(STORAGE,JSON.stringify(chats))}
function importYosUrl(){try{const s=JSON.parse(localStorage.getItem('yos-home-settings-v2')||'{}'),url=clean(s.yosUrl),item=chats.find(x=>x.id==='yos');if(url&&url.startsWith('https://chatgpt.com/')&&!item.url){item.url=url;saveAll()}}catch{}}
importYosUrl();
const label={now:'今やる',wait:'待ち',done:'完了'};
function groups(){return ['すべて',...new Set(chats.map(x=>x.group))]}
function renderFilters(){$('filters').innerHTML=groups().map(g=>`<button class="chip ${g===filter?'active':''}" data-filter="${g}">${g}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()})}
function matches(c){const q=clean($('q').value).toLowerCase();if(view!=='all'&&c.state!==view)return false;if(filter!=='すべて'&&c.group!==filter)return false;return !q||`${c.name} ${c.group} ${c.preview}`.toLowerCase().includes(q)}
function row(c){return `<div class="row" data-id="${c.id}"><div class="avatar ${c.tone||''}">${c.icon||'C'}</div><div class="main"><div class="name-line"><div class="name">${c.name}</div>${c.pin?'<span class="pin">● 固定</span>':''}</div><div class="preview">${c.preview||'タップして開く'}</div></div><div class="meta"><div class="time">${c.url?'1タップ':'未設定'}</div>${c.badge?`<div class="badge">${c.badge}</div>`:`<span class="state ${c.state}">${label[c.state]||''}</span>`}</div></div>`}
function groupItems(items){return items.reduce((m,x)=>{(m[x.group]??=[]).push(x);return m},{})}
function render(){renderFilters();const visible=chats.filter(matches).sort((a,b)=>Number(b.pin)-Number(a.pin)),grouped=groupItems(visible);$('content').innerHTML=visible.length?Object.entries(grouped).map(([g,items])=>`<section class="section"><div class="section-head"><span>${g}</span><span>${items.length}</span></div><div class="rows">${items.map(row).join('')}</div></section>`).join(''):'<div class="empty">該当するチャットはありません</div>';document.querySelectorAll('.row').forEach(el=>el.onclick=()=>openChat(el.dataset.id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view))}
function validChatUrl(url){return /^https:\/\/chatgpt\.com\/(c\/|g\/|project\/|projects\/|$)/i.test(url)}
function openChat(id){const c=chats.find(x=>x.id===id);if(!c)return;if(validChatUrl(clean(c.url))){location.href=c.url;return}edit(c)}
function edit(c){editing=c?.id||null;$('sheetTitle').textContent=c?'リンク設定':'チャット追加';$('editName').value=c?.name||'';$('editUrl').value=c?.url||'';$('sheet').classList.add('open');setTimeout(()=>$('editUrl').focus(),120)}
function closeSheet(){$('sheet').classList.remove('open');editing=null}
$('save').onclick=()=>{const name=clean($('editName').value),url=clean($('editUrl').value);if(!name)return;if(url&&!validChatUrl(url)){alert('chatgpt.com のチャットURLを貼ってください');return}if(editing){const c=chats.find(x=>x.id===editing);c.name=name;c.url=url}else{chats.push({id:`custom-${Date.now()}`,name,group:'その他',state:'now',badge:0,pin:false,icon:name.slice(0,1),tone:'',preview:'追加したチャット',url})}saveAll();closeSheet();render()};
$('cancel').onclick=closeSheet;$('sheet').onclick=e=>{if(e.target===$('sheet'))closeSheet()};$('add').onclick=()=>edit(null);$('q').oninput=render;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;render()});render();
</script>
</body></html>
