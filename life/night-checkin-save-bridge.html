<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>YOS Night Sync</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f7f1df}
    body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
  </style>
</head>
<body>
  <script>
    (() => {
      // Keep the large Night payload out of the network request. Safari only
      // fetches this short bridge URL; after load we restore the fragment as
      // query parameters locally for the existing Night bridge.
      const fragment=location.hash.startsWith('#')?location.hash.slice(1):'';
      if(fragment.startsWith('night_save=1&')||fragment.startsWith('night=')){
        history.replaceState({},'',location.pathname+'?'+fragment);
      }
    })();
  </script>
  <script src="./night-checkin-life-bridge-v1.js?v=4"></script>
</body>
</html>
