<body><div id="app"><main id="stage"><section class="sheet current cover"><div class="topline">PERSONAL MAGAZINE · DAILY / YOS</div><div class="brand">YOS<br>JOURNAL.</div><div class="coverGrow"></div><span class="tag">DAILY EDIT</span><h1>今日を、少し良くする情報。</h1><p>信頼できる情報を、1冊の雑誌のように。</p><div class="issue">記事を読み込み中</div></section></main><nav id="bar" aria-label="ページ操作"><button id="toc" aria-label="目次">☷</button><button id="prev" aria-label="前ページ">‹</button><span id="count">1 / 1</span><button id="next" aria-label="次ページ">›</button><button id="size" aria-label="文字サイズ">Aa</button></nav></div><div id="status" role="status"></div>
<script>
(()=>{'use strict';
const endpoint='https://raw.githubusercontent.com/yskn0008-bot/ProjectY/main/ios-app/scriptable/journal/latest.json';
const editorialBase='https://raw.githubusercontent.com/yskn0008-bot/ProjectY/main/journal/editions/';
const stage=document.getElementById('stage'),count=document.getElementById('count'),status=document.getElementById('status');
const byId=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeLink=x=>{try{const u=new URL(String(x));return u.protocol==='https:'?u.href:''}catch{return ''}};
const icons=[
'<svg viewBox="0 0 320 120" aria-label="タクシー"><rect width="320" height="120" fill="#1b3b57"/><path d="M47 82l20-37h139l22 37h16v20H30V82Z" fill="#f0e6da"/><path d="M80 52h111l16 30H64Z" fill="#789bae"/><path d="M119 32h44v13h-44Z" fill="#d8b27b"/><circle cx="83" cy="103" r="13" fill="#152638"/><circle cx="209" cy="103" r="13" fill="#152638"/></svg>',
'<svg viewBox="0 0 320 120" aria-label="海と音楽"><rect width="320" height="120" fill="#23475c"/><circle cx="257" cy="36" r="22" fill="#e5bc78"/><path d="M0 93q40-21 80 0t80 0t80 0t80 0" fill="none" stroke="#7bb0af" stroke-width="5"/><path d="M134 25v55l44-9V17Z" fill="none" stroke="#f4e5d1" stroke-width="5"/><ellipse cx="122" cy="84" rx="15" ry="9" fill="#f4e5d1"/><ellipse cx="166" cy="75" rx="15" ry="9" fill="#f4e5d1"/></svg>',
'<svg viewBox="0 0 320 120" aria-label="肌のケア"><rect width="320" height="120" fill="#e5d7c8"/><circle cx="160" cy="53" r="43" fill="#cfa58c"/><path d="M132 51q28-17 56 0m-37 17q12 11 23 0" stroke="#805f55" stroke-width="3" fill="none"/><path d="M99 120q10-42 61-42t61 42" fill="#b89c9e"/><circle cx="247" cy="39" r="14" fill="#fff" opacity=".7"/></svg>',
'<svg viewBox="0 0 320 120" aria-label="お金と選択肢"><rect width="320" height="120" fill="#254254"/><rect x="64" y="19" width="181" height="86" rx="12" fill="#f0e8dc"/><path d="M83 37h143" stroke="#a3aca9" stroke-width="8"/><path d="M83 81l36-18 31 10 51-28" stroke="#b38b54" stroke-width="6" fill="none"/><circle cx="250" cy="85" r="22" fill="#d5ae75"/><path d="M243 81h14m-7-12v29" stroke="#1f394d" stroke-width="3"/></svg>'];
let slides=[],index=0,issueKey='',font=17,tocIndex=1;
function shell(kind,content){return '<section class="sheet '+kind+'">'+content+'</section>'}
function para(k,v){return '<h3>'+esc(k)+'</h3><p class="copy">'+esc(v)+'</p>'}
function addArticle(pages,a,i,issue){
 const cat=String(a.category||'FEATURE'),key=String(i+1).padStart(2,'0');
 const link=safeLink(a.link),source='<a href="'+esc(link)+'" target="_blank" rel="noopener noreferrer">公式・出典を確認 ↗</a>';
 const footer='<div class="fill"></div><div class="folio"><span>YOS JOURNAL</span><span>'+key+'</span></div>';
 const isJazz=issue.issuedOn==='2026-11-12'&&/MIHAMA|ジャズ/.test(a.title);
 if(isJazz){
 const photo='https://www.depot-island.co.jp/images/about-pict03.jpg';
 pages.push(shell('jazz-hero',
  '<div class="eyebrow light">WEEKEND / CULTURE · 01</div><h2 class="jazz-title"><span>海風と、</span><span>ジャズと、</span><em>土曜の美浜。</em></h2>'+
  '<div class="jazz-photo"><img src="'+esc(photo)+'" alt="北谷・デポアイランドの海沿いテラス。ライブ当日の写真ではありません"><div class="photo-mark">CHATAN / SEASIDE</div></div>'+
  '<p class="photo-credit">写真：デポアイランド公式｜会場周辺の風景（イベント当日の写真ではありません）</p>'+
  '<div class="jazz-stats"><div><b>11.14</b><small>SATURDAY</small></div><div><b>12—20</b><small>TIME</small></div><div><b>FREE</b><small>ADMISSION</small></div></div>'+
  '<p class="jazz-deck">海沿いを歩いていたら、どこからか生演奏。3つの会場を行き来しながら、気になる音に立ち止まる週末。</p>'+footer));
 const main=[
 ['12:00','ジャズんちゅ'],['13:00','D.D.extention'],['14:00','HANS'],['15:10','儀保貴子'],['16:10','SAKI & The Sidewinders'],['17:20','MOJO'],['18:10','亜熱帯クラブ'],['18:40','平良史子'],['19:20','シークレット出演']
 ];
 const schedule=main.map(([time,artist],n)=>'<div class="lineup-row"><time>'+esc(time)+'</time><div class="lineup-name">'+esc(artist)+'</div><i>'+(n===8?'LAST':'LIVE')+'</i></div>').join('');
 pages.push(shell('jazz-schedule',
  '<div class="eyebrow">02 / THE LINEUP</div><h2 class="program-heading">音楽で辿る、<br><em>12:00 → 20:00</em></h2>'+
  '<p class="program-intro">デポアイランド・ボードウォーク <strong>メイン会場</strong></p><div class="lineup-list">'+schedule+'</div>'+
  '<p class="program-note">※演奏時刻・出演者は公式掲載タイムテーブルをもとにした案内。変更の可能性があります。</p>'+footer));
 pages.push(shell('jazz-guide',
  '<div class="eyebrow">03 / EXPLORE MIHAMA</div><h2 class="guide-title">海沿いの外にも、<br>音楽がある。</h2>'+
  '<div class="venue"><div class="venue-time">14:40<span>—15:10</span></div><div><b>THE FAT HATTER OKINAWA</b><p>広瀬朝子による小編成ライブ</p></div></div>'+
  '<div class="venue"><div class="venue-time">17:45<span>—18:30</span><br>19:00<span>—19:45</span></div><div><b>MBギャラリーチャタン</b><p>MBギャラリーカルテット</p></div></div>'+
  '<div class="guide-caption">街を歩いて、気になる音を拾っていく。会場間の移動や飲食には別途費用がかかる場合があります。</div>'+
  '<div class="official-source"><b>OFFICIAL INFORMATION</b><p>北谷町観光協会｜MIHAMA JAZZ STREET 2026</p>'+source+'</div>'+footer));
 return;
 }
 if(/SKIN|HEALTH/.test(cat)){
 pages.push(shell('skin-feature',
  '<div class="eyebrow">SELF / BETTER CHOICES</div><div class="feature-index">02</div>'+
  '<h2 class="skin-title">肌への投資、<br><em>順番で差がつく。</em></h2>'+
  '<p class="skin-lead">'+esc(a.summary||'')+'</p>'+
  '<div class="skin-steps"><div><span>01</span><b>いまの肌の状態</b><small>診察で原因を整理</small></div><div><span>02</span><b>標準治療を知る</b><small>費用・期間・副作用を比較</small></div><div><span>03</span><b>必要な施術を選ぶ</b><small>急いで高額施術から始めない</small></div></div>'+
  '<div class="feature-note">'+esc(a.caveat||'医師の診察を受けて判断する。')+'</div><div class="feature-link">'+source+'</div>'+footer));
 return;
 }
 if(/STYLE/.test(cat)){
 pages.push(shell('style-feature','<div class="eyebrow">SELF / STYLE</div><div class="style-number">06</div><h2 class="style-title">着飾るより、<br><em>整える。</em></h2><div class="style-sub">THE SMALL DETAILS</div>'+
 '<p class="style-opening">'+esc(a.summary||'')+'</p><div class="style-checks"><div><span>01</span><b>髪の輪郭</b><small>前・横・後ろのまとまり</small></div><div><span>02</span><b>手元</b><small>爪や指先の清潔感</small></div><div><span>03</span><b>服と香り</b><small>シワを減らし、香りは控えめ</small></div></div>'+
 '<div class="style-note">'+esc(a.caveat||'')+'</div><div class="feature-link">'+source+'</div>'+footer));
 return;
 }
 if(/TECH/.test(cat)){
 pages.push(shell('tech-feature','<div class="eyebrow">TECH / NEXT</div><h2 class="tech-head">iPhoneの次の進化を、<br><em>生活のラクさへ。</em></h2>'+
 '<div class="tech-shape"><div class="tech-screen">27<span>iOS</span></div><div class="tech-signal">SIRI AI<br>WIDGETS<br>PERSONALIZE</div></div>'+
 '<p class="tech-summary">'+esc(a.summary||'')+'</p><div class="tech-value"><b>気になる理由</b><p>'+esc(a.reason||'')+'</p></div><div class="tech-action">'+esc(a.action||'')+'</div><div class="feature-link">'+source+'</div>'+footer));
 return;
 }
 if(/CRAFT|LOCAL/.test(cat)){
 pages.push(shell('local-feature','<div class="eyebrow">LIFE / LOCAL CULTURE</div><div class="local-index">'+key+'</div><h2 class="local-title">'+esc(a.title)+'</h2>'+
 '<div class="local-banner"><span>'+(cat.includes('CRAFT')?'OBJECTS & MATERIALS':'LOCAL ARTS & CULTURE')+'</span><div class="local-pattern"></div></div>'+
 '<p class="local-lead">'+esc(a.summary||'')+'</p><div class="local-why"><b>楽しみ方のヒント</b><p>'+esc(a.reason||'')+'</p><p>'+esc(a.action||'')+'</p></div>'+
 '<div class="local-note">'+esc(a.caveat||'')+'</div><div class="feature-link">'+source+'</div>'+footer));
 return;
 }
 if(/MONEY|LAW|LEGAL/.test(cat)){
 pages.push(shell('money-feature',
  '<div class="eyebrow">MONEY / OPTIONS</div><div class="money-big">知っている選択肢が、<br><span>安心を増やす。</span></div>'+
  '<div class="money-rule"></div><p class="money-lead">'+esc(a.summary||'')+'</p>'+
  '<div class="money-contrast"><div><small>BEFORE</small><strong>情報が少ないまま<br>ひとりで判断</strong></div><div><small>AFTER</small><strong>条件を確認して<br>相談先を選べる</strong></div></div>'+
  '<div class="money-action"><b>調べるなら、ここから</b><p>'+esc(a.action||'')+'</p><small>'+esc(a.caveat||'')+'</small></div>'+
  '<div class="feature-link">'+source+'</div>'+footer));
 return;
 }
 pages.push(shell('story-feature','<div class="eyebrow">'+key+' / '+esc(cat)+'</div><h2 class="story-title">'+esc(a.title)+'</h2>'+
 '<div class="story-accent"></div><p class="story-lead">'+esc(a.summary||'')+'</p><div class="story-why">'+esc(a.reason||'')+'</div>'+
 '<h3>これから役立つこと</h3><p>'+esc(a.action||'')+'</p><p class="story-caveat">'+esc(a.caveat||'')+'</p>'+
 '<div class="feature-link">'+source+'</div>'+footer));
}
function draw(issue){
 if(!issue||!Array.isArray(issue.articles)||!issue.articles.length)throw Error('記事データがありません');
 const articles=issue.articles.filter(a=>a&&a.title&&safeLink(a.link)).filter(a=>!(issue.issuedOn==='2026-11-12'&&/タクシー.*求人|配車アプリで働く/.test(a.title))).slice(0,8);
 if(!articles.length)throw Error('出典リンク付きの記事がありません');
 issueKey=String(issue.issuedOn||issue.date||'unknown');
 const parts=[],starts=[];
 const jazzSpecial=issue.issuedOn==='2026-11-12'&&articles.some(a=>/ジャズ|MIHAMA/.test(a.title));
 const coverHeadline=jazzSpecial?'土曜、<br>街がジャズになる。':esc(issue.headline||articles[0].title);
 const coverCopy=jazzSpecial?'美浜の海風と音楽を巡る、週末ガイド。':esc(issue.lead||'今日、読む価値のある情報を。');
 const coverTheme=jazzSpecial?'JAZZ':'TODAY';
 const coverN=jazzSpecial?'WEEKEND CULTURE':'PERSONAL EDITION';
 parts.push(shell('cover magazine-cover','<div class="cover-top"><span>YOS / PERSONAL EDITION</span><span>'+esc(issue.issuedOn||'DAILY')+'</span></div><div class="brand">YOS<br>JOURNAL<span class="brand-dot">.</span></div><div class="cover-art"><div class="cover-motif">'+coverTheme+'<span>'+(jazzSpecial?'AT THE SEASIDE':'MADE FOR ONE')+'</span></div></div><div class="cover-bottom"><div class="cover-line">'+coverN+' <span>NO. 01</span></div><h1>'+coverHeadline+'</h1><p>'+coverCopy+'</p><div class="cover-foot"><span>'+esc(issue.date||'発行日未確認')+'</span><span>'+articles.length+' STORIES INSIDE</span></div></div>'));
 parts.push('CONTENTS_PLACEHOLDER');
 if(articles.length>4)parts.push('CONTENTS_PLACEHOLDER_2');
 for(let i=0;i<articles.length;i++){starts.push(parts.length);addArticle(parts,articles[i],i,issue)}
 const tocPage=(subset,offset,heading)=>shell('contents','<div class="kicker">YOS JOURNAL / CURATED READS</div><h2>'+heading+'</h2><div class="contents-list">'+subset.map((a,i)=>'<button class="toc" data-go="'+starts[offset+i]+'"><span class="number">'+String(offset+i+1).padStart(2,'0')+'</span><span class="detail"><small>'+esc(a.category||'FEATURE')+'</small><strong>'+esc(a.title)+'</strong></span><span class="chevron">›</span></button>').join('')+'</div><div class="fill"></div><div class="folio">'+esc(issue.date||'')+'</div>');
 parts[1]=tocPage(articles.slice(0,4),0,'今日、読みたい話。');
 if(articles.length>4)parts[2]=tocPage(articles.slice(4),4,'まだある、発見。');
 stage.innerHTML=parts.join('');
 slides=Array.from(stage.querySelectorAll('.sheet'));tocIndex=1;
 stage.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>show(Number(el.dataset.go))));
 let prior=null;try{prior=localStorage.getItem('yos-journal-position-'+issueKey)}catch{}
 const saved=prior===null?0:Number(prior);show(Number.isInteger(saved)?saved:0);
 if(issue.issuedOn){const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});if(issue.issuedOn!==today)notice('本日号ではありません：'+issue.issuedOn)}
}
function show(n){if(!slides.length)return;index=Math.max(0,Math.min(slides.length-1,n));slides.forEach((p,i)=>p.classList.toggle('current',i===index));count.textContent=(index+1)+' / '+slides.length;byId('prev').disabled=index===0;byId('next').disabled=index===slides.length-1;try{localStorage.setItem('yos-journal-position-'+issueKey,String(index))}catch{}}
function notice(x){status.textContent=x;status.style.display='block'}
byId('prev').onclick=()=>show(index-1);byId('next').onclick=()=>show(index+1);byId('toc').onclick=()=>show(tocIndex);
byId('size').onclick=()=>{font=font>=19?15:font+1;document.documentElement.style.setProperty('--size',font+'px')};
let x=0,y=0;stage.addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)show(index+(dx<0?1:-1))},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(index+1);if(e.key==='ArrowLeft')show(index-1)});
(async()=>{let issue=null;try{const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});let r=await fetch(editorialBase+today+'.json',{cache:'no-store'});if(!r.ok)r=await fetch(endpoint,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);issue=await r.json();if(!issue.articles?.length)throw Error('記事なし');try{localStorage.setItem('yos-journal-issue-cache',JSON.stringify(issue))}catch{}}catch(e){try{issue=JSON.parse(localStorage.getItem('yos-journal-issue-cache')||'null');if(issue)notice('通信できないため保存した号を表示しています')}catch{}}
try{draw(issue)}catch(e){stage.innerHTML='<section class="sheet current"><div id="error"><h2>記事を表示できませんでした</h2><p>'+esc(e.message)+'</p><p>通信を確認して再読み込みしてください。</p></div></section>';count.textContent='—'}})();
})();
</script></body></html>
