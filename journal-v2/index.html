 if(p.kind==='feature')return `<section class="sheet feature scroll"><div class="feature-visual" style="background-image:url('${relevantImage(a)}')"><span class="image-note">編集用イメージ写真（記事の現場・人物ではありません）</span></div><div class="feature-content"><div class="feature-count">FEATURE ${serial} / ${esc(a.category||'EDITORIAL')}</div><h2>${esc(a.title)}</h2><p class="summary">${esc(p.chunk)}</p><div class="folio">THE BRIEF / ${serial} / ${issue.articles.length}　● YOS JOURNAL</div></div></section>`;
 if(p.kind==='continuation')return `<section class="sheet paper scroll"><p class="kicker">FEATURE ${serial} / THE BRIEF ・${p.part}</p><h2>${esc(a.title)}</h2><p class="intro">${esc(p.chunk)}</p><p class="footnote">続きは右へページをめくってください。</p></section>`;
 if(p.kind==='notes') {let points=Array.isArray(a.keyPoints)?a.keyPoints.slice(0,3):[],href=validLink(a.link),audio=/^\d{4}-\d{2}-\d{2}$/.test(issue.issuedOn)?`../journal/audio/${issue.issuedOn}/article-${i}.mp3`:'';return `<section class="sheet notes scroll"><p class="kicker" style="font-size:11px;letter-spacing:.17em;color:#a07b52">EDITOR'S NOTE / ${serial}</p><h2>知って、どう活かす？</h2><div class="sec"><b>WHY IT MATTERS / 今の自分に役立つ理由</b><p>${esc(a.reason)}</p></div><div class="sec"><b>YOUR NEXT MOVE / 今日の一歩</b><p>${esc(a.action)}</p></div>${points.length?`<div class="sec"><b>KEY POINTS / 押さえること</b><ul>${points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}<div class="sec"><b>確認事項と注意</b><p>${esc(a.caveat)}</p></div><div class="sec source"><b>出典と音声</b><p>${esc(a.source)} ${esc(a.sourceDate||'')}</p>${href?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">元記事を開く ↗</a>`:''}${audio?`<audio class="audio" controls preload="none" playsinline><source src="${esc(audio)}" type="audio/mpeg"></audio><small>VOICEVOX Nemo（公開音声が存在する号のみ再生できます）</small>`:''}</div><div class="folio">${serial} / ${issue.articles.length}　YOS JOURNAL</div></section>`;}
 return `<section class="sheet closing"><div class="overline">THE END / YOS PERSONAL MAGAZINE</div><h2>YOS<br>JOURNAL.</h2><p>今日の新しい発見を、<br>これからの自分へ。</p><button type="button" data-go="0">表紙に戻る</button><p style="font-size:12px">出典の条件が変わる場合があります。行動前には公式情報を確認してください。</p></section>`;
}
function go(n,save=true){if(!pages.length)return;at=Math.max(0,Math.min(n,pages.length-1));stage.innerHTML=bodyMarkup(pages[at]);$('#prevBtn').disabled=at===0;$('#nextBtn').disabled=at===pages.length-1;progress.textContent=String(at+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0');topDate.textContent=pretty(issue.issuedOn)+(stale?' / 保存号':' / 本日号');stage.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.go))));if(save){try{history.replaceState(null,'','#p-'+at)}catch{}}}
function refreshToc(){status.textContent=pretty(issue.issuedOn)+(stale?' / 保存号・新号は未公開':' / 本日の新刊')+' ／ '+issue.articles.length+'記事';toc.innerHTML=issue.articles.map((a,i)=>`<button type="button" class="toc-entry" data-jump="${pages.findIndex(p=>p.kind==='feature'&&p.i===i)}"><span class="toc-num">${String(i+1).padStart(2,'0')}</span><span class="toc-title">${esc(a.title)}</span></button>`).join('');toc.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{closeModal();go(Number(b.dataset.jump))})}
function setIssue(data,selected=0){if(!data||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(data.issuedOn)||!Array.isArray(data.articles)||data.articles.length<1||data.articles.length>16||data.articles.some(x=>typeof x.title!=='string'||typeof x.summary!=='string'))return false;issue=data;stale=issue.issuedOn!==dateJST();build(issue);let idx=selected;const m=location.hash.match(/^#(?:p-|article-)(\d+)$/);if(m){const n=Number(m[1]);if(location.hash.startsWith('#article-'))idx=pages.findIndex(x=>x.kind==='feature'&&x.i===n);else idx=n;}go(idx,false);refreshToc();return true;}
async function fetchIssue(url){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000);try{const res=await fetch(url+'?c='+Date.now(),{cache:'no-store',signal:ctl.signal});if(!res.ok)return null;return await res.json()}catch{return null}finally{clearTimeout(t)}}
async function reload(){if(loading)return;loading=true;status.textContent='最新号を確認しています';try{const today=dateJST(),todayData=await fetchIssue(base+today+'.json');if(todayData&&todayData.issuedOn===today&&setIssue(todayData,0))return;const newest=await fetchIssue(latest);if(newest&&setIssue(newest,0))return;setIssue(issue,at)}finally{loading=false}}
async function archive(day){closeModal();const res=await fetchIssue(base+day+'.json');if(res){setIssue(res,0)}else{status.textContent='保存号を取得できませんでした';openModal()}}
function openModal(){refreshToc();overlay.classList.add('open');overlay.setAttribute('aria-hidden','false')}function closeModal(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true')}
$('#tocBtn').onclick=openModal;$('#closeModal').onclick=closeModal;overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});$('#prevBtn').onclick=()=>go(at-1);$('#nextBtn').onclick=()=>go(at+1);$('#fontBtn').onclick=()=>{fontIndex=(fontIndex+1)%letters.length;document.documentElement.style.setProperty('--font',letters[fontIndex]+'px');go(at,false)};$('#archive171Btn').onclick=()=>archive('2026-11-17');$('#archive121Btn').onclick=()=>archive('2026-11-12');$('#latestBtn').onclick=()=>{closeModal();reload()};
let startX=0,startY=0;stage.addEventListener('touchstart',e=>{const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY},{passive:true});stage.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)go(at+(dx<0?1:-1))},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(overlay.classList.contains('open'))return;if(e.key==='ArrowRight')go(at+1);if(e.key==='ArrowLeft')go(at-1)});window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#p-(\d+)$/);if(m)go(Number(m[1]),false)});
setIssue(fallback);reload();
if('serviceWorker'in navigator && (location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
})();
</script></body></html>
