<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff"><title>YOS JOURNAL｜Widgy見出し3記事</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#202020;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:660px;min-width:280px;margin:auto;padding:0 18px 16px;min-height:600px;background:#fff}
header{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dedede}
header b{font-size:23px;letter-spacing:-.045em}header small{color:#777;font-size:10px}
.info{margin-top:17px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#666}.info b{color:#222;font-weight:650}
#list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:102px minmax(0,1fr);align-items:start;gap:14px;padding:20px 0;border-bottom:1px solid #e8e8e8;min-height:139px;color:inherit;text-decoration:none}
.item img,.blank{width:102px;height:102px;object-fit:cover;background:#eff0f1}.blank{display:grid;place-items:center;color:#a0a0a0;font-size:39px;font-family:Georgia,serif}
.meta{display:block;font-size:10px;color:#777;line-height:1.5;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item strong{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;font-size:17px;line-height:1.46;font-weight:760;letter-spacing:-.02em;overflow-wrap:anywhere}
footer{text-align:right;padding-top:18px}footer a{color:#222;text-decoration:none;border-bottom:1px solid #222;padding-bottom:4px;font-size:13px;font-weight:650}
#empty{font-size:13px;color:#666;line-height:1.7;padding:20px 0}
@media(max-width:350px){main{padding:0 12px 12px;min-height:520px}header{height:65px}header b{font-size:20px}.item{grid-template-columns:88px minmax(0,1fr);gap:10px;padding:14px 0;min-height:118px}.item img,.blank{width:88px;height:88px}.item strong{font-size:16px}.meta{font-size:9px}}
</style></head><body><main><header><b>YOS JOURNAL</b><small>PERSONAL MAGAZINE</small></header><div class="info"><b id="count">最新公開記事</b><span id="status">確認中</span></div><section id="list" aria-live="polite"><p id="empty">公開記事を読み込んでいます…</p></section><footer><a href="./" rel="noopener noreferrer">JOURNALを開く ↗</a></footer></main>
<script>
(()=>{'use strict';
const root='https://yskn0008-bot.github.io/ProjectY/journal-v2/';
const raw='https://raw.githubusercontent.com/yskn0008-bot/ProjectY/main/';
const day=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const valid=x=>x&&/^\d{4}-\d{2}-\d{2}$/.test(x.issuedOn)&&x.issuedOn<=day()&&Array.isArray(x.articles)&&x.articles.length;
const fallback=[{issuedOn:'2026-11-19',articles:[
 {title:'午後のテカリ。洗面台へ戻る前に、鏡の前で数秒。',category:'SELF / 身だしなみ',image:'https://commons.wikimedia.org/wiki/Special:FilePath/Man_grooming_in_a_modern_bathroom_mirror_during_evening_hours_while_checking_reflection.jpg?width=800'},
 {title:'会話は、相手のひと言を拾うと深くなる。',category:'PRESENCE / 会話',image:'https://commons.wikimedia.org/wiki/Special:FilePath/Coffee%2C_conversation_and_collaboration_-_ATTT_2025.jpg?width=800'},
 {title:'那覇で30分。いつもの沖縄を、違う目で見る。',category:'EXPERIENCE / 沖縄',image:'https://commons.wikimedia.org/wiki/Special:FilePath/Okinawa_Prefectural_Museum_%26_Art_Museum_(Okinawa).jpg?width=800'}
]}];
const el=(type,cls,txt)=>{const node=document.createElement(type);if(cls)node.className=cls;if(txt!=null)node.textContent=txt;return node};
function draw(issues,verified){
 const container=document.getElementById('list');container.replaceChildren();
 let shown=0;
 for(const edition of issues.filter(valid).sort((a,b)=>b.issuedOn.localeCompare(a.issuedOn))){
  for(let i=0;i<edition.articles.length&&shown<3;i++){
   const a=edition.articles[i];if(!a||typeof a.title!=='string'||!a.title.trim())continue;
   const row=el('a','item');row.href=root+(edition.issuedOn===day()?'#article-'+i:'#archive-'+edition.issuedOn+'-'+i);row.rel='noopener noreferrer';
   if(typeof a.image==='string'&&a.image.length<1400&&/^https:\/\//i.test(a.image)){
    const img=el('img');img.src=a.image;img.alt='';img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>img.replaceWith(el('div','blank','J'));row.append(img);
   }else row.append(el('div','blank','J'));
   const side=el('span');side.append(el('small','meta',edition.issuedOn+'  ｜  '+String(a.category||'JOURNAL').slice(0,55)),el('strong','',a.title));row.append(side);container.append(row);shown++;
  }
  if(shown>=3)break;
 }
 if(!shown)container.append(el('p','', '公開記事を確認できません。'));
 document.getElementById('count').textContent=shown+'記事の見出し';
 document.getElementById('status').textContent=verified?'公開データ取得済み':'保存済み見本／更新未確認';
}
async function get(url){
 const ac=new AbortController(),timeout=setTimeout(()=>ac.abort(),6500);
 try{const r=await fetch(url,{cache:'no-store',signal:ac.signal});if(!r.ok)throw Error(String(r.status));return await r.json()}finally{clearTimeout(timeout)}
}
(async()=>{
 try{const idx=await get('./archive-index.json');if(Array.isArray(idx?.editions)&&idx.editions.some(valid)){draw(idx.editions,true);return}}catch(_){}
 try{const latest=await get(raw+'ios-app/scriptable/journal/latest.json');if(valid(latest)){
  const older=await get(raw+'journal/editions/2026-11-19.json').catch(()=>null);
  draw([latest,...(valid(older)?[older]:[])],true);return;
 }}catch(_){}
 draw(fallback,false);
})();
})();
</script></body></html>
