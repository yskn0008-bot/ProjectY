<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b0f"><title>YOS BRAVIA</title><link rel="stylesheet" href="./bravia.css"></head><body><main>
<header><a href="./">‹ YOS</a><div><strong>BRAVIA Remote</strong><p id="status" role="status">未接続</p></div><button data-command="power" aria-label="電源">⏻</button></header>
<form id="connect"><input id="host" aria-label="テレビのホスト" placeholder="TVのホスト名 / IP" required><input id="psk" aria-label="PSK" type="password" placeholder="PSK（Keychain保存）" required><button>接続</button></form>
<section class="quick"><button data-command="input">Input</button><button id="quick">Quick Settings候補</button><button data-command="home">Home</button><button data-command="back">Back</button></section>
<section class="dpad" aria-label="方向パッド"><button data-command="up">▲</button><button data-command="left">◀</button><button data-command="confirm" class="ok">OK</button><button data-command="right">▶</button><button data-command="down">▼</button></section>
<section class="controls"><button data-command="volumeDown">Vol −</button><button data-command="mute">Mute</button><button data-command="volumeUp">Vol ＋</button><button data-command="play">Play</button><button data-command="pause">Pause</button><button id="keyboard">Keyboard</button></section>
<section><h2>高速D-pad cursor</h2><div id="touchpad" role="button" tabindex="0">Swipe to move<br><small>Tap = OK · mouseではありません</small></div></section><p class="note">Quick SettingsはXRJ-75X90L実機確認まで未確認です。候補はテレビが返すコマンド名から選択します。</p>
</main><script type="module" src="./bravia.js"></script></body></html>
