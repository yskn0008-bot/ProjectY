<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<title>YOS</title>
<style>
:root{--cream:#fffaf0;--navy:#17243d;--gold:#e2aa35;--orange:#ef8c3a;--sky:#68aee8;--leaf:#6cab72;--coral:#e87867;--card:#fff;--muted:#6d7480;--line:rgba(23,36,61,.1);--danger:#b54c43}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 90% 0,rgba(226,170,53,.2),transparent 30%),linear-gradient(180deg,#fff8e8,var(--cream));color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{width:min(100%,680px);margin:auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 36px)}.top{display:flex;align-items:center;gap:12px}.sun{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:linear-gradient(145deg,#ffd976,var(--gold));font-weight:1000;box-shadow:0 10px 28px rgba(226,170,53,.25)}h1{margin:0;font-size:30px}.subtitle,.updated{color:var(--muted);font-size:11px}.hero{margin-top:18px;padding:20px;border:1px solid rgba(226,170,53,.22);border-radius:28px;background:rgba(255,255,255,.84);box-shadow:0 20px 60px rgba(23,36,61,.08)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{padding:13px 10px;border-radius:18px;background:#fff8e8}.metric small{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;margin-top:4px;font-size:24px}.now{margin-top:14px;padding:16px;border-radius:20px;background:linear-gradient(135deg,#fff0d2,#fff8ea)}.now small{color:var(--orange);font-weight:900}.now h2{margin:6px 0 4px;font-size:20px}.now p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.nav a{padding:11px 6px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.7);color:var(--navy);text-decoration:none;text-align:center;font-size:12px;font-weight:800}.section{margin-top:28px}.section-title{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}.section-title h2{margin:0;font-size:22px}.asset-list,.task-list{display:grid;gap:10px}.asset-card,.task-card,.empty{padding:16px;border:1px solid var(--line);border-radius:21px;background:rgba(255,255,255,.88)}.asset-head{display:flex;align-items:center;gap:8px}.asset-head>div{display:flex;align-items:center;gap:8px;flex:1}.asset-head>b{margin-left:auto}.priority{display:inline-grid;place-items:center;min-width:30px;padding:4px 7px;border-radius:999px;background:#fff0cf;color:#8a5a00;font-size:10px;font-weight:950}.progress{height:7px;margin:10px 0 7px;border-radius:999px;background:#edf0f3;overflow:hidden}.progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--orange))}.status{margin:0 0 8px;color:var(--leaf);font-size:11px;font-weight:900}.meta,.action{margin:5px 0;color:var(--muted);font-size:12px;line-height:1.55}.meta b,.action b{color:var(--navy)}.action{padding:10px;border-radius:12px;background:#eef7ff}.danger{color:var(--danger)!important}.empty{text-align:center;color:var(--muted);font-size:13px;line-height:1.6}.legacy{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.legacy a{padding:12px 7px;border-radius:16px;background:var(--navy);color:white;text-decoration:none;text-align:center;font-size:11px;font-weight:800}.footer{margin-top:24px;text-align:center;color:var(--muted);font-size:10px}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="sun">Y</div><div><h1>YOS</h1><div class="subtitle">太陽・調和｜ひとつの司令塔</div></div></header>
<section class="hero">
<div class="metrics">
<div class="metric"><small>アプリ開発</small><strong id="development-progress">—</strong></div>
<div class="metric"><small>資産全体</small><strong id="asset-progress">—</strong></div>
<div class="metric"><small>本人待ち</small><strong id="waiting-count">—</strong></div>
</div>
<div class="now"><small>今、俺がやる1件</small><h2 id="now-task">読込中</h2><p id="next-action">共通SSOTを確認しています。</p></div>
<div class="nav"><a href="#tasks">本人Queue</a><a href="#assets">資産進捗</a><a href="./capture.html">Clarity入口</a></div>
</section>
<section class="section" id="tasks"><div class="section-title"><h2>本人タスクQueue</h2><span class="updated">生活タスクとは分離</span></div><div class="task-list" id="task-list"><div class="empty">読込中</div></div></section>
<section class="section" id="assets"><div class="section-title"><h2>資産進捗</h2><span class="updated">SSOT</span></div><div class="asset-list" id="asset-list"><div class="empty">読込中</div></div></section>
<section class="section"><div class="section-title"><h2>既存機能</h2><span class="updated">作り直さず再利用</span></div><div class="legacy"><a href="./capture.html">入力</a><a href="./life/">Life</a><a href="./bravia.html">BRAVIA</a></div></section>
<footer class="footer" id="data-state">SSOT読込中</footer>
</main>
<script src="./yos-dashboard.js"></script>
</body>
</html>
