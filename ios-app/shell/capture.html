<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d">
<title>今のことを残す｜YOS</title>
<link rel="stylesheet" href="capture.css">
</head>
<body>
<main class="capture-shell">
  <a class="back" href="./" aria-label="YOSへ戻る">‹ YOS</a>
  <header>
    <span class="eyebrow">YOS CAPTURE</span>
    <h1>今のことを残す</h1>
    <p>そのまま書くだけ。分類はYOSがあとで整理します。</p>
  </header>
  <form id="capture-form">
    <label class="sr-only" for="capture-text">今残したいこと</label>
    <textarea id="capture-text" name="rawText" rows="5" maxlength="10000" autofocus required placeholder="今、残しておきたいことは？"></textarea>
    <button id="capture-submit" type="submit">残す</button>
  </form>
  <p id="capture-status" class="status" role="status" aria-live="polite"></p>
  <details id="history-panel">
    <summary>最近残したこと</summary>
    <ol id="capture-history"></ol>
  </details>
</main>
<script type="module" src="capture.js"></script>
</body>
</html>
