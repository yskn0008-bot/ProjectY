<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>YOS Taxi 需要カレンダー</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#151517;--panel2:#1d1d21;--line:#2a2a30;--text:#fafafa;--muted:#aaaab4;--amber:#ffb323;--orange:#ff7a00;--green:#48d17d;--red:#ff5c67;--blue:#74a7ff}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 100% 0,rgba(255,179,35,.15),transparent 34%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}.app{width:min(100%,760px);margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 32px)}a{color:inherit}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.eyebrow{margin:0 0 4px;color:var(--amber);font-size:11px;font-weight:900;letter-spacing:.14em}h1{margin:0;font-size:27px;line-height:1.08}.back{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--line);border-radius:13px;padding:0 12px;background:var(--panel);text-decoration:none;font-weight:800}.hero{border:1px solid rgba(255,179,35,.35);border-radius:22px;padding:16px;background:linear-gradient(145deg,rgba(255,150,0,.16),rgba(21,21,23,.97) 62%);margin-bottom:12px}.hero strong{display:block;font-size:22px}.hero p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.filter{min-height:44px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--muted);font-weight:900}.filter.active{background:linear-gradient(145deg,var(--amber),var(--orange));border:0;color:#17100a}.section{margin-bottom:14px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:8px}.section h2{margin:0;font-size:17px}.small{color:var(--muted);font-size:11px}.list{display:grid;gap:9px}.card{border:1px solid var(--line);border-radius:18px;padding:14px;background:rgba(21,21,23,.96)}.card.high{border-color:rgba(255,92,103,.45)}.card.medium{border-color:rgba(255,179,35,.42)}.card.low{border-color:rgba(116,167,255,.35)}.topline{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.date{color:var(--amber);font-size:12px;font-weight:900}.badge{display:inline-flex;border-radius:999px;padding:4px 8px;background:#25252b;font-size:10px;font-weight:900}.badge.high{color:#ff9ca3}.badge.medium{color:#ffd990}.badge.low{color:#9fc0ff}.card h3{margin:5px 0 3px;font-size:17px}.meta{color:var(--muted);font-size:11px}.windows{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.window{border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:rgba(0,0,0,.18);font-size:10px}.notes{margin:0;color:#dedee5;font-size:12px;line-height:1.55}.source{display:inline-block;margin-top:10px;color:var(--blue);font-size:11px}.live{border:1px solid rgba(72,209,125,.35);border-radius:18px;padding:14px;background:rgba(72,209,125,.08)}.live h3{margin:0 0 5px}.live p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.live a{display:flex;align-items:center;justify-content:center;min-height:46px;margin-top:10px;border-radius:14px;background:rgba(72,209,125,.17);border:1px solid rgba(72,209,125,.4);text-decoration:none;font-weight:900}.empty{padding:18px;text-align:center;color:var(--muted);font-size:12px}.foot{color:var(--muted);font-size:10px;line-height:1.55;text-align:center;padding:8px 2px}.error{border:1px solid rgba(255,92,103,.5);border-radius:16px;padding:14px;color:#ffb4bb;background:rgba(255,92,103,.08)}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><p class="eyebrow">YOS TAXI OPERATIONS</p><h1>📅 需要カレンダー</h1></div><a class="back" href="./">営業画面</a></header>
<section class="hero"><strong id="headline">公式情報を読み込み中</strong><p>イベント・クルーズ船など、営業判断に使う需要要因を信頼度付きで表示します。予定変更があるため、営業前に公式情報を再確認してください。</p></section>
<nav class="filters" aria-label="需要レベル"><button class="filter active" data-level="all">すべて</button><button class="filter" data-level="high">高需要</button><button class="filter" data-level="medium">中需要</button></nav>
<section class="section"><div class="section-head"><h2>8月の需要要因</h2><span id="count" class="small">0件</span></div><div id="eventList" class="list"></div></section>
<section class="section"><div class="section-head"><h2>当日確認が必要</h2><span class="small">ライブ情報</span></div><div id="liveList" class="list"></div></section>
<footer class="foot">公式情報・取得日・信頼度を表示。未確認事項を事実として扱いません。<br>運転中の操作は禁止です。</footer>
</main>
<script>
const levelLabel={high:'高需要',medium:'中需要',low:'限定需要'};
const categoryLabel={festival:'祭り',conference:'講演・催事',lecture:'講座'};
let allEvents=[];
function formatDate(e){const d=new Date(`${e.date}T00:00:00+09:00`);const base=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'short'}).format(d);if(!e.endDate)return base;const end=new Date(`${e.endDate}T00:00:00+09:00`);return `${base}〜${new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',weekday:'short'}).format(end)}`}
function render(level='all'){
 const list=document.getElementById('eventList');const events=allEvents.filter(e=>level==='all'||e.demandLevel===level);
 document.getElementById('count').textContent=`${events.length}件`;
 if(!events.length){list.innerHTML='<div class="empty">該当する需要情報はありません。</div>';return}
 list.innerHTML=events.map(e=>`<article class="card ${e.demandLevel}"><div class="topline"><div><div class="date">${formatDate(e)} ${e.startTime||''}${e.endTime?`〜${e.endTime}`:''}</div><h3>${e.title}</h3><div class="meta">${e.area}｜${e.venue}｜${categoryLabel[e.category]||e.category}</div></div><span class="badge ${e.demandLevel}">${levelLabel[e.demandLevel]||e.demandLevel}</span></div><div class="windows">${(e.demandWindows||[]).map(w=>`<span class="window">狙い目 ${w}</span>`).join('')}</div><p class="notes">${e.taxiNotes}</p><a class="source" href="${e.sourceUrl}" target="_blank" rel="noopener">公式情報を確認（確認日 ${e.sourceCheckedAt}）</a></article>`).join('')
}
async function load(){try{const res=await fetch('./demand-calendar-v1.json',{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json();allEvents=(data.events||[]).sort((a,b)=>a.date.localeCompare(b.date));document.getElementById('headline').textContent=`確認済み需要情報 ${allEvents.length}件`;render();document.getElementById('liveList').innerHTML=(data.liveSources||[]).map(s=>`<article class="live"><h3>${s.title}</h3><p>${s.notes}</p><a href="${s.sourceUrl}" target="_blank" rel="noopener">当日の公式予定を開く</a></article>`).join('')||'<div class="empty">ライブ情報はありません。</div>'}catch(err){document.getElementById('headline').textContent='需要情報を読み込めません';document.getElementById('eventList').innerHTML=`<div class="error">再読み込みしてください。${err.message}</div>`}}
document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render(btn.dataset.level)}));load();
</script>
</body>
</html>
