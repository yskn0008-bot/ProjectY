<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f0e7" />
  <title>Shortcut Builder | MY WAY</title>
  <link rel="stylesheet" href="./style.css?v=1" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">MY WAY by YOS</p>
      <h1>Shortcut Builder</h1>
      <p class="lead">やりたいことを書く。<br>iPhoneで組む順番だけを、迷わない形にする。</p>
    </header>

    <section class="card compose">
      <label for="request">何を自動化したい？</label>
      <textarea id="request" rows="4" placeholder="例：ローソンの近くでMoney Hubを開いたらPontaを出したい"></textarea>
      <div class="quick" aria-label="テンプレート">
        <button data-template="menu">メニュー</button>
        <button data-template="app">アプリ起動</button>
        <button data-template="focus">集中モード</button>
        <button data-template="calendar">次の予定</button>
        <button data-template="place">場所判定</button>
        <button data-template="notify">通知</button>
      </div>
      <button class="primary" id="build">手順を作る</button>
    </section>

    <section class="card result" id="resultCard" hidden>
      <div class="resultHead">
        <div>
          <p class="mini">iOS 26・日本語表記</p>
          <h2 id="resultTitle">完成手順</h2>
        </div>
        <button class="ghost" id="copy">コピー</button>
      </div>
      <pre id="output"></pre>
      <div class="actions">
        <button class="primary" id="openShortcuts">ショートカットで作成を開始</button>
        <button class="ghost" id="save">この手順を保存</button>
      </div>
      <p class="note">Appleの仕様上、このWebアプリからショートカット内のアクションを直接挿入はできません。「作成を開始」でショートカットの新規編集画面を開き、上の手順どおりに組みます。</p>
    </section>

    <section class="card recent">
      <div class="resultHead">
        <div>
          <p class="mini">RECENT</p>
          <h2>保存した手順</h2>
        </div>
        <button class="ghost danger" id="clear">消去</button>
      </div>
      <div id="recentList" class="recentList"></div>
    </section>
  </main>

  <script src="./app.js?v=1"></script>
</body>
</html>
