<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07151f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>YOS DESK</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./compact.css">
</head>
<body>

<div class="app" id="app">
  <section class="page active" id="deskPage">
    <div class="topbar">
      <div class="brand"><small>YOS DESK</small><strong>DESK</strong></div>
      <div class="topActions"><button class="miniBtn" id="boardBtn">共有掲示板</button><button class="miniBtn" id="metricsBtn">計測</button></div>
    </div>

    <div class="hero">
      <button class="heroMain" id="heroBtn" style="text-align:left;color:inherit;border:1px solid var(--line)">
        <div class="eyebrow">今やる · 優先度 1</div>
        <div class="heroTitle">Clarity 実機修理</div>
        <div class="heroSub">音声 → Router → 固定子の実行経路を、実機PASSまで詰める。</div>
        <div class="next"><b>次：</b>現在のFAIL地点を再確認</div>
      </button>
      <div class="heroSide"><div><div class="big">68%</div><div class="label">開発中<br>現在の進捗</div><div class="bar"><i style="width:68%"></i></div></div><div class="label" id="deskClock">--:--</div></div>
    </div>

    <div class="section">
      <div class="sectionHead"><strong>ピン留め</strong><span>1タップで入口へ</span></div>
      <div class="quick">
        <button class="quickBtn" data-quick="Money"><span class="quickIcon">¥</span><span>Money</span></button>
        <button class="quickBtn" data-quick="Clarity"><span class="quickIcon">C</span><span>Clarity</span></button>
        <button class="quickBtn" data-quick="MY WAY"><span class="quickIcon">M</span><span>MY WAY</span></button>
        <button class="quickBtn" data-quick="MY LIFE"><span class="quickIcon">L</span><span>MY LIFE</span></button>
        <button class="quickBtn" data-quick="YOS Chat"><span class="quickIcon">Y</span><span>YOS Chat</span></button>
      </div>
    </div>

    <div class="section">
      <div class="sectionHead"><strong>開発中</strong><span>長押しして並べ替え</span></div>
      <div class="devList" id="devList"></div>
    </div>

    <div class="section">
      <div class="sectionHead"><strong>AIからの提案</strong><span>必要なものだけ</span></div>
      <div class="suggestions">
        <button class="suggest" id="nightSuggest" style="text-align:left;color:inherit"><small>いま使いそう</small><b>Night Check-inへ</b><p>今日の記録を残して、明日の判断材料にする。</p></button>
        <button class="suggest" id="mergeSuggest" style="text-align:left;color:inherit"><small>統合候補</small><b>Morning Brief + Money Alert</b><p>朝の確認を集約。</p></button>
      </div>
    </div>

    <div class="section">
      <div class="sectionHead"><strong>進捗</strong><span>v1表示</span></div>
      <div class="stats"><div class="stat"><b>2件</b><span>開発中</span></div><div class="stat"><b>2件</b><span>確認待ち</span></div><div class="stat"><b>MY WAY</b><span>最近使った · 12分前</span></div></div>
    </div>

    <div class="composer"><input id="deskInput" placeholder="ここから話す / 投稿する"><button class="send" id="deskSend">送信</button></div>
  </section>

  <section class="page" id="chatsPage">
    <div class="topbar">
      <div class="brand"><small>YOS DESK</small><strong>CHATS</strong></div>
      <div class="topActions"><button class="miniBtn" id="selectBtn">選択</button></div>
    </div>
    <label class="search"><span>⌕</span><input id="searchInput" placeholder="チャット・プロジェクトを検索" autocomplete="off"></label>
    <div class="tabs"><button class="tab active" data-mode="all">すべて <span id="countAll"></span></button><button class="tab" data-mode="unread">未読 <span id="countUnread"></span></button><button class="tab" data-mode="pinned">固定 <span id="countPinned"></span></button></div>
    <div class="projects" id="projects"></div>
    <div class="section"><div class="sectionHead"><strong>最近のチャット</strong><span>長押しで編集</span></div><div class="chatList" id="chatList"></div><div class="empty" id="empty">該当するチャットはありません。</div></div>
  </section>
</div>

<nav class="bottom" id="bottom"><button class="nav active" data-page="desk"><b>⌂</b>DESK</button><button class="nav" data-page="chats"><b>▣</b>CHATS</button><button class="nav" id="newBtn"><b>＋</b>NEW</button></nav>
<div class="bulk" id="bulk"><button id="bulkRead">既読</button><button id="bulkPin">固定</button><button class="danger" id="bulkDelete">削除</button></div>

<div class="sheetBackdrop" id="sheetBackdrop"><div class="sheet" id="sheet"><div class="handle"></div><div id="sheetBody"></div></div></div>
<div class="toast" id="toast"></div>

<script src="../money-master-v1.js?v=20260923v5"></script>
<script src="./app.js?v=20260924live1"></script>
</body>
</html>
