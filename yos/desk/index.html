<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>YOS Chat</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./compact.css?v=20260929-fit2">
<link rel="stylesheet" href="./live-chat.css?v=20261002-chatonly2">
<link rel="stylesheet" href="./unified-inbox.css?v=20261002-chatonly2">
</head>
<body class="chat-only">
<div class="app" id="app">
  <section class="page active" id="chatsPage">
    <div class="topbar chatOnlyTopbar">
      <div class="brand"><strong>チャット</strong></div>
      <div class="topActions">
        <button class="chatIconBtn" id="newBtn" type="button" aria-label="新規チャット">＋</button>
      </div>
    </div>

    <label class="search"><span>⌕</span><input id="searchInput" placeholder="チャットを検索" autocomplete="off"></label>
    <div class="tabs">
      <button class="tab active" data-mode="all">チャット <span id="countAll"></span></button>
      <button class="tab" data-mode="unread">未読 <span id="countUnread"></span></button>
    </div>
    <div class="projects" id="projects"></div>

    <div class="section chatOnlySection">
      <div class="chatList" id="chatList"></div>
      <div class="empty" id="empty">
        <strong>まだチャットがありません</strong>
        <span>右上の＋から会話を始められます。</span>
        <button id="emptyAdd" type="button">新規チャット</button>
      </div>
    </div>
  </section>
</div>

<div class="sheetBackdrop" id="sheetBackdrop"><div class="sheet" id="sheet"><div class="handle"></div><div id="sheetBody"></div></div></div>
<div class="toast" id="toast"></div>

<script src="../hj/yos-ai-client.js?v=20260928-live1"></script>
<script src="../hj/yos-auth.js?v=20260930-auth3"></script>
<script src="./app.js?v=20261002-chatonly2"></script>
<script src="./live-chat.js?v=20261002-chatonly2"></script>
<script src="./unified-inbox.js?v=20261002-chatonly2"></script>
</body>
</html>
