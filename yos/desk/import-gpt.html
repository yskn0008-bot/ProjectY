<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07151f">
<title>YOS DESK</title>
<style>
html,body{margin:0;min-height:100%;background:#07151f;color:#f6f1e7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
strong{font-size:22px}p{color:#92a6b2;font-size:15px;line-height:1.5}
</style>
</head>
<body>
<main><div><strong>YOS DESK</strong><p id="status">GPT原文を登録しています…</p></div></main>
<script>
(function(){
  'use strict';
  var KEY='yosDeskIntegratedStateV1';
  function valid(url){
    return /^https:\/\/chatgpt\.com\/(?:g\/[^/]+\/c\/|c\/)[A-Za-z0-9-]+(?:[/?#].*)?$/.test(String(url||'').trim());
  }
  function readState(){
    try{
      var parsed=JSON.parse(localStorage.getItem(KEY)||'null');
      if(parsed&&typeof parsed==='object')return parsed;
    }catch(e){}
    return {version:1,page:'chats',deskOrder:[],board:[],metrics:{opens:0,taps:0,reorders:0,posts:0},chats:[]};
  }
  var params=new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  var url=String(params.get('url')||'').trim();
  var title=String(params.get('title')||'ChatGPT').trim().slice(0,80)||'ChatGPT';
  var project=String(params.get('project')||'ChatGPT').trim().slice(0,80)||'ChatGPT';
  var status=document.getElementById('status');
  if(!valid(url)){
    status.textContent='ChatGPTの元チャットURLを確認できませんでした。';
    return;
  }
  var state=readState();
  state.chats=Array.isArray(state.chats)?state.chats:[];
  var chat=state.chats.find(function(item){return item&&item.url===url});
  if(!chat){
    chat={
      id:'gpt-original-'+Date.now(),
      project:project,
      title:title,
      preview:'ChatGPTの元チャットを開く',
      time:'追加済み',
      unread:0,
      pinned:false,
      avatar:(title.charAt(0)||'G').toUpperCase(),
      tone:'blue',
      alias:'',
      url:url,
      source:'chatgpt'
    };
    state.chats.unshift(chat);
  }else{
    chat.project=project||chat.project;
    chat.title=title||chat.title;
    chat.source='chatgpt';
    chat.unread=0;
  }
  state.activeChatId=chat.id;
  state.page='chats';
  chat.lastOpenedAt=new Date().toISOString();
  localStorage.setItem(KEY,JSON.stringify(state));
  location.replace('./');
})();
</script>
</body>
</html>
