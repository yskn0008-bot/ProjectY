<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5efdc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="YOS">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/yos-icon-180.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="./guide-v2.css">
  <title>YOS｜相談・対処</title>
</head>
<body>
<main class="guide-app">
  <header class="guide-topbar">
    <a class="guide-brand" href="./" aria-label="MY WAYへ戻る">
      <span class="brand-compass" aria-hidden="true">✥</span>
      <span><b>MY WAY</b><small>by YOS</small></span>
    </a>
    <a class="back-link" href="./" aria-label="MY WAYへ戻る">≡</a>
  </header>

  <section class="guide-intro">
    <div><p id="guideGreeting">ようすけ！</p><h2>今日も、自分の道を進もう。</h2></div>
    <div class="compass-seal" aria-hidden="true"><span>✦</span><i></i></div>
  </section>

  <section class="guide-panel">
    <div class="guide-orb" aria-hidden="true">Y</div>
    <p class="eyebrow">YOS GUIDE</p>
    <h1>今日は、どうする？</h1>
    <p class="lead">やりたいことを選ぶだけ。迷ったら「YOSに話す」でOK。</p>

    <button id="askYos" class="primary-route" type="button">
      <span class="primary-icon" aria-hidden="true">✦</span>
      <span><small>迷ったらここ</small><b>YOSに話す</b><em>状況を整理して、次の1手まで案内</em></span>
      <i aria-hidden="true">›</i>
    </button>
    <p id="guideStatus" class="status" role="status" aria-live="polite"></p>

    <div class="divider" aria-hidden="true"><span></span><b>または目的から選ぶ</b><span></span></div>

    <div class="route-list">
      <button type="button" class="route-card daily" data-mode="normal">
        <span class="route-icon" aria-hidden="true">☀︎</span>
        <span><small>日常・判断</small><b>今日を進めたい</b><em>Life / Money / MY WAY</em></span>
        <i aria-hidden="true">›</i>
      </button>
      <button type="button" class="route-card build" data-mode="build">
        <span class="route-icon" aria-hidden="true">◇</span>
        <span><small>開発・修理</small><b>作る・直す</b><em>ProjectY / One Enter</em></span>
        <i aria-hidden="true">›</i>
      </button>
      <button type="button" class="route-card scout" data-mode="scout">
        <span class="route-icon" aria-hidden="true">◎</span>
        <span><small>外部視点</small><b>別の角度で確認</b><em>SCOUT</em></span>
        <i aria-hidden="true">›</i>
      </button>
    </div>

    <section class="quick-grid" aria-label="直接開く">
      <a data-web-only href="shortcuts://run-shortcut?name=Clarity"><span>◉</span><b>Clarityで入力</b><i aria-hidden="true">›</i></a>
      <a data-native-only hidden href="../capture.html"><span>◉</span><b>Clarityで入力</b><i aria-hidden="true">›</i></a>
      <a href="../system/"><span>◇</span><b>System Health</b><i aria-hidden="true">›</i></a>
    </section>

    <div class="guide-rule"><span aria-hidden="true">✓</span><b>機能名を覚えなくてOK。YOSが行き先を決めます。</b></div>

    <section id="guideFallback" class="guide-fallback" hidden>
      <b>相談内容はコピー済みです。</b>
      <p>この端末ではYOSチャットURLの登録が必要です。</p>
      <a href="./">MY WAYへ戻る</a>
    </section>
  </section>
</main>
<script src="./guide-v2.js" defer></script>
</body>
</html>
