<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOS LOOKS</title><style>*{box-sizing:border-box}html,body{margin:0;background:#17191a;color:#f0eee8;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{width:100%;height:100vh;min-height:145px;overflow:hidden;padding:clamp(12px,4vw,24px);display:flex;flex-direction:column;justify-content:center;gap:8px}header{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.15em;color:#c6b28b}header b{font-size:16px}section{display:grid;grid-template-columns:38% 1fr;align-items:center;gap:12px}svg{width:100%;max-height:180px;border-radius:12px;background:#262a2b}h1{margin:0 0 6px;font-size:clamp(16px,4.6vw,28px);letter-spacing:.03em}p{font-size:clamp(12px,3.5vw,19px);line-height:1.45;margin:0}footer{border-top:1px solid #494744;padding-top:7px;color:#c7c3ba;font-size:clamp(10px,3vw,15px);line-height:1.4}small{font-size:9px;color:#a6a29a}body[data-layout="lock"] main{padding:7px;gap:3px}body[data-layout="lock"] section{display:block}body[data-layout="lock"] svg,body[data-layout="lock"] footer,body[data-layout="lock"] small{display:none}body[data-layout="lock"] header b{font-size:11px}body[data-layout="lock"] h1{font-size:14px;margin:0}body[data-layout="lock"] p{font-size:11px}body[data-layout="lock"] main{min-height:0}@media(min-height:330px){section{display:flex;flex-direction:column;align-items:stretch}svg{max-height:42vh}main{gap:12px}h1{font-size:clamp(20px,5vw,32px)}}</style></head><body><main><header><b>YOS LOOKS</b><span id="slot"></span></header><section><svg viewBox="0 0 200 160" role="img" aria-label="外見改善の参考イラスト"><g stroke="#d1c5ae" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M55 150q1-43 32-57v-9m58 66q-1-43-32-57v-9" fill="#3a4245"/><ellipse cx="100" cy="56" rx="34" ry="38" fill="#4d443a"/><path d="M74 54h13m26 0h13m-26 2-3 10h6M91 76q9 3 18 0" opacity=".6"/><g id="visual"></g></g></svg><div><h1 id="title"></h1><p id="action"></p></div></section><footer id="reason"></footer><small>時間帯別の保存済みアドバイス｜休憩中に</small></main><script>const tips=[["姿勢","肩を軽く上げ、息を吐きながらストンと落とす。","胸を張りすぎず、自然な姿勢のほうが落ち着いた印象に。","posture"],["表情","休憩中、上下の歯を少し離して眉間と顎の力を抜く。","顔の力みを減らすと穏やかな印象を作りやすい。","face"],["髪","鏡の前で前髪の根元を軽く整え、横の広がりを抑える。","自然な立体感とすっきりした輪郭が洗練につながる。","hair"],["肌","汗や皮脂は清潔なティッシュで軽く押さえる。","こすらず押さえると肌への摩擦を減らせる。","skin"],["日中のUV","外出前に帽子や日陰を使えるか確認する。","日陰や帽子は紫外線を避ける工夫の一つ。","uv"],["眉","鏡で眉を確認するだけ。気になる毛も今日は抜かない。","必要以上に抜かず、自然な形を保つ。","brow"],["服のサイズ感","鏡で肩線と襟元の位置を確認し、服のしわを軽く整える。","肩の位置が合うと全体のシルエットが整いやすい。","clothes"],["口元","休憩中に水を一口飲み、口元の乾燥を意識する。","口元の清潔感は顔全体の印象にも関わる。","mouth"],["肌の保湿","洗顔後など必要なとき、いつもの保湿剤をやさしくなじませる。","こすらずなじませることで余計な摩擦を避けられる。","moist"]];const icons={"posture":"<path d=\"M58 139 Q53 105 70 94 L90 87 M142 139 Q147 105 130 94 L110 87 M100 92V153\"/><path d=\"M39 102v26m-7-8 7 8 7-8m115-18v26m-7-8 7 8 7-8\" stroke=\"#C6B28B\"/>","face":"<path d=\"M75 52q9-5 18 0m14 0q9-5 18 0M88 74q12 6 24 0\"/><path d=\"M69 66q-6 10 2 17m60-17q6 10-2 17\" stroke=\"#C6B28B\"/>","hair":"<path d=\"M65 48q-4-37 31-37 34 0 40 33-19-6-27-20-18 22-44 24z\" fill=\"#8b7963\"/><path d=\"M90 13 97 2l7 11\" stroke=\"#C6B28B\"/>","skin":"<path d=\"M74 65 55 85l21 22 19-19z\" fill=\"#c6b28b\" opacity=\".7\"/><path d=\"M50 59v13m-6-6h12\" stroke=\"#C6B28B\"/>","uv":"<circle cx=\"154\" cy=\"26\" r=\"12\" stroke=\"#C6B28B\"/><path d=\"M154 6v6m0 28v6m-20-20h6m28 0h6M60 43q38-47 80 0zM50 43h110\" stroke=\"#C6B28B\"/>","brow":"<path d=\"M75 48q8-7 18-3m14 0q10-4 18 3\" stroke=\"#C6B28B\" stroke-width=\"5\"/><path d=\"M74 34h20m12 0h20\" opacity=\".5\"/>","clothes":"<path d=\"M60 105 83 89l17 16 17-16 23 16 19 49H41z\" fill=\"#3a4245\"/><path d=\"M83 89 100 105 117 89m-17 16v45M47 103h25m56 0h25\" stroke=\"#C6B28B\"/>","mouth":"<path d=\"M86 74q14 5 28 0\" stroke=\"#C6B28B\" stroke-width=\"4\"/><path d=\"M145 66q-16 21 0 26 16-5 0-26z\" fill=\"#a8c4c3\" stroke=\"none\"/>","moist":"<path d=\"M148 32q-18 22 0 29 18-7 0-29z\" fill=\"#a8c4c3\" stroke=\"none\"/><path d=\"M57 66q-6 15 12 21\" stroke=\"#C6B28B\"/>"};function draw(){const d=new Date(),j=new Date(d.getTime()+9*3600000),h=j.getUTCHours(),n=Math.floor(d.getTime()/3600000),i=((n%tips.length)+tips.length)%tips.length;const t=(i===4&&(h<6||h>=19))?['翌日のUV対策','起床後の外出で日陰や帽子を使えるか考える。','日中の紫外線対策を先に意識しておく。','uv']:tips[i];document.getElementById('slot').textContent=String(h).padStart(2,'0')+':00';document.getElementById('title').textContent=t[0];document.getElementById('action').textContent=t[1];document.getElementById('reason').textContent=t[2];document.getElementById('visual').innerHTML=icons[t[3]];}if(new URLSearchParams(location.search).get('layout')==='lock')document.body.dataset.layout='lock';draw();setInterval(draw,30000);</script></body></html>
