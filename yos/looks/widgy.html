'use strict';const tips=[["POSTURE","肩の力を抜く。","休憩中、肩を軽く上げて息を吐きながら落とす。","無理に胸を張らず、自然な姿勢で落ち着いた印象に。"],["EXPRESSION","余裕のある表情。","上下の歯を少し離し、眉間と顎の力を抜く。","顔の余計な力みを減らすと、穏やかな印象につながる。"],["HAIR","髪は自然な立体感。","鏡の前で前髪の根元を軽く整える。","トップとサイドのバランスが輪郭をすっきり見せる。"],["SKIN","こすらず、押さえる。","汗や皮脂が気になるときは清潔なティッシュで軽く押さえる。","摩擦を抑えることも肌をいたわる習慣。"],["UV CARE","日差しを味方に。","日中の外出前に帽子や日陰を使えるか確認する。","日陰や帽子は紫外線対策の一つ。"],["BROWS","眉は自然に残す。","鏡で眉を確認するだけ。気になる毛も今日は抜かない。","必要以上に抜かず、自然な形を保つ。"],["STYLE","服は、肩で決まる。","鏡で肩の縫い目と肩先を確認し、襟元を整える。","身体に合ったシルエットが清潔感を引き出す。"],["ORAL CARE","口元にも清潔感を。","休憩中に水を一口飲む。","口元の乾燥が気になるときは、水分補給も意識する。"],["MOISTURE","肌をやさしく扱う。","洗顔後など必要なとき、いつもの保湿剤をやさしくなじませる。","強くこすらず、肌への摩擦を減らす。"],["POSTURE","背中を伸ばしすぎない。","座った状態で、肩をすくめず楽に呼吸する。","力みを減らすと自然で柔らかな立ち姿につながる。"],["EXPRESSION","目元にも余裕を。","鏡を見ながら眉間の力を抜き、軽くまばたきする。","柔らかな目元が話しかけやすい印象を作る。"],["HAIR","横の広がりを整える。","手ぐしでサイドを軽く整える。","輪郭の広がりを抑えると全体がまとまりやすい。"],["SKIN","洗顔後はやさしく。","タオルで顔を拭くとき、擦らず軽く押さえる。","日々の小さな摩擦を減らすことが大切。"],["UV CARE","日陰も活用する。","次の昼間の外出で日陰を使える場所を思い出す。","紫外線を浴びる時間を減らす工夫になる。"],["BROWS","眉を触りすぎない。","眉をこすったり抜いたりせず、鏡で整い具合を見る。","自然な毛流れを残すと表情に馴染みやすい。"],["STYLE","襟元を整える。","襟の折れやねじれがないか確認する。","小さな乱れを整えるだけでも服の印象は変わる。"],["ORAL CARE","口元の力を抜く。","唇を強く結ばず、自然に閉じられる位置を意識する。","口元の力みを減らすと柔らかな表情につながる。"],["MOISTURE","保湿はこすらない。","保湿するときは指の腹でやさしく広げる。","強く擦らずに塗ることで余計な摩擦を避けられる。"],["POSTURE","首を楽にする。","休憩中、肩を下ろし、顔を無理なく正面に向ける。","首や肩が自然な位置にあるとすっきりした印象に。"],["EXPRESSION","自然な口角。","息を吐き、口角を無理に上げず表情を緩める。","作りすぎない表情が自然な親しみやすさにつながる。"],["HAIR","分け目を自然に。","鏡で分け目を確認し、髪の流れを手ぐしで整える。","髪の流れが揃うと清潔感が出やすい。"],["SKIN","顔を触る癖を減らす。","休憩中に無意識に頬や顎を触っていないか確認する。","不要な接触を減らせば摩擦を抑えやすい。"],["UV CARE","外出前のひと工夫。","次の日中の外出に備え、帽子や日傘の場所を確認する。","日差しを避ける準備は短時間でもできる。"],["BROWS","左右差を気にしすぎない。","鏡から少し離れて眉と顔全体を見る。","細部より全体のバランスを意識すると自然に整いやすい。"],["STYLE","袖と裾を整える。","袖口や裾のねじれを軽く直す。","服のラインが整うとシンプルな着こなしもすっきり見える。"],["ORAL CARE","歯の間を意識する。","歯磨きのとき、歯と歯の間も意識する。","口元の清潔感は毎日の小さなケアから。"],["MOISTURE","乾燥に気づく。","洗顔後、肌につっぱり感がないか確認する。","肌の状態を見ながら普段の保湿を続ける。"]];const el=id=>document.getElementById(id);const feed='http function draw(){const now=Date.now(),n=Math.floor(now/3600000),h=new Date(now+9*3600000).getUTCHours(),i=((n%tips.length)+tips.length)%tips.length;const fresh=live&&now-Date.parse(live.slot)<3*3600000;const key=fresh?live.slot+'|'+n:'fallback|'+n;if(shown===key)return;shown=key;let t=tips[i].slice();if(i%9===4&&(h<6||h>=19)){t[1]='次の日差しに備える。';t[2]='起床後の外出で日陰や帽子を使えるか考える。'}if(fresh)t=[live.category,live.title,live.action,live.reason];['category','title','action','reason'].forEach((id,j)=>el(id).textContent=t[j]);el('slot').textContent=(fresh?new Date(Date.parse(live.slot)+9*3600000).getUTCHours():h).toString().padStart(2,'0')+':00';el('status').textContent=fresh?(Math.floor(Date.parse(live.slot)/3600000)===n?'YOS配信・休憩中に':'前回のYOS配信・更新待ち'):'保存済みアドバイス・配信未取得';if(document.body.dataset.layout!=='lock')paintPhoto(fresh?live:null)}
async function refresh(){if(loading)return;loading=true;const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),4500);try{const r=await fetch(feed+'?m='+Math.floor(Date.now()/60000),{cache:'no-store',signal:ac.signal});if(!r.ok)throw Error('feed unavailable');const x=await r.json();if(x.version!==1||!valid(x.latest))throw Error('invalid feed');if(!live||Date.parse(x.latest.slot)>=Date.parse(live.slot))live=x.latest;draw()}catch{}finally{clearTimeout(timer);loading=false}}
