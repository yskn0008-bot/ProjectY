<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121416"><meta name="referrer" content="no-referrer">
<title>YOS Alerts｜通知履歴</title>
<style>
:root{color-scheme:dark;--bg:#121416;--surface:#1c1f22;--line:#373b40;--fg:#ebeef0;--muted:#9ea5ab;--red:#e2a09b;--amber:#dec18f;--green:#b9d1bc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:2px solid #d3dde3;outline-offset:2px}
main{max-width:560px;margin:auto;min-height:100dvh}header{position:sticky;top:0;z-index:5;background:#121416f5;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 14px) 14px 10px}
.heading{display:flex;justify-content:space-between;align-items:center;gap:10px}.eyebrow{font-size:10px;letter-spacing:.14em;color:var(--muted)}
h1{font-size:25px;margin:2px 0 4px;letter-spacing:-.035em}p{margin:5px 0;color:var(--muted)}a{color:#cbd5dd}
.pill{border:1px solid #626970;border-radius:20px;padding:5px 8px;font-size:10px;color:#c5cbd0}
.counts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #494c50;border-radius:9px;overflow:hidden;margin:14px 0 12px}
.counts span{text-align:center;padding:8px 0;font-size:12px}.counts span+span{border-left:1px solid #494c50}.counts b{font-size:16px;margin-left:5px}.counts .a{color:var(--red)}.counts .b{color:var(--amber)}.counts .c{color:var(--green)}
.filters{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}.filters button{white-space:nowrap;background:#26292d;border:1px solid #494d53;border-radius:16px;padding:7px 11px;font-size:11px;color:#c0c4c8}
.filters button[aria-pressed=true]{background:#e8eaeb;border-color:#e8eaeb;color:#15181a;font-weight:700}
.filters .refresh{margin-left:auto;background:none;border-color:#62676d;color:#edf0f2}.search{display:block;width:100%;margin:10px 0 0;padding:9px;background:#24272a;border:1px solid #53575c;border-radius:7px;color:#fff}
#state{padding:11px 15px;color:#c9d0d6;font-size:11px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #363a40}
#state button{background:#e4e7e9;border:0;color:#16181a;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:700}
#message{padding:10px 15px;color:var(--amber);font-size:11px;line-height:1.6}
#googleSignIn{padding:8px 15px}#googleSignIn[hidden],[hidden]{display:none!important}
.columns,.event{display:grid;grid-template-columns:42px minmax(0,1fr) 53px 78px;gap:4px;align-items:center}
.columns{padding:9px 12px;color:var(--muted);font-size:9px;border-bottom:1px solid #52575d}
.day{background:#202327;padding:6px 12px;color:#afb7bd;font-size:10px;border-bottom:1px solid #373b40}
.event{background:transparent;border:0;border-bottom:1px solid #33373b;padding:7px 12px;width:100%;text-align:left;min-height:42px;color:var(--fg)}
.event:active{background:#2a2e32}.time{font-size:11px;font-variant-numeric:tabular-nums}.subject{min-width:0;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px}.category{display:block;color:var(--muted);font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;text-align:center;border-radius:5px;padding:4px 1px;font-size:10px;background:#32373b;color:#cbd0d4}
.tag.action{color:var(--red);background:#482e2b}.tag.wait{color:var(--amber);background:#453a2c}.tag.done{color:var(--green);background:#2c3c32}
.result{text-align:right;font-size:9px;color:#bfc6cc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:26px 14px;color:var(--muted)}.footer{font-size:10px;color:#919aa2;padding:20px 14px 45px}
#detail{position:fixed;inset:0;background:#121416;z-index:10;overflow:auto}
.detail-head{padding:calc(env(safe-area-inset-top) + 16px) 18px 13px;display:flex;align-items:center;gap:15px;border-bottom:1px solid var(--line)}
.detail-head button{background:none;border:0;color:#fff;font-size:25px}.detail-head strong{font-size:17px}
.detail-body{max-width:560px;margin:auto;padding:22px 18px 120px}h2{font-size:23px;line-height:1.35;letter-spacing:-.02em}
.section{border-top:1px solid var(--line);padding:15px 0}.section strong{font-size:13px}.section p{font-size:12px;line-height:1.7;margin:8px 0 0}
.actions{position:fixed;left:0;right:0;bottom:0;background:#171a1df7;border-top:1px solid #50555a;padding:12px 12px calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.actions button{flex:1;max-width:180px;background:#30353a;color:#fff;border:1px solid #626970;border-radius:8px;padding:12px 2px;font-size:12px}
.actions button:first-child{background:#e6eaec;color:#111418;border-color:#e6eaec;font-weight:700}
@media(min-width:650px){#detail .actions{left:calc(50% - 280px);right:calc(50% - 280px)}}
</style></head><body>
<main id="overview"><header>
<div class="heading"><div><div class="eyebrow">YOS / STREAM</div><h1>通知履歴</h1></div><span class="pill" id="mode">未接続</span></div>
<p>受信 → 判断 → 処理結果を、1行で確認</p>
<div class="counts"><span class="a">要対応<b id="countAction">—</b></span><span class="b">未判定<b id="countWaiting">—</b></span><span class="c">記録<b id="countSaved">—</b></span></div>
<div class="filters"><button data-filter="all" aria-pressed="true">すべて</button><button data-filter="action" aria-pressed="false">要対応</button><button data-filter="waiting" aria-pressed="false">未判定</button><button data-filter="done" aria-pressed="false">記録</button><button class="refresh" id="refresh" type="button">更新</button></div>
<input class="search" id="search" type="search" placeholder="通知元・要約を検索（表示中）" aria-label="通知履歴を検索">
</header>
<div id="state"><span id="status">本人認証して既存YOSの履歴を読み込む</span><button id="connect">履歴を取得</button></div>
<div id="googleSignIn" hidden><div id="googleSignInButton"></div></div>
<div id="message" role="status" aria-live="polite">未取得です。0件と断定できません。</div>
<div class="columns"><span>時刻</span><span>通知の概要</span><span>判断</span><span style="text-align:right">処理結果</span></div>
<div id="events" aria-live="polite"></div>
<div class="footer"><a href="./">STREAMへ戻る</a> · <a href="https://app.notion.com/p/3d35ca88289581ef9dc8d5f11ff8e213" rel="noreferrer">既存YOS Inbox</a><p>本人認証付きの既存通知APIから読み取ります。実際の処理結果を確認できない場合は「未確認」と表示します。元アプリの通知は止めません。</p></div>
</main>
<section id="detail" hidden><div class="detail-head"><button id="back" aria-label="履歴に戻る">‹</button><strong>通知の詳細</strong></div>
<div class="detail-body"><div id="detailMeta" class="eyebrow"></div><h2 id="detailTitle"></h2><p id="detailState"></p>
<div class="section"><strong>YOSの判断</strong><p id="detailDecision"></p></div>
<div class="section"><strong>確認できたこと</strong><p id="detailFacts"></p></div>
<div class="section"><strong>次の一手</strong><p id="detailNext"></p></div>
<div class="section"><strong>処理の記録</strong><p id="detailAudit"></p></div></div>
<div class="actions"><button id="openSource">原本を確認</button><button id="later">あとで</button><button id="reported">対応した</button></div></section>
<script src="./hj/yos-auth.js" defer></script>
<script>
(function(){
'use strict';
var API='';
async function selectExistingProvider(){
  if(API)return;
  var res=await fetch('../data/yos-runtime-providers.json',{cache:'no-store',credentials:'omit'});
  if(!res.ok)throw Error('既存の接続先設定を読み込めません');
  var cfg=await res.json();
  var p=(Array.isArray(cfg.providers)?cfg.providers:[]).find(function(x){
    return x.id==='vercel' && x.enabled===true &&
      typeof x.base_url==='string' &&
      Array.isArray(x.certified_routes) && x.certified_routes.includes('notification');
  });
  if(!p)throw Error('通知APIは未公開です。画面は準備済みですが、履歴はまだ読み込めません');
  var parsed=new URL(p.base_url);
  if(parsed.protocol!=='https:'||parsed.username||parsed.password||parsed.search||parsed.hash||parsed.pathname!=='/'||
      parsed.hostname!=='project-y-yos-ai.vercel.app')
    throw Error('既存通知APIの接続先を検証できません');
  API=parsed.origin+'/api/yos/notification';
}
var INBOX='https://app.notion.com/p/3d35ca88289581ef9dc8d5f11ff8e213';
var $=function(id){return document.getElementById(id)};
var rows=[],token='',active='all',selected=null,loading=false,lastComplete=false;
var category={information:'一般通知','missed-call':'不在着信','money-review':'お金・支払',legal:'法務・期限',security:'セキュリティ'};
function text(v,n){return String(v==null?'':v).slice(0,n||120)}
function clean(v){return text(v,130).replace(/[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/g,'[メール非表示]').replace(/(?:\+?81[- ]?)?0\d{1,4}[- ]?\d{2,4}[- ]?\d{3,4}/g,'[電話非表示]').replace(/\b\d{7,}\b/g,'[番号非表示]').replace(/認証コード.{0,45}/g,'[認証情報非表示]').trim()}
function fmt(v,opts){var d=new Date(v);return Number.isNaN(+d)?'日時不明':new Intl.DateTimeFormat('ja-JP',Object.assign({timeZone:'Asia/Tokyo'},opts)).format(d)}
function label(e){if(e.aiState==='complete'&&e.aiDecision==='YOS_ALERT')return ['要対応','action'];if(e.aiState==='pending'||e.aiState==='failed'||!e.aiDecision)return ['未判定','wait'];return ['記録','done']}
function summary(e){var s=clean(e.aiSummary||e.text||'');return s||'要約未確認'}
function node(tag,cls,s){var el=document.createElement(tag);if(cls)el.className=cls;if(s!==undefined)el.textContent=s;return el}
function message(s){$('message').textContent=s}
function render(){
var counts={action:0,wait:0,done:0};rows.forEach(function(e){counts[label(e)[1]]++});
$('countAction').textContent=rows.length?counts.action:'—';$('countWaiting').textContent=rows.length?counts.wait:'—';$('countSaved').textContent=rows.length?counts.done:'—';
var q=$('search').value.toLowerCase().trim(),v=rows.filter(function(e){return (active==='all'||label(e)[1]===active)&&(!q||(summary(e)+' '+(category[e.category]||'通知')).toLowerCase().includes(q))});
var holder=$('events');holder.replaceChildren();var day='';
if(!v.length){holder.append(node('p','empty',rows.length?'該当する通知はありません':'通知はまだ取得されていません'));return}
v.forEach(function(e){
var current=fmt(e.at,{year:'numeric',month:'2-digit',day:'2-digit'}),state=label(e);
if(current!==day){day=current;holder.append(node('div','day',day))}
var b=node('button','event');b.type='button';b.setAttribute('aria-label',summary(e)+' の詳細を開く');
b.append(node('span','time',fmt(e.at,{hour:'2-digit',minute:'2-digit',hourCycle:'h23'})));
var part=node('div','subject');part.append(node('span','',summary(e)));part.append(node('span','category',category[e.category]||'通知'));b.append(part);
b.append(node('span','tag '+state[1],state[0]));
b.append(node('span','result',e.aiState==='complete'?'Inbox確認':'判定未確認'));
b.addEventListener('click',function(){detail(e)});holder.append(b)
})
}
function detail(e){selected=e;$('detailMeta').textContent=fmt(e.at,{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+' · '+(category[e.category]||'通知');
$('detailTitle').textContent=summary(e);
$('detailState').textContent='YOS判断：'+label(e)[0]+' ／ Inbox受付データ';
$('detailDecision').textContent=e.aiState==='complete'?(e.aiDecision==='YOS_ALERT'?'要対応と判定':'追加通知不要と判定'):'AIの判断は未確認です。';
$('detailFacts').textContent='通知が既存Inbox由来のAPI記録として取得されました。本人による対応完了や別DB反映は未確認です。';
$('detailNext').textContent=e.status==='done'?'API上は完了状態です。元の対応結果は別途確認が必要です。':'元の通知を確認し、必要な場合は既存Tasks・Moneyなどで対応します。';
$('detailAudit').textContent='受信時刻：'+fmt(e.at,{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+' ／ AI：'+(e.aiState||'未判定')+' ／ 現在の状態：'+(e.status||'未確認');
$('detail').hidden=false;document.body.style.overflow='hidden'}
function closeDetail(){$('detail').hidden=true;document.body.style.overflow=''}
async function fetchEvents(){
if(!token)throw Error('本人認証がありません');
var out=[],seen=new Set(),cursors=new Set(),cursor='',fully=true;
for(var page=0;page<30;page++){
var url=API+(cursor?'?cursor='+encodeURIComponent(cursor):'');
var res=await fetch(url,{headers:{Authorization:'Bearer '+token,Accept:'application/json'},cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',redirect:'error'});
if(!res.ok)throw Error('通知APIに接続できません（HTTP '+res.status+'）');
var data=await res.json();
if(data.ok!==true||!Array.isArray(data.events))throw Error('履歴APIの形式が確認できません');
data.events.forEach(function(e){if(e&&typeof e.id==='string'&&typeof e.historyKey==='string'&&!seen.has(e.historyKey)&&e.at){seen.add(e.historyKey);out.push(e)}});
fully=fully&&data.complete===true;
if(!data.nextCursor){cursor='';break}
if(cursors.has(data.nextCursor))throw Error('履歴ページが重複しています');
cursors.add(data.nextCursor);cursor=data.nextCursor;
}
if(cursor)fully=false;
out.sort(function(a,b){return Date.parse(b.at)-Date.parse(a.at)});
return {events:out,complete:fully}
}
async function refresh(){
if(loading)return;loading=true;$('connect').disabled=true;$('refresh').disabled=true;
$('status').textContent='履歴を確認しています';message('本人確認・履歴取得中');
try{await selectExistingProvider();if(!token){if(typeof window.YOS_AUTH?.getGoogleIdToken!=='function')throw Error('YOS本体の本人認証が使えません。単体ファイルでは接続できません');token=await window.YOS_AUTH.getGoogleIdToken()}
var data=await fetchEvents();rows=data.events;lastComplete=data.complete;
$('mode').textContent=data.complete?'接続済み':'一部取得';$('status').textContent=rows.length+'件の履歴を取得';
message(data.complete?'既存の通知APIから取得。AI・実処理は確認済み範囲だけ表示します。':'履歴の一部が未取得です。全件表示ではありません。');
render();
}catch(err){message('接続未完了：'+text(err.message,125)+'。以前の表示は保持しています。');$('status').textContent='取得を確認できません';token=''}
finally{loading=false;$('connect').disabled=false;$('refresh').disabled=false}
}
$('connect').addEventListener('click',refresh);$('refresh').addEventListener('click',refresh);
$('search').addEventListener('input',render);
document.querySelectorAll('[data-filter]').forEach(function(b){b.addEventListener('click',function(){active=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});render()})});
$('back').addEventListener('click',closeDetail);
$('openSource').addEventListener('click',function(){window.open(INBOX,'_blank','noopener,noreferrer')});
$('later').addEventListener('click',async function(){
if(!selected||!token){message('認証されていません');return}
if(selected.status==='pending'){alert('既に対応待ちです');return}
if(!confirm('既存Inboxで「対応待ち」にします。支払いの実行・期限通知の予約は行いません。'))return;
var id=selected.historyKey;
try{var response=await fetch(API,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({action:'mark',id:id,status:'pending'}),cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',redirect:'error'});
var data=await response.json();if(!response.ok||data.ok!==true)throw Error('変更失敗');
var saved=await fetch(API+'?id='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+token},cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',redirect:'error'});
var verify=await saved.json();if(!saved.ok||verify.ok!==true||verify.complete!==true||verify.event?.historyKey!==id||verify.event?.status!=='pending')throw Error('保存後の状態が確認できません');
selected.status='pending';alert('対応待ち状態を確認しました。再通知の予約ではありません。');detail(selected);render();
}catch(e){alert('処理は未確認です。もう一度記録の状態を確認してください。')}
});
$('reported').addEventListener('click',function(){alert('本人の対応申告を確定記録する機能はまだ接続されていません。支払い・解決・タスク完了としては記録しません。')});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&token&&!loading)refresh()});
render();
})();
</script></body></html>
