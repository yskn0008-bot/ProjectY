<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050608"><title>YOS Remote</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#050608;color:#f5f6f8}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}main{max-width:520px;margin:auto}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:22px 0 25px}.tab,.key{border:1px solid #39404a;background:#1b1f26;color:#fff;border-radius:18px;padding:13px 6px;font-size:15px;font-weight:700}.tab[aria-selected=true]{background:#263b53;border-color:#4b9aff}.tab span{display:block;font-size:22px}.panel{border:1px solid #464b55;border-radius:28px;padding:18px 14px 24px;background:linear-gradient(#101216,#07080a)}h1{font-size:23px;margin:0 0 10px}.muted{color:#9ca3ae;font-size:13px}.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0 28px}.key{min-height:60px}h2{font-size:17px;color:#c6cbd3;margin:28px 0 14px}.swatches{display:flex;justify-content:space-between;gap:8px}.swatch{border:3px solid #666;border-radius:50%;width:46px;aspect-ratio:1;min-width:0}.range{width:100%;accent-color:white;margin:22px 0}.temps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.temps .key{font-size:13px;min-height:55px}#status{margin:18px 0;min-height:40px;color:#b9c1cc;font-size:13px}.offline{color:#ffca8a!important}button:disabled{opacity:.45}button:focus-visible,input:focus-visible{outline:2px solid #5ba5ff}footer{font-size:12px;color:#8b939e;line-height:1.7;margin:24px 8px}
</style></head><body><main><nav class="tabs" aria-label="家電"><button class="tab" data-tab="tv"><span>▣</span>テレビ</button><button class="tab" data-tab="light"><span>☀</span>照明</button><button class="tab" data-tab="ac"><span>❄</span>エアコン</button><button class="tab" data-tab="floor"><span>◉</span>ランプ</button></nav><section class="panel"><h1 id="heading"></h1><div id="subtitle" class="muted"></div><div id="controls"></div><p id="status" role="status" aria-live="polite"></p></section><footer>安全設計：操作API未接続時は家電への命令を送信しません。接続済み・操作成功と誤表示しません。</footer></main><script>
'use strict';
const devices={tv:'テレビ',light:'照明',ac:'エアコン',floor:'フロアランプ'};
const commands={tv:[['power','電源'],['input','入力'],['home','ホーム'],['back','戻る'],['up','↑'],['down','↓'],['left','←'],['right','→'],['confirm','OK'],['volumeDown','音量 −'],['mute','消音'],['volumeUp','音量 ＋']],light:[['on','点灯'],['off','消灯'],['bright','明るく'],['dark','暗く'],['night','常夜灯']],ac:[['cool','冷房'],['dry','除湿'],['heat','暖房'],['stop','停止'],['tempDown','温度 −'],['tempUp','温度 ＋']],floor:[['on','点灯'],['off','消灯']]};
let active='floor';const status=document.querySelector('#status');
function report(message,error=false){status.textContent=message;status.classList.toggle('offline',error)}
async function send(action,value){report('通信中…');try{const response=await fetch('/api/remote/command',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({device:active,action,value})});let result;try{result=await response.json()}catch{throw Error('応答を読み取れません')}if(!response.ok||result.ok!==true)throw Error(result.error||'操作を確認できません');report('操作を確認しました')}catch(e){report('未実行・未確認：'+e.message,true)}}
function button(action,label){const b=document.createElement('button');b.className='key';b.textContent=label;b.addEventListener('click',()=>send(action));return b}
function heading(text){const h=document.createElement('h2');h.textContent=text;return h}
function render(){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===active)));document.querySelector('#heading').textContent=devices[active];document.querySelector('#subtitle').textContent='YOS Remote Web · 接続状態は未確認';const root=document.querySelector('#controls');root.replaceChildren();const keys=document.createElement('div');keys.className='keys';commands[active].forEach(([a,l])=>keys.append(button(a,l)));root.append(keys);if(active==='floor'){root.append(heading('カラープリセット'));const swatches=document.createElement('div');swatches.className='swatches';[['#ffd5aa','暖色'],['#2444ff','青'],['#ff2828','赤'],['#00d52f','緑'],['#a72df4','紫'],['#fff04d','黄']].forEach(([hex,label])=>{const b=document.createElement('button');b.className='swatch';b.style.background=hex;b.title=label;b.setAttribute('aria-label',label);b.addEventListener('click',()=>send('color',hex));swatches.append(b)});root.append(swatches,heading('明るさ'));const range=document.createElement('input');range.type='range';range.className='range';range.min=1;range.max=100;range.value=1;range.setAttribute('aria-label','明るさ');range.addEventListener('change',()=>send('brightness',Number(range.value)));root.append(range,heading('白色・色温度'));const temps=document.createElement('div');temps.className='temps';[['warm','暖色'],['natural','自然色'],['daywhite','昼白色'],['daylight','昼光色']].forEach(([a,l])=>temps.append(button(a,l)));root.append(temps)}report('通信経路の検証待ち。操作できる状態ではありません。',true)}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.tab;render()}));render();
</script></body></html>
