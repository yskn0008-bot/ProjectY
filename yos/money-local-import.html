<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070B">
<title>MY MONEY 更新</title>
<style>
html,body{margin:0;min-height:100%;background:#05070B;color:#f4f6fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
main{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
div{text-align:center}b{display:block;font-size:22px;margin-bottom:8px}span{color:#93a0b8;font-size:14px}
</style>
</head>
<body>
<main><div><b id="title">MY MONEYを更新中</b><span id="status">この端末だけに反映します</span></div></main>
<script>
(()=>{
  const title=document.getElementById('title'),status=document.getElementById('status');
  const fail=msg=>{title.textContent='更新できませんでした';status.textContent=msg};
  try{
    const KEY='yos-money-v2',hash=String(location.hash||'').replace(/^#/,'');
    const part=hash.split('&').find(x=>x.startsWith('mi='));
    if(!part){fail('更新データがありません');return}
    const raw=part.slice(3).replace(/-/g,'+').replace(/_/g,'/');
    const padded=raw+'='.repeat((4-raw.length%4)%4);
    const bytes=Uint8Array.from(atob(padded),c=>c.charCodeAt(0));
    const payload=JSON.parse(new TextDecoder().decode(bytes));
    if(!payload||payload.v!==1||!Array.isArray(payload.ops)){fail('更新データを確認できません');return}
    const saved=JSON.parse(localStorage.getItem(KEY)||'null')||{};
    const data={
      ...saved,
      version:2,
      accounts:Array.isArray(saved.accounts)?saved.accounts:[],
      transactions:Array.isArray(saved.transactions)?saved.transactions:[],
      recurring:Array.isArray(saved.recurring)?saved.recurring:[],
      debts:Array.isArray(saved.debts)?saved.debts:[],
      goals:Array.isArray(saved.goals)?saved.goals:[],
      assets:Array.isArray(saved.assets)?saved.assets:[]
    };
    const num=v=>Number.isFinite(Number(v))?Number(v):0;
    const txt=(v,max=80)=>String(v??'').trim().slice(0,max);
    let changed=false;
    for(const op of payload.ops.slice(0,20)){
      if(!op||typeof op!=='object')continue;
      if(op.kind==='replace-liquid'){
        const amount=Math.max(0,num(op.amount)),now=new Date().toISOString();
        let cash=data.accounts.findIndex(a=>a?.type==='cash'||txt(a?.name,50)==='現金');
        if(cash<0){data.accounts.push({id:'acct-local-cash',type:'cash',name:'現金',balance:0,updatedAt:now});cash=data.accounts.length-1}
        data.accounts=data.accounts.map((a,i)=>i===cash
          ?{...a,type:'cash',name:a.name||'現金',balance:amount,updatedAt:now}
          :{...a,balance:0,updatedAt:now});
        changed=true;
      }else if(op.kind==='mark-paid'){
        const date=txt(op.date,10),amount=Math.max(0,num(op.amount)),label=txt(op.label,60);
        let found=data.transactions.findIndex(tx=>txt(tx?.date,10)===date&&num(tx?.amount)===amount&&(!label||txt(tx?.label,60)===label));
        if(found<0)found=data.transactions.findIndex(tx=>txt(tx?.date,10)===date&&num(tx?.amount)===amount);
        if(found>=0)data.transactions[found]={...data.transactions[found],status:'done',paid:true,completed:true};
        else if(date&&amount)data.transactions.push({id:'local-paid-'+date+'-'+amount,date,type:'debt',category:'debt',label:label||'返済',amount,status:'done',paid:true,completed:true,imported:true});
        changed=true;
      }else if(op.kind==='upsert-transaction'){
        const date=txt(op.date,10),label=txt(op.label,60),amount=Math.max(0,num(op.amount));
        if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!label||!amount)continue;
        const id=txt(op.id,80)||('local-'+date+'-'+amount+'-'+label);
        const item={id,date,type:['income','expense','debt','saving','investment'].includes(op.type)?op.type:'expense',category:txt(op.category,30)||'other',label,amount,status:op.status==='done'?'done':'planned',imported:true};
        const at=data.transactions.findIndex(tx=>tx?.id===id||(txt(tx?.date,10)===date&&num(tx?.amount)===amount&&txt(tx?.label,60)===label));
        if(at>=0)data.transactions[at]={...data.transactions[at],...item,id:data.transactions[at].id||id};
        else data.transactions.push(item);
        changed=true;
      }
    }
    if(!changed){fail('更新対象がありません');return}
    data.updatedAt=new Date().toISOString();
    localStorage.setItem(KEY,JSON.stringify(data));
    title.textContent='反映しました';
    status.textContent='MY MONEYを開きます';
    setTimeout(()=>location.replace('./?v=local-import-1#money'),250);
  }catch(e){fail('もう一度リンクを開いてください')}
})();
</script>
</body>
</html>
