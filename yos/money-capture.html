<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070B">
<title>Money クイック入力</title>
<style>
html,body{margin:0;min-height:100%;background:#05070B;color:#f4f6fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
main{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
section{width:min(100%,420px)}small{color:#93a0b8}h1{font-size:28px;margin:8px 0 18px}
form{display:grid;gap:12px}input{width:100%;box-sizing:border-box;border:1px solid #26334d;border-radius:16px;background:#0a1630;color:#fff;padding:16px;font-size:18px}
button{border:0;border-radius:14px;padding:14px 16px;background:#4da3ff;color:#03101f;font-size:16px;font-weight:800}
p{color:#93a0b8;font-size:13px;line-height:1.5}.error{color:#ff8c8c}
</style>
</head>
<body>
<main><section><small>MY MONEY</small><h1>クイック入力</h1>
<form id="form"><input id="text" autocomplete="off" enterkeyhint="done" placeholder="例：コンビニ850円" autofocus><button>記録する</button></form>
<p id="status">入力すると、このiPhoneのMoneyへすぐ反映します。</p>
</section></main>
<script>
(()=>{
  const input=document.getElementById('text'),form=document.getElementById('form'),status=document.getElementById('status');
  const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());
  const amountOf=text=>{
    const man=text.match(/(\d+(?:\.\d+)?)\s*万(?:円)?/);if(man)return Math.round(Number(man[1])*10000);
    const yen=text.match(/[¥￥]?\s*(\d{1,3}(?:,\d{3})+|\d+)\s*(?:円|えん)/i);return yen?Number(yen[1].replace(/,/g,'')):null;
  };
  const category=text=>{
    if(/家賃|住宅|管理費/.test(text))return 'housing';
    if(/電気|ガス|水道|通信|携帯|ネット|icloud|chatgpt|youtube|moneyforward/i.test(text))return 'utilities';
    if(/食|コンビニ|スーパー|マック|スタバ|弁当|ランチ|ご飯/.test(text))return 'food';
    if(/ガソリン|駐車|交通|電車|バス|タクシー|車保険/.test(text))return 'transport';
    if(/病院|薬|診療|歯医者/.test(text))return 'health';
    if(/洗剤|ティッシュ|日用品|ダイソー|100均/.test(text))return 'daily';
    if(/映画|ゲーム|カラオケ|本|漫画/.test(text))return 'entertainment';
    if(/返済|借金/.test(text))return 'debt';
    return 'other';
  };
  const encode=value=>{
    const bytes=new TextEncoder().encode(JSON.stringify(value));let binary='';
    for(const byte of bytes)binary+=String.fromCharCode(byte);
    return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  };
  function build(raw){
    const text=String(raw||'').trim(),amount=amountOf(text);
    if(!text)return {error:'入力が空です'};
    if(!amount||amount<=0)return {error:'金額を読み取れませんでした'};
    const date=today();
    if(/残高|使える(?:お金|金)/.test(text)){
      return {payload:{v:1,ops:[{kind:'replace-liquid',amount}]}};
    }
    const type=/家賃収入|給料|給与|入金|収入|返金/.test(text)?'income':(/返済|借金/.test(text)?'debt':'expense');
    let label=text
      .replace(/[¥￥]?\s*\d+(?:\.\d+)?\s*万(?:円)?/g,'')
      .replace(/[¥￥]?\s*(?:\d{1,3}(?:,\d{3})+|\d+)\s*(?:円|えん)/gi,'')
      .replace(/(使った|払った|支払った|購入した|買った|入った|入金した|です|だった)/g,'')
      .replace(/[、,。.!！?？]/g,' ').trim();
    if(!label)label=type==='income'?'入金':'支出';
    return {payload:{v:1,ops:[{kind:'upsert-transaction',date,type,category:category(text),label,amount,status:/予定|引き落とし予定/.test(text)?'planned':'done'}]}};
  }
  function submit(raw){
    const result=build(raw);
    if(result.error){status.textContent=result.error;status.className='error';return}
    location.replace('./money-local-import.html#mi='+encode(result.payload));
  }
  form.addEventListener('submit',event=>{event.preventDefault();submit(input.value)});
  const preset=new URLSearchParams(location.search).get('text');
  if(preset){input.value=preset;submit(preset)}
})();
</script>
</body>
</html>
