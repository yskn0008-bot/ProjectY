<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f0df">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="YOS">
  <meta name="description" content="困った・迷った・作りたい・直したい時に、YOSへそのまま相談する入口。">
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/yos-icon-180.png">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>YOS 相談・対処｜MY WAY</title>
</head>
<body>
  <main class="consult-app">
    <header class="consult-header">
      <a class="header-back" href="../" aria-label="MY WAYへ戻る">＜</a>
      <div class="header-title"><small>YOS</small><strong>相談・対処</strong></div>
      <a class="header-myway" href="../">MY WAY</a>
    </header>

    <section class="hero glass-card" aria-labelledby="consultTitle">
      <div class="sun-mark" aria-hidden="true"><span>✦</span></div>
      <p class="eyebrow">YOS ROUTING</p>
      <h1 id="consultTitle">何かあった？</h1>
      <p class="hero-copy">そのまま話せばOK。<br>どこで処理するかはYOSが決めます。</p>

      <label class="sr-only" for="consultInput">相談内容</label>
      <textarea id="consultInput" rows="6" maxlength="4000" enterkeyhint="send" placeholder="例：エアコンの風量が変わらない&#10;例：これを自動化したい&#10;例：この判断を別の視点で確認したい"></textarea>
      <button id="sendConsult" class="primary-button" type="button">YOSに相談する</button>
      <p id="consultStatus" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="assist-section" aria-labelledby="assistTitle">
      <header>
        <small>入力しなくても進めます</small>
        <h2 id="assistTitle">今の状態に近いもの</h2>
      </header>
      <div class="assist-grid">
        <button class="assist-card" type="button" data-assist="organize">
          <span class="assist-icon" aria-hidden="true">◎</span>
          <span><b>状況を整理したい</b><small>困った・迷った</small></span>
          <i aria-hidden="true">›</i>
        </button>
        <button class="assist-card" type="button" data-assist="build">
          <span class="assist-icon" aria-hidden="true">◇</span>
          <span><b>作る・直す</b><small>開発・修理・自動化</small></span>
          <i aria-hidden="true">›</i>
        </button>
        <button class="assist-card" type="button" data-assist="second-view">
          <span class="assist-icon" aria-hidden="true">◌</span>
          <span><b>別の角度で確認</b><small>見落とし・前提確認</small></span>
          <i aria-hidden="true">›</i>
        </button>
      </div>
    </section>

    <section class="quick-section" aria-labelledby="quickTitle">
      <header><small id="quickTitle">QUICK ACTIONS</small></header>
      <div class="quick-grid">
        <a class="quick-card" data-web-only href="shortcuts://run-shortcut?name=Clarity">
          <span>Clarity</span><small>記録・実行</small>
        </a>
        <a class="quick-card" data-native-only hidden href="../../capture.html">
          <span>Clarity</span><small>記録・実行</small>
        </a>
        <a class="quick-card" href="../../system/">
          <span>System Health</span><small>故障・状態確認</small>
        </a>
      </div>
    </section>

    <aside id="handoffFallback" class="fallback-card" hidden>
      <strong>相談内容はコピーしました。</strong>
      <p>YOSチャットURLがまだこの端末に登録されていません。</p>
      <a href="../">MY WAYへ戻る</a>
    </aside>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
